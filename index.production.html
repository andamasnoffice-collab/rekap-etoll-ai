      window.rekaptollAuth = firebase.auth();
      window.rekaptollAuth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(console.error);
      const _nativeFetch = window.fetch.bind(window);
      window.fetch = async (input, init = {}) => {
        const rawUrl = typeof input === 'string' ? input : input.url;
        let parsed;
        try { parsed = new URL(rawUrl, window.location.href); } catch (_) { return _nativeFetch(input, init); }
        if (!parsed.hostname.endsWith('firebasedatabase.app')) return _nativeFetch(input, init);
        const user = window.rekaptollAuth.currentUser;
        if (!user) return new Response(JSON.stringify({ error: 'AUTH_REQUIRED' }), { status: 401, headers: { 'Content-Type': 'application/json' } });
        const token = await user.getIdToken();
        parsed.searchParams.set('auth', token);
        const headers = new Headers(init.headers || (input instanceof Request ? input.headers : undefined));
        headers.set('Accept', 'application/json');
        return _nativeFetch(new Request(parsed.toString(), { ...init, headers }));
      };

    <script type="text/babel">
        function safeStorageGet(key, fallback = null) {
            try {
                const value = localStorage.getItem(key);
                return value === null ? fallback : value;
            } catch (e) {
                console.warn('localStorage read failed:', key, e);
                return fallback;
            }
        }

        function safeStorageSet(key, value) {
            try {
                localStorage.setItem(key, value);
                return true;
            } catch (e) {
                console.warn('localStorage write failed:', key, e);
                return false;
            }
        }

        function getLocalDateString(date = new Date()) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function compressImageDataUrl(dataUrl, maxWidth = 1280, quality = 0.72) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => {
                    const scale = Math.min(1, maxWidth / img.naturalWidth);
                    const canvas = document.createElement('canvas');
                    canvas.width = Math.max(1, Math.round(img.naturalWidth * scale));
                    canvas.height = Math.max(1, Math.round(img.naturalHeight * scale));
                    const ctx = canvas.getContext('2d', { alpha: false });
                    if (!ctx) return reject(new Error('Browser tidak mendukung Canvas untuk kompresi gambar.'));
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    resolve(canvas.toDataURL('image/jpeg', quality));
                };
                img.onerror = () => reject(new Error('Gambar struk tidak dapat dibaca.'));
                img.src = dataUrl;
            });
        }

        function formatRupiah(number) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(number || 0);
        }

        function formatNumberOnly(number) {
            return new Intl.NumberFormat('id-ID', { maximumFractionDigits: 0 }).format(number || 0);
        }

        function formatDateIndo(dateString) {
            if (!dateString) return '-';
            const date = new Date(dateString);
            if (isNaN(date.getTime())) return dateString;
            return new Intl.DateTimeFormat('id-ID', { day: 'numeric', month: 'short', year: 'numeric' }).format(date);
        }

        function formatCardNumber(val) {
            if (!val) return '';
            const cleaned = val.toString().replace(/\D/g, '').slice(0, 16);
            return cleaned.replace(/(\d{4})(?=\d)/g, '$1 ').trim();
        }

        function terbilangRupiah(num) {
            const angka = ["", "Satu", "Dua", "Tiga", "Empat", "Lima", "Enam", "Tujuh", "Delapan", "Sembilan", "Sepuluh", "Sebelas"];
            num = Math.floor(Math.abs(Number(num) || 0));
            if (num === 0) return "Nol Rupiah";

            function terbilang(n) {
                if (n < 12) return angka[n];
                if (n < 20) return terbilang(n - 10) + " Belas";
                if (n < 100) return terbilang(Math.floor(n / 10)) + " Puluh " + (n % 10 !== 0 ? terbilang(n % 10) : "");
                if (n < 200) return "Seratus " + (n - 100 !== 0 ? terbilang(n - 100) : "");
                if (n < 1000) return terbilang(Math.floor(n / 100)) + " Ratus " + (n % 100 !== 0 ? terbilang(n % 100) : "");
                if (n < 2000) return "Seribu " + (n - 1000 !== 0 ? terbilang(n - 1000) : "");
                if (n < 1000000) return terbilang(Math.floor(n / 1000)) + " Ribu " + (n % 1000 !== 0 ? terbilang(n % 1000) : "");
                if (n < 1000000000) return terbilang(Math.floor(n / 1000000)) + " Juta " + (n % 1000000 !== 0 ? terbilang(n % 1000000) : "");
                if (n < 1000000000000) return terbilang(Math.floor(n / 1000000000)) + " Miliar " + (n % 1000000000 !== 0 ? terbilang(n % 1000000000) : "");
                return terbilang(Math.floor(n / 1000000000000)) + " Triliun " + (n % 1000000000000 !== 0 ? terbilang(n % 1000000000000) : "");
            }
            return terbilang(num).replace(/\s+/g, ' ').trim() + " Rupiah";
        }

        function detectBankFromCardNumber(cardNum, merchant = '') {
            const clean = (cardNum || '').replace(/\D/g, '');
            const m = (merchant || '').toLowerCase();
            
            if (clean.startsWith('6032') || clean.startsWith('6087') || clean.startsWith('6031') || clean.startsWith('5899') || clean.startsWith('6035') || m.includes('mandiri') || m.includes('e-money') || m.includes('livin')) {
                return { bank: 'Mandiri', color: 'from-blue-600 via-indigo-700 to-blue-900', label: 'Mandiri e-Money' };
            }
            if (clean.startsWith('6013') || clean.startsWith('6019') || clean.startsWith('6014') || clean.startsWith('6015') || m.includes('bca') || m.includes('flazz')) {
                return { bank: 'BCA', color: 'from-sky-600 via-blue-700 to-indigo-950', label: 'BCA Flazz' };
            }
            if (clean.startsWith('6018') || clean.startsWith('5379') || clean.startsWith('5221') || m.includes('bri') || m.includes('brizzi')) {
                return { bank: 'BRI', color: 'from-cyan-600 via-blue-800 to-blue-950', label: 'BRI Brizzi' };
            }
            if (clean.startsWith('1515') || clean.startsWith('7546') || clean.startsWith('5401') || m.includes('bni') || m.includes('tapcash')) {
                return { bank: 'BNI', color: 'from-amber-600 via-orange-700 to-slate-900', label: 'BNI TapCash' };
            }
            if (clean.startsWith('6030') || m.includes('jakcard') || m.includes('dki')) {
                return { bank: 'Bank DKI', color: 'from-emerald-600 via-teal-700 to-slate-900', label: 'DKI JakCard' };
            }

            return { bank: 'BCA', color: 'from-sky-600 via-blue-700 to-indigo-950', label: 'BCA Flazz' };
        }

        function getGoogleDriveDirectImageUrl(url) {
            if (!url) return '';
            const cleanUrl = String(url).trim();
            if (cleanUrl.startsWith('data:image')) return cleanUrl;

            let fileId = null;
            const match1 = cleanUrl.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
            if (match1 && match1[1]) {
                fileId = match1[1];
            } else {
                const match2 = cleanUrl.match(/id=([a-zA-Z0-9_-]+)/);
                if (match2 && match2[1]) {
                    fileId = match2[1];
                } else if (/^[a-zA-Z0-9_-]{25,}$/.test(cleanUrl)) {
                    fileId = cleanUrl;
                }
            }

            if (fileId) {
                return `https://drive.google.com/thumbnail?id=${fileId}&sz=w2500`;
            }
            return cleanUrl;
        }

        async function callGeminiOCR(base64DataUrl, userApiKey) {
            let mimeType = "image/jpeg";
            let base64Data = base64DataUrl;
            const match = base64DataUrl.match(/^data:(image\/[a-zA-Z0-9.+]+);base64,(.+)$/);
            if (match) {
                mimeType = match[1];
                base64Data = match[2];
            }

            const apiKey = (userApiKey || "").trim();
            if (!apiKey) {
                throw new Error("API Key Gemini belum diisi. Silakan masukkan API Key Gemini Anda.");
            }

            const systemPrompt = "Anda adalah sistem OCR multimodal khusus mengekstrak data dari invoice/struk e-Toll Indonesia (e-Money, BCA Flazz, Brizzi, Tapcash, Livin, Tokopedia, Indomaret, dll). Ekstrak data secara tepat.";
            const userPrompt = "Analisis foto struk ini. Ekstrak:\n1. etollNumber: 16-digit nomor kartu e-Toll\n2. merchant: Nama driver atau tempat/aplikasi pembelian\n3. amount: Total nominal (angka murni tanpa titik/koma)\n4. invoiceNumber: Nomor resi / invoice / referensi\n5. date: Tanggal transaksi (YYYY-MM-DD)";

            // Prioritaskan model stable yang ada di Google AI Studio
            const modelNames = ["gemini-1.5-flash", "gemini-2.0-flash", "gemini-1.5-pro", "gemini-2.5-flash"];
            let lastError = null;

            for (const model of modelNames) {
                try {
                    const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
                    const payload = {
                        contents: [{ role: "user", parts: [{ text: userPrompt }, { inlineData: { mimeType, data: base64Data } }] }],
                        systemInstruction: { parts: [{ text: systemPrompt }] },
                        generationConfig: {
                            responseMimeType: "application/json",
                            responseSchema: {
                                type: "OBJECT",
                                properties: {
                                    etollNumber: { type: "STRING" },
                                    merchant: { type: "STRING" },
                                    amount: { type: "NUMBER" },
                                    invoiceNumber: { type: "STRING" },
                                    date: { type: "STRING" }
                                },
                                required: ["etollNumber", "merchant", "amount", "invoiceNumber", "date"]
                            }
                        }
                    };

                    const response = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                    if (!response.ok) {
                        const errJson = await response.json().catch(() => ({}));
                        throw new Error(errJson.error?.message || `HTTP ${response.status} pada model ${model}`);
                    }

                    const result = await response.json();
                    const text = result?.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (!text) {
                        throw new Error("Respons AI kosong atau diblokir oleh filter keamanan.");
                    }

                    const cleanJsonStr = text.replace(/```json/g, '').replace(/```/g, '').trim();
                    const parsed = JSON.parse(cleanJsonStr);

                    if (parsed.amount) {
                        parsed.amount = parseFloat(String(parsed.amount).replace(/[^0-9.]/g, '')) || 0;
                    }
                    return parsed;
                } catch (err) {
                    console.warn(`Percobaan model ${model} gagal:`, err.message);
                    lastError = err;
                }
            }

            throw lastError || new Error("Gagal memproses OCR via Gemini API.");
        }

    <script type="text/babel">
        function MasterDataTab({ cards, setCards, transactions, setTransactions, setMonthlyDeposits, firebaseProjectId, fetchCloudData, showToastNotification, handleAddCard, deletedCardNumbers, setDeletedCardNumbers, pushToCloud }) {
            const [securityModal, setSecurityModal] = React.useState(null);
            const [passwordInput, setPasswordInput] = React.useState('');

            const [showNewCardInput, setShowNewCardInput] = React.useState(false);
            const [newCardData, setNewCardData] = React.useState({ label: '', nopol: '', number: '', bank: 'BCA' });

            const [masterListsLoaded, setMasterListsLoaded] = React.useState(false);

            React.useEffect(() => {
                const unsubscribe = window.rekaptollAuth.onIdTokenChanged(async user => {
                    setAuthUser(user || null);
                    if (!user) {
                        setAuthClaims({});
                        setIsAdminMode(false);
                        return;
                    }
                    try {
                        const result = await user.getIdTokenResult(true);
                        const claims = result.claims || {};
                        setAuthClaims(claims);
                        setIsAdminMode(claims.admin === true);
                    } catch (err) {
                        console.error('[Auth] Gagal membaca custom claims:', err);

                        setIsAdminMode(false);

            const openAdminLogin = async () => {
                if (authUser) {
                    await window.rekaptollAuth.signOut();

                    showToastNotification('Keluar dari akun RekapToll.', 'info');

            const confirmAdminLogin = async () => {

                    const credential = await window.rekaptollAuth.signInWithEmailAndPassword(adminEmailInput.trim(), adminPasswordInput);
                    const tokenResult = await credential.user.getIdTokenResult(true);
                    const claims = tokenResult.claims || {};
                    setAuthClaims(claims);
                    setAuthUser(credential.user);
                    if (claims.admin !== true && claims.reader !== true) {
                        await window.rekaptollAuth.signOut();
                        throw new Error('Akun belum memiliki hak akses admin atau reader.');
                    }
                    setIsAdminMode(claims.admin === true);
                    setShowAdminLogin(false);
                    setAdminPasswordInput('');
                    setAdminEmailInput('');
                    setAdminPassError('');
                    showToastNotification(claims.admin === true ? 'Login admin berhasil.' : 'Login reader berhasil (akses baca saja).', 'success');

                    setAdminPassError(err.message || 'Login Firebase gagal.');

            const saveAdminPasswordChange = async () => {

            const handleAdminTab = (tab) => {
                if (!isAdminMode) {

                setActiveTab(tab);

            const handleUpdateDeposit = async (monthKey, amount, depositDate = getLocalDateString(), proofData = '', proofName = '') => {
                if (!isAdminMode) { openAdminLogin(); showToastNotification('Mode Admin diperlukan untuk mengubah Deposit Kasbon.', 'info'); return false; }
                const targetMonth = (!monthKey || monthKey === 'ALL') ? currentYearMonth : monthKey;
                const num = Math.max(0, Number(amount) || 0);
                if (!/^\d{4}-\d{2}$/.test(targetMonth) || !/^\d{4}-\d{2}-\d{2}$/.test(depositDate) || depositDate.slice(0,7) !== targetMonth) {
                    showToastNotification('Tanggal pengisian harus berada pada bulan/periode yang dipilih.', 'error'); return false;
                }
                if (num <= 0) { showToastNotification('Masukkan nominal pengisian lebih dari Rp0.', 'error'); return false; }
                showToastNotification('Data deposit hanya dimasukkan melalui Bot Telegram. Dashboard ini baca-saja.', 'info');
                return false;
                const previousEntries = monthlyDepositHistory[targetMonth] || [];
                // Kompatibilitas data lama: nominal bulanan lama dipertahankan sebagai saldo awal
                // hanya saat belum ada riwayat setoran untuk periode tersebut.
                const legacyOpening = previousEntries.length ? 0 : Math.max(0, Number(monthlyDeposits[targetMonth]) || 0);
                const openingEntry = legacyOpening > 0 ? [{ id: `opening_${targetMonth}`, date: `${targetMonth}-01`, amount: legacyOpening, proofData: '', proofName: '', note: 'Saldo awal dari data sebelumnya', createdAt: new Date().toISOString() }] : [];
                const entry = { id: `dep_${Date.now()}_${Math.random().toString(36).slice(2,8)}`, date: depositDate, amount: num, proofData: proofData || '', proofName: proofName || '', createdAt: new Date().toISOString() };
                const nextEntries = [...openingEntry, ...previousEntries, entry];
                const nextHistory = { ...monthlyDepositHistory, [targetMonth]: nextEntries };
                const updated = { ...monthlyDeposits, [targetMonth]: nextEntries.reduce((sum, item) => sum + (Number(item.amount) || 0), 0) };
                setMonthlyDeposits(updated);
                setMonthlyDepositHistory(nextHistory);
                safeStorageSet('etoll_monthly_deposits', JSON.stringify(updated));
                safeStorageSet('etoll_monthly_deposit_history', JSON.stringify(nextHistory));
                const results = await Promise.all([pushToCloud('monthlyDeposits', updated), pushToCloud(`monthlyDepositHistory/${targetMonth}`, nextHistory[targetMonth])]);
                if (results.some(x => x === false)) {
                    showToastNotification(`Deposit ${targetMonth} tersimpan lokal, tetapi sinkronisasi Firebase gagal.`, 'error');
                    return false;
                }
                showToastNotification(`Pengisian kasbon ${formatDateIndo(depositDate)} sebesar ${formatRupiah(num)} berhasil disimpan.`);
                return true;
            };

            const openDepositModalForMonth = (m) => {
                const target = (!m || m === 'ALL') ? currentYearMonth : m;
                setDepositModalMonth(target);
                setEditingDepositId(null);
                setDepositModalValue('');
                setDepositModalDate(getLocalDateString().slice(0,7) === target ? getLocalDateString() : `${target}-01`);
                setDepositProofData('');
                setDepositProofName('');
                setShowDepositModal(true);
            };

            const persistDepositHistory = async (month, entries, successMessage) => {
                showToastNotification('Koreksi riwayat deposit hanya dapat dilakukan melalui Bot Telegram. Dashboard ini baca-saja.', 'info');
                return false;
            };

            const startEditDeposit = (month, item) => {
                if (!isAdminMode) { openAdminLogin(); showToastNotification('Mode Admin diperlukan untuk mengedit riwayat deposit.', 'info'); return; }
                if (String(item.id || '').startsWith('opening_')) {
                    showToastNotification('Saldo awal bawaan tidak dapat diedit sebagai setoran. Tambahkan setoran baru untuk koreksi.', 'info');
                    return;
                }
                setDepositModalMonth(month);
                setDepositModalValue(String(item.amount || 0));
                setDepositModalDate(item.date || `${month}-01`);
                setDepositProofData(item.proofData || '');
                setDepositProofName(item.proofName || '');
                setEditingDepositId(item.id);
            };

            const saveDepositEdit = async () => {
                showToastNotification('Edit deposit melalui dashboard dinonaktifkan. Gunakan Bot Telegram.', 'info');
                return false;
            };

            const deleteDepositEntry = async (month, item) => {
                showToastNotification('Hapus deposit melalui dashboard dinonaktifkan. Gunakan Bot Telegram/admin backend.', 'info');
                return false;
            };

            const pushToCloud = async (path, data) => {
                if (!firebaseProjectId) {
                    setSyncStatus({ state: 'idle', msg: 'Cloud Sync Non-Aktif — perubahan hanya lokal' });
                    return false;
                }
                try {
                    const targetPid = firebaseProjectId.trim();
                    // Jangan membatalkan PUT dengan AbortController: pada beberapa koneksi
                    // browser lokal, request dibatalkan sebelum Firebase mengembalikan respons.
                    const url = `https://${targetPid}-default-rtdb.asia-southeast1.firebasedatabase.app/${path}.json`;
                    console.info('[Firebase] Menyimpan', path);
                    const response = await fetch(url, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(data),
                        cache: 'no-store'
                    });
                    if (!response.ok) {
                        let detail = '';
                        try { detail = await response.text(); } catch (_) {}
                        throw new Error(`Firebase HTTP ${response.status}${detail ? ': ' + detail.slice(0,180) : ''}`);
                    }
                    setSyncStatus({ state: 'success', msg: 'Tersimpan di Firebase' });
                    console.info('[Firebase] Berhasil menyimpan', path);
                    return true;
                } catch (e) {
                    console.error('Cloud push failed for', path, e);
                    const message = e?.name === 'AbortError' ? 'Permintaan dibatalkan browser atau koneksi' : (e.message || 'koneksi bermasalah');
                    setSyncStatus({ state: 'error', msg: `Gagal menyimpan ${path}: ${message}` });
                    showToastNotification(`Gagal menyimpan ${path}: ${message}`, 'error');
                    return false;
                }
            };

            // Perbaikan Bug 2: Jangan sinkronkan kartu yang sudah sengaja dihapus
            React.useEffect(() => {
                if (!transactions || transactions.length === 0) return;
                let addedAny = false;
                const existingCleanNums = new Set(cards.map(c => (c.number || '').replace(/\D/g, '')));
                const deletedSet = new Set(deletedCardNumbers);
                const newCardsToAdd = [];

                transactions.forEach(tx => {
                    const cleanNum = (tx.etollNumber || '').replace(/\D/g, '');
                    if (cleanNum && cleanNum.length >= 12 && !existingCleanNums.has(cleanNum) && !deletedSet.has(cleanNum)) {
                        existingCleanNums.add(cleanNum);
                        const officialData = OFFICIAL_DRIVER_MAP[cleanNum];
                        const matchedPreset = INITIAL_CARDS.find(ic => (ic.number || '').replace(/\D/g, '') === cleanNum);
                        const detected = detectBankFromCardNumber(tx.etollNumber, tx.merchant);

                        let driverName = officialData ? officialData.name : (matchedPreset ? matchedPreset.label : null);
                        let nopol = officialData ? officialData.nopol : (matchedPreset ? matchedPreset.nopol : null);

                        if (!driverName) {
                            driverName = (tx.merchant && !['bank bri', 'brimo', 'mandiri', 'livin'].some(b => tx.merchant.toLowerCase().includes(b))) 
                                ? tx.merchant 
                                : `Driver Baru (${cleanNum.slice(-4)})`;
                        }
                        if (!nopol) {
                            nopol = 'AD 1214 XU';
                        }

                        newCardsToAdd.push({
                            id: 'card-' + Date.now() + '-' + Math.random().toString(36).substring(2, 6),
                            label: driverName,
                            nopol: nopol,
                            number: formatCardNumber(tx.etollNumber),
                            bank: detected.bank,
                            color: detected.color
                        });
                        addedAny = true;
                    }
                });

                if (addedAny && newCardsToAdd.length > 0) {
                    // Tulis hanya bila ada kartu baru hasil deteksi transaksi; tidak ada penulisan ulang berkala.
                    setCards(prev => {
                        const updated = [...prev, ...newCardsToAdd];
                        safeStorageSet('etoll_cards', JSON.stringify(updated));
                        pushToCloud('cards', updated);
                        return updated;
                    });
                }
            }, [transactions, deletedCardNumbers, cards]);

            const fetchCloudData = React.useCallback(async (pidOverride = null, monthOverride = null) => {
                const targetPid = String(pidOverride !== null ? pidOverride : firebaseProjectId).trim();
                if (!targetPid) {
                    setSyncStatus({ state: 'idle', msg: 'Cloud Sync Non-Aktif — Project ID belum tersedia' });
                    return false;
                }

                const baseUrl = `https://${targetPid}-default-rtdb.asia-southeast1.firebasedatabase.app`;
                const now = new Date();
                const currentMonth = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
                const requestedMonth = monthOverride || selectedMonth || currentMonth;
                const readJson = async (path, query = '') => {
                    const response = await fetch(`${baseUrl}/${path}.json${query}`, {
                        cache: 'no-store',
                        headers: { 'Accept': 'application/json' }
                    });
                    if (!response.ok) {
                        let detail = '';
                        try { detail = await response.text(); } catch (_) {}
                        throw new Error(`${path}: HTTP ${response.status}${detail ? ' — ' + detail.slice(0,160) : ''}`);
                    }
                    return await response.json();
                };

                console.info('[Firebase] Memuat data resmi:', requestedMonth);
                setSyncStatus({ state: 'connecting', msg: `Menghubungkan ke Firebase ${targetPid}…` });

                try {
                    // Pembacaan transaksi adalah pemeriksaan inti. Data tambahan dibaca terpisah
                    // agar satu node opsional yang kosong/tidak tersedia tidak mematikan seluruh dashboard.
                    let monthKeys = [];
                    if (requestedMonth === 'ALL') {
                        try {
                            const keys = await readJson('transactionsByMonth', '?shallow=true');
                            monthKeys = Object.keys(keys || {}).filter(k => /^\d{4}-\d{2}$/.test(k)).sort();
                        } catch (e) {
                            monthKeys = (cloudMonthKeys || []).filter(k => /^\d{4}-\d{2}$/.test(k));
                            if (!monthKeys.length) throw e;
                        }
                    } else {
                        monthKeys = [requestedMonth];
                    }

                    const txSnapshots = await Promise.all(monthKeys.map(async month => ({
                        month,
                        data: await readJson(`transactionsByMonth/${month}`)
                    })));
                    const byId = new Map();
                    txSnapshots.forEach(({month, data}) => {
                        const list = data && typeof data === 'object'
                            ? (Array.isArray(data)
                                ? data.filter(Boolean).map((tx, i) => ({ ...tx, id: String(tx.id ?? i) }))
                                : Object.entries(data).filter(([, tx]) => tx && typeof tx === 'object')
                                    .map(([key, tx]) => ({ ...tx, id: String(tx.id ?? key) })))
                            : [];
                        list.forEach(tx => {
                            if (String(tx.date || '').slice(0,7) === month) byId.set(String(tx.id), tx);
                        });
                    });

                    const monthly = [...byId.values()].sort((a,b) => new Date(b.date || 0) - new Date(a.date || 0));
                    setTransactions(prev => {
                        if (requestedMonth === 'ALL') return monthly;
                        const outsideMonth = prev.filter(tx => String(tx.date || '').slice(0,7) !== requestedMonth);
                        const unique = new Map([...outsideMonth, ...monthly].map(tx => [String(tx.id), tx]));
                        return [...unique.values()].sort((a,b) => new Date(b.date || 0) - new Date(a.date || 0));
                    });

                    // Node pendukung tidak boleh menggagalkan tampilan transaksi utama.
                    const optionalNodes = [
                        ['spjProfile', 'spjProfile'],
                        ['cards', 'cards'],
                        ['monthlyDeposits', 'monthlyDeposits']
                    ];
                    const optionalResults = await Promise.allSettled(optionalNodes.map(([path]) => readJson(path)));
                    optionalResults.forEach((result, index) => {
                        const path = optionalNodes[index][0];
                        if (result.status !== 'fulfilled') {
                            console.warn('[Firebase] Node pendukung gagal dibaca:', path, result.reason);
                            return;
                        }
                        const data = result.value;
                        if (path === 'spjProfile' && data) setSpjProfile(prev => ({ ...prev, ...data }));
                        if (path === 'cards') {
                            const cloudCards = Array.isArray(data) ? data.filter(Boolean) :
                                (data && typeof data === 'object' ? Object.entries(data)
                                    .filter(([, value]) => value && typeof value === 'object')
                                    .map(([key, value]) => ({ id: key, ...value })) : []);
                            setCards(cloudCards);
                        }
                        if (path === 'monthlyDeposits') setMonthlyDeposits(data && typeof data === 'object' ? data : {});
                    });

                    const historyMonths = requestedMonth === 'ALL' ? monthKeys : [requestedMonth];
                    const historyResults = await Promise.allSettled(historyMonths.map(month => readJson(`monthlyDepositHistory/${month}`)));
                    historyResults.forEach((result, index) => {
                        if (result.status !== 'fulfilled') {
                            console.warn('[Firebase] Riwayat deposit tidak terbaca:', historyMonths[index], result.reason);
                            return;
                        }
                        const data = result.value;
                        const history = Array.isArray(data) ? data.filter(Boolean) :
                            (data && typeof data === 'object' ? Object.values(data).filter(Boolean) : []);
                        setMonthlyDepositHistory(prev => ({ ...prev, [historyMonths[index]]: history }));
                    });

                    setSyncStatus({
                        state: 'success',
                        msg: `Database TERHUBUNG — ${monthly.length} transaksi dibaca dari Firebase (${requestedMonth}).`
                    });
                    console.info('[Firebase] Berhasil membaca transaksi:', targetPid, monthly.length);
                    return true;
                } catch (e) {
                    const message = e?.message || 'Gagal membaca Firebase';
                    setSyncStatus({ state: 'error', msg: `Database TIDAK TERHUBUNG / baca gagal: ${message}` });
                    console.error('[Firebase] Pembacaan transaksi gagal:', message);
                    return false;
                }
            }, [firebaseProjectId, selectedMonth, cloudMonthKeys]);
            // Temukan daftar bulan yang benar-benar tersedia di Firebase tanpa mengunduh isi transaksi.
            // shallow=true hanya mengambil nama node bulan, bukan seluruh record.
            React.useEffect(() => {
                let cancelled = false;
                const discoverCloudMonths = async () => {
                    try {
                        const url = `https://${firebaseProjectId.trim()}-default-rtdb.asia-southeast1.firebasedatabase.app/transactionsByMonth.json?shallow=true`;
                        const response = await fetch(url, { cache: 'no-store', headers: { 'Accept': 'application/json' } });
                        if (!response.ok) throw new Error(`HTTP ${response.status}`);
                        const data = await response.json();
                        const months = data && typeof data === 'object'
                            ? Object.keys(data).filter(key => /^\d{4}-\d{2}$/.test(key))
                            : [];
                        if (!cancelled) setCloudMonthKeys(months);
                        console.info('[Firebase] Bulan transaksi tersedia:', months);
                    } catch (error) {
                        console.warn('[Firebase] Tidak dapat mengambil daftar bulan:', error.message);
                    }
                };
                discoverCloudMonths();
                return () => { cancelled = true; };
            }, [firebaseProjectId]);

            // Hemat kuota: ambil data saat aplikasi dibuka atau saat bulan/proyek berubah.
            // Tidak memakai polling maupun EventSource permanen. Perubahan dari perangkat lain
            // akan terlihat setelah tombol Segarkan atau saat aplikasi dibuka kembali.
            React.useEffect(() => {
                const targetPid = (firebaseProjectId || '').trim();
                if (!targetPid) return;
                fetchCloudData(null, selectedMonth);
            }, [firebaseProjectId, selectedMonth, fetchCloudData]);

            React.useEffect(() => { safeStorageSet('etoll_cards', JSON.stringify(cards)); }, [cards]);
            React.useEffect(() => { safeStorageSet('etoll_deleted_cards', JSON.stringify(deletedCardNumbers)); }, [deletedCardNumbers]);
            // Transaksi operasional tidak dicache ke localStorage; Firebase adalah sumber tunggal.
            React.useEffect(() => { safeStorageSet('etoll_fb_pid', firebaseProjectId); }, [firebaseProjectId]);
            React.useEffect(() => { safeStorageSet('etoll_gemini_key', geminiApiKey); }, [geminiApiKey]);
            React.useEffect(() => { safeStorageSet('etoll_gdrive_webhook', gdriveWebhookUrl); }, [gdriveWebhookUrl]);
            React.useEffect(() => { safeStorageSet('etoll_spj_profile', JSON.stringify(spjProfile)); }, [spjProfile]);
            // Saldo dan riwayat deposit tidak dicache sebagai data resmi.

            const showToastNotification = (msg, type = 'success') => {
                setToast({ msg, type });
                setTimeout(() => setToast(null), 4000);
            };

            const handleUpdateSpjProfile = (newProfile) => {
                setSpjProfile(newProfile);
                pushToCloud('spjProfile', newProfile);
                showToastNotification('Profil SPJ & Pejabat berhasil diperbarui & disimpan ke Cloud!');
            };

            const checkDuplicateInvoice = (invoiceNum, excludeId = null) => {
                if (!invoiceNum || !invoiceNum.trim()) return false;
                const clean = invoiceNum.trim().toUpperCase();
                // Pemeriksaan UI dibatasi ke bulan kalender berjalan; worker tetap menjadi validasi utama.
                const now = new Date();
                const monthKey = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
                return transactions.some(t => t.id !== excludeId && String(t.date || '').slice(0, 7) === monthKey && t.invoiceNumber && String(t.invoiceNumber).trim().toUpperCase() === clean);
            };

            const handleAddCard = (newCardData) => {
                const formattedNum = formatCardNumber(newCardData.number);
                if (!formattedNum) return null;
                const cleanNum = formattedNum.replace(/\D/g, '');

                                                </div>
                                                <div>
                                                    <label className="text-[10px] text-slate-400 block mb-0.5">Nama Lengkap</label>
                                                    <input 
                                                        type="text" 
                                                        value={spjProfile.bppName || ''} 
                                                        onChange={e => setSpjProfile({...spjProfile, bppName: e.target.value})}
                                                        className="w-full p-2 bg-slate-900 border border-slate-700 rounded-lg text-white font-medium focus:ring-1 focus:ring-amber-400"
                                                        placeholder="Contoh: Rita Hindrawati, S.S."
                                                    />
                                                </div>
                                                <div>
                                                    <label className="text-[10px] text-slate-400 block mb-0.5">NIP</label>
                                                    <input 
                                                        type="text" 
                                                        value={spjProfile.bppNip || ''} 
                                                        onChange={e => setSpjProfile({...spjProfile, bppNip: e.target.value})}
                                                        className="w-full p-2 bg-slate-900 border border-slate-700 rounded-lg text-white font-mono focus:ring-1 focus:ring-amber-400"
                                                        placeholder="Contoh: 198203102009102001"
                                                    />
                                                </div>
                                            </div>
                                        </div>

                                        {/* Pengaturan Nomor & Administrasi Dokumen SPJ */}
                                        <div className="p-3.5 bg-slate-950/50 rounded-xl border border-slate-800 space-y-2.5">
                                            <p className="text-[11px] font-bold text-slate-300 flex items-center gap-2">
                                                <i className="fa-solid fa-file-pen text-indigo-400"></i>
                                                <span>Data Nomor Bukti & Mata Anggaran (Kuitansi & SPBy)</span>
                                            </p>
                                            <div className="grid grid-cols-1 sm:grid-cols-4 gap-3 text-xs">
                                                <div>
                                                    <label className="text-[10px] text-slate-400 block mb-1">Nomor Bukti</label>
                                                    <input 
                                                        type="text"
                                                        value={spjProfile.buktiNo || ''}
                                                        onChange={e => setSpjProfile({...spjProfile, buktiNo: e.target.value})}
                                                        placeholder="Contoh: BK-08/2026/01"
                                                        className="w-full p-2 bg-slate-900 border border-slate-700 rounded-lg text-white font-mono text-xs focus:ring-1 focus:ring-indigo-400"
                                                    />
                                                </div>
                                                <div>
                                                    <label className="text-[10px] text-slate-400 block mb-1">Nomor SPBy</label>
                                                    <input 
                                                        type="text"
                                                        value={spjProfile.spbyNo || ''}
                                                        onChange={e => setSpjProfile({...spjProfile, spbyNo: e.target.value})}
                                                        placeholder="Contoh: 104/UN27/SPBY/2026"
                                                        className="w-full p-2 bg-slate-900 border border-slate-700 rounded-lg text-white font-mono text-xs focus:ring-1 focus:ring-indigo-400"
                                                    />
                                                </div>
                                                <div>
                                                    <label className="text-[10px] text-slate-400 block mb-1">Tanggal SPBy</label>
                                                    <input 
                                                        type="text"
                                                        value={spjProfile.spbyDate || ''}
                                                        onChange={e => setSpjProfile({...spjProfile, spbyDate: e.target.value})}
                                                        placeholder="Contoh: 31 Agustus 2026"
                                                        className="w-full p-2 bg-slate-900 border border-slate-700 rounded-lg text-white text-xs focus:ring-1 focus:ring-indigo-400"
                                                    />
                                                </div>
                                                <div>
                                                    <label className="text-[10px] text-slate-400 block mb-1">Mata Anggaran (MAK)</label>
                                                    <input 
                                                        type="text"
                                                        value={spjProfile.mak || ''}
                                                        onChange={e => setSpjProfile({...spjProfile, mak: e.target.value})}
                                                        placeholder="Contoh: 023.17.WA.525111"
                                                        className="w-full p-2 bg-slate-900 border border-slate-700 rounded-lg text-white font-mono text-xs focus:ring-1 focus:ring-indigo-400"
                                                    />
                                                </div>
                                            </div>
                                        </div>

                                        <div className="flex justify-end pt-1">
                                            <button 
                                                onClick={() => handleUpdateSpjProfile(spjProfile)}
                                                className="bg-brand-600 hover:bg-brand-500 text-white font-bold text-xs px-5 py-2.5 rounded-xl transition shadow-lg flex items-center gap-2"
                                            >
                                                <i className="fa-solid fa-floppy-disk"></i>
                                                <span>Simpan Profil Pejabat & Administrasi</span>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'cloud_config' && (
                            <div className="glass-card p-6 rounded-3xl border border-slate-700/70 shadow-xl space-y-6 max-w-4xl mx-auto">
                                <div className="border-b border-slate-800 pb-3">
                                    <h3 className="font-extrabold text-base text-white flex items-center gap-2">
                                        <i className="fa-solid fa-cloud text-sky-400"></i>
                                        <span>Konfigurasi Firebase & Google Drive Webhook</span>
                                    </h3>
                                    <p className="text-xs text-slate-400 mt-0.5">Sinkronisasi data multi-device dan pencadangan foto struk otomatis ke Google Drive.</p>
                                </div>

                                <div className="space-y-4 text-xs">
                                    <div className="space-y-1.5">
                                        <label className="block text-slate-300 font-bold">Firebase Realtime Database — tertanam di aplikasi:</label>
                                        <div className="w-full p-3 rounded-xl border border-emerald-700/60 bg-emerald-950/30 text-emerald-200 font-mono text-sm break-all">
                                            Project ID: etoll-3366c<br />
                                            URL: https://etoll-3366c-default-rtdb.asia-southeast1.firebasedatabase.app
                                        </div>
                                        <p className="text-[11px] text-slate-400">Tidak perlu mengisi Project ID di halaman muka atau menyimpannya secara manual. Aplikasi langsung memakai database ini.</p>
                                    </div>

                                    <div className="space-y-1.5">
                                        <label className="block text-slate-300 font-bold">Gemini API Key (Google AI Studio OCR):</label>
                                        <input 
                                            type="password" 
                                            value={geminiApiKey} 
                                            onChange={e => setGeminiApiKey(e.target.value)}
                                            placeholder="AIzaSy..."
                                            className="w-full p-3 bg-slate-950 border border-slate-700 rounded-xl text-white font-mono text-sm"
                                        />
                                    </div>

                                    <div className="space-y-1.5">
                                        <label className="block text-slate-300 font-bold">Google Apps Script Webhook URL (Google Drive):</label>
                                        <input 
                                            type="text" 
                                            value={gdriveWebhookUrl} 
                                            onChange={e => setGdriveWebhookUrl(e.target.value)}
                                            placeholder="https://script.google.com/macros/s/.../exec"
                                            className="w-full p-3 bg-slate-950 border border-slate-700 rounded-xl text-white font-mono text-sm"
                                        />
                                    </div>

                                    <div className="pt-2 flex justify-end">
                                        <button 
                                            onClick={handleSaveCloudSettings}
                                            className="px-5 py-2.5 bg-gradient-to-r from-sky-600 to-blue-600 hover:from-sky-500 hover:to-blue-500 text-white font-bold rounded-xl text-xs shadow-lg transition"
                                        >
                                            Simpan & Uji Koneksi Cloud
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'master_data' && (
                            <MasterDataTab 
                                cards={cards} 
                                setCards={setCards} 
                                transactions={transactions} 
                                setTransactions={setTransactions} 
                                setMonthlyDeposits={setMonthlyDeposits} 
                                firebaseProjectId={firebaseProjectId} 
                                fetchCloudData={fetchCloudData} 
                                showToastNotification={showToastNotification} 
                                handleAddCard={handleAddCard} 
                                deletedCardNumbers={deletedCardNumbers} 
                                setDeletedCardNumbers={setDeletedCardNumbers} 
                                pushToCloud={pushToCloud}
                            />
                        )}
                    </main>

                    {inspectingTx && (
                        <InspectTransactionModal 
                            transaction={inspectingTx}
                            onClose={() => setInspectingTx(null)}
                        />
                    )}

                    {showSpjPrintModal && (
                        <SpjPrintModal 
                            spjProfile={spjProfile}
                            selectedMonth={selectedMonth}
                            transactions={transactions}
                            depositAmount={depositAvailable}
                            cards={cards}
                            spjSortBy={spjSortBy}
                            setSpjSortBy={setSpjSortBy}
                            onClose={() => setShowSpjPrintModal(false)}
                        />
                    )}

                    {showScanModal && (
                        <ScanAndAddModal 
                            userApiKey={geminiApiKey}
                            setGeminiApiKey={setGeminiApiKey}
                            checkDuplicateInvoice={checkDuplicateInvoice}
                            cards={cards}
                            onSave={handleSaveTransaction}
                            onClose={() => setShowScanModal(false)}
                            showToastNotification={showToastNotification}
                            dailyUsage={dailyUsage}
                            freeDailyLimit={FREE_DAILY_LIMIT}
                            updateDailyUsage={updateDailyUsage}
                            gdriveWebhookUrl={gdriveWebhookUrl}
                        />
                    )}

                    {showNfcModal && (
                        <NfcModal 
                            cards={cards}
                            transactions={transactions}
                            currentMonth={selectedMonth}
                            onClose={() => setShowNfcModal(false)}
                        />
                    )}

                    {editingTx && (
                        <EditTransactionModal 
                            transaction={editingTx}
                            onSave={handleSaveTransaction}
                            onClose={() => setEditingTx(null)}
                        />
                    )}

                    {showDepositModal && (
                        <div className="fixed inset-0 z-50 bg-black/85 flex items-start sm:items-center justify-center p-2 sm:p-4 backdrop-blur-md modal-backdrop overflow-y-auto overscroll-contain" style={{ WebkitOverflowScrolling: 'touch' }}>
                            <div className="glass-panel p-4 sm:p-6 rounded-3xl max-w-md w-full space-y-4 shadow-2xl border border-purple-500/50 my-auto" style={{ maxHeight: 'calc(100vh - 1rem)', overflowY: 'auto', overscrollBehavior: 'contain', WebkitOverflowScrolling: 'touch' }}>
                                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                                    <h3 className="font-extrabold text-base flex items-center gap-2 text-purple-300">
                                        <i className="fa-solid fa-vault"></i> {editingDepositId ? 'Edit Riwayat Pengisian' : 'Deposit Kasbon Uang Muka'}
                                    </h3>
                                    <button onClick={() => { setShowDepositModal(false); setEditingDepositId(null); }} className="text-slate-400 hover:text-white text-lg">
                                        <i className="fa-solid fa-xmark"></i>
                                    </button>
                                </div>

                                <div className="space-y-4 text-xs">
                                    <div className="p-3 rounded-xl border border-purple-500/30 bg-purple-500/10">
                                        <p className="text-[11px] font-bold text-purple-200">Saldo awal dari sisa saldo bulan sebelumnya</p>
                                        <p className={`font-mono font-black text-lg ${openingDepositBalance < 0 ? 'text-rose-300' : 'text-emerald-300'}`}>{formatRupiah(openingDepositBalance)}</p>
                                        <p className="text-[10px] text-slate-400">Saldo awal bukan setoran baru. Saldo akhir = saldo awal + total pengisian − realisasi e-Toll.</p>
                                    </div>
                                    <div>
                                        <label className="block text-[11px] font-bold text-slate-300 mb-1">Periode Bulan:</label>
                                        <select
                                            value={depositModalMonth}
                                            onChange={async (e) => {
                                                const m = e.target.value;
                                                setDepositModalMonth(m);
                                                setDepositModalValue('');
                                                setDepositModalDate(getLocalDateString().slice(0,7) === m ? getLocalDateString() : `${m}-01`);
                                                if (firebaseProjectId) {
                                                    try {
                                                        const url = `https://${firebaseProjectId.trim()}-default-rtdb.asia-southeast1.firebasedatabase.app/monthlyDepositHistory/${m}.json`;
                                                        const response = await fetch(url, { cache: 'no-store' });
                                                        if (!response.ok) throw new Error(`HTTP ${response.status}`);
                                                        const data = await response.json();
                                                        const history = Array.isArray(data) ? data.filter(Boolean) : (data && typeof data === 'object' ? Object.values(data).filter(Boolean) : []);
                                                        setMonthlyDepositHistory(prev => ({ ...prev, [m]: history }));
                                                    } catch (err) { showToastNotification('Riwayat bulan tersebut belum berhasil dimuat dari Firebase.', 'error'); }
                                                }
                                            }}
                                            className="w-full p-2.5 bg-slate-950 border border-slate-700 rounded-xl text-amber-300 font-bold"
                                        >
                                            {availableMonths.map(m => (
                                                <option key={m} value={m}>📅 Periode {m}</option>
                                            ))}
                                        </select>
                                    </div>

                                    <div>
                                        <label className="block text-[11px] font-bold text-slate-300 mb-1">{editingDepositId ? 'Ubah Nominal Pengisian (Rp):' : 'Nominal Pengisian Baru (Rp):'}</label>
                                        <input 
                                            type="number"
                                            value={depositModalValue}
                                            onChange={(e) => setDepositModalValue(e.target.value)}
                                            placeholder="Masukkan nominal pengisian baru, mis. 5000000"
                                            className="w-full p-3 bg-slate-950 border border-slate-700 rounded-xl text-white font-mono text-base font-bold focus:ring-2 focus:ring-purple-500"
                                            autoFocus
                                        />
                                        <p className="text-[11px] text-emerald-400 font-bold mt-1.5 flex items-center gap-1.5">
                                            <i className="fa-solid fa-money-bill-wave"></i>
                                            <span>Terbaca: {formatRupiah(Number(depositModalValue) || 0)}</span>
                                        </p>
                                    </div>

                                    <div>
                                        <label className="block text-[11px] font-bold text-slate-300 mb-1">Tanggal Pengisian:</label>
                                        <input type="date" value={depositModalDate} onChange={e => setDepositModalDate(e.target.value)} className="w-full p-2.5 bg-slate-950 border border-slate-700 rounded-xl text-white" />
                                    </div>
                                    <div>
                                        <label className="block text-[11px] font-bold text-slate-300 mb-1">Bukti Pengisian (JPG/JPEG):</label>
                                        <input type="file" accept="image/jpeg,image/jpg" onChange={async e => {
                                            const file = e.target.files?.[0];
                                            if (!file) return;
                                            if (!/^image\/(jpeg|jpg)$/i.test(file.type) && !/\.jpe?g$/i.test(file.name)) { showToastNotification('Bukti harus berupa JPG/JPEG.', 'error'); e.target.value = ''; return; }
                                            if (file.size > 12 * 1024 * 1024) { showToastNotification('Ukuran JPG maksimal 12 MB.', 'error'); e.target.value = ''; return; }
                                            try {
                                                const reader = new FileReader();
                                                reader.onload = async ev => {
                                                    try { const compressed = await compressImageDataUrl(ev.target.result, 1100, 0.62); setDepositProofData(compressed); setDepositProofName(file.name); }
                                                    catch (err) { showToastNotification(err.message || 'Gagal membaca bukti JPG.', 'error'); }
                                                };
                                                reader.readAsDataURL(file);
                                            } catch (err) { showToastNotification('Gagal memproses bukti JPG.', 'error'); }
                                        }} className="block w-full text-[11px] text-slate-300 file:mr-3 file:px-3 file:py-2 file:rounded-lg file:border-0 file:bg-purple-600 file:text-white" />
                                        {depositProofData && <div className="mt-2 flex items-center gap-3 rounded-xl border border-emerald-700/50 bg-emerald-950/20 p-2"><img src={depositProofData} alt="Preview bukti deposit" className="w-16 h-16 object-cover rounded-lg" /><div className="min-w-0 flex-1"><p className="text-[10px] text-emerald-300 font-bold">Bukti siap disimpan</p><p className="text-[10px] text-slate-400 truncate">{depositProofName}</p></div><button type="button" onClick={() => { setDepositProofData(''); setDepositProofName(''); }} className="text-rose-300 text-xs">Hapus</button></div>}
                                        <p className="text-[10px] text-slate-500 mt-1">Gambar dikompres otomatis agar ukuran penyimpanan lebih hemat.</p>
                                    </div>
                                    <div className="rounded-xl border border-slate-700 bg-slate-950/70 p-3 space-y-2">
                                        <p className="text-[10px] font-black uppercase tracking-wider text-purple-300">Riwayat Pengisian {depositModalMonth}</p>
                                        <div className="flex justify-between items-center rounded-lg bg-purple-500/10 px-2.5 py-2">
                                            <span className="text-[10px] text-slate-300">Total pengisian bulan ini</span>
                                            <strong className="text-sm text-emerald-300 font-mono">{formatRupiah((monthlyDepositHistory[depositModalMonth] || []).reduce((sum, item) => sum + (Number(item.amount) || 0), 0) + ((monthlyDepositHistory[depositModalMonth] || []).length ? 0 : (Number(monthlyDeposits[depositModalMonth]) || 0)))}</strong>
                                        </div>
                                        {(monthlyDepositHistory[depositModalMonth] || []).length === 0 ? <p className="text-[11px] text-slate-500">Belum ada riwayat pengisian pada bulan ini.</p> : <div className="max-h-52 overflow-y-auto space-y-2">{[...(monthlyDepositHistory[depositModalMonth] || [])].sort((a,b) => String(b.date).localeCompare(String(a.date))).map(item => <div key={item.id} className="flex flex-wrap items-center justify-between gap-2 border-b border-slate-800 pb-2 text-[11px]"><div className="min-w-0"><p className="font-bold text-white">{formatDateIndo(item.date)}{String(item.id || '').startsWith('opening_') ? ' · Saldo awal' : ''}</p><p className="text-emerald-300 font-mono">{formatRupiah(item.amount)}</p>{item.proofName && <p className="text-[9px] text-slate-500 truncate">{item.proofName}</p>}</div><div className="flex items-center gap-2">{item.proofData ? <a href={item.proofData} target="_blank" rel="noreferrer" className="text-blue-300 underline">Lihat JPG</a> : <span className="text-slate-500">Tanpa bukti</span>}{!String(item.id || '').startsWith('opening_') && <><button type="button" onClick={() => startEditDeposit(depositModalMonth, item)} className="px-2 py-1 rounded-md bg-amber-500/15 text-amber-300 hover:bg-amber-500/30 font-bold"><i className="fa-solid fa-pen"></i> Edit</button><button type="button" onClick={() => deleteDepositEntry(depositModalMonth, item)} className="px-2 py-1 rounded-md bg-rose-500/15 text-rose-300 hover:bg-rose-500/30 font-bold"><i className="fa-solid fa-trash"></i> Hapus</button></>}</div></div>)}</div>}
                                    </div>

                                    <div>
                                        <p className="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">Pilihan Cepat Nominal:</p>
                                        <div className="grid grid-cols-3 gap-2">
                                            {[10000000, 15000000, 20000000, 25000000, 30000000, 35000000].map(val => (
                                                <button
                                                    key={val}
                                                    type="button"
                                                    onClick={() => setDepositModalValue(String(val))}
                                                    className={`py-1.5 px-2 rounded-xl text-[11px] font-bold border transition ${
                                                        Number(depositModalValue) === val 
                                                            ? 'bg-purple-600 border-purple-400 text-white' 
                                                            : 'bg-slate-900 border-slate-700 text-slate-300 hover:border-slate-500'
                                                    }`}
                                                >
                                                    {val / 1000000} Juta
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                </div>

                                <div className="flex gap-2 pt-2 border-t border-slate-800">
                                    <button 
                                        type="button" 
                                        onClick={() => { setShowDepositModal(false); setEditingDepositId(null); }} 
                                        className="flex-1 py-2.5 border border-slate-700 rounded-xl text-xs font-bold text-slate-300 hover:bg-slate-800"
                                    >
                                        Batal
                                    </button>
                                    <button 
                                        type="button" 
                                        disabled={depositSaving}
                                        onClick={async () => {
                                            setDepositSaving(true);
                                            const ok = editingDepositId
                                                ? await saveDepositEdit()
                                                : await handleUpdateDeposit(depositModalMonth, depositModalValue, depositModalDate, depositProofData, depositProofName);
                                            setDepositSaving(false);
                                            if (ok) { setDepositProofData(''); setDepositProofName(''); setEditingDepositId(null); setDepositModalValue(''); }
                                        }} 
                                        className="flex-1 py-2.5 bg-purple-600 hover:bg-purple-500 disabled:opacity-50 text-white rounded-xl text-xs font-bold shadow-lg transition"
                                    >
                                        {depositSaving ? 'Menyimpan…' : (editingDepositId ? 'Simpan Perubahan' : 'Simpan Pengisian')}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {deletingTx && (
                        <div className="fixed inset-0 z-50 bg-black/85 flex items-center justify-center p-4 backdrop-blur-md">
                            <div className="glass-panel p-6 rounded-3xl max-w-sm w-full space-y-4 shadow-2xl border border-rose-800/80 text-xs">
                                <h4 className="font-extrabold text-sm text-white flex items-center gap-2 text-rose-400">
                                    <i className="fa-solid fa-trash-can text-rose-500"></i>
                                    <span>Konfirmasi Hapus Transaksi</span>
                                </h4>
                                <div className="p-3 bg-slate-950/80 rounded-2xl border border-slate-800 space-y-1">
                                    <p className="text-slate-300">
                                        Anda akan menghapus transaksi bukti <strong>{deletingTx.invoiceNumber || deletingTx.merchant}</strong>:
                                    </p>
                                    <p className="font-bold text-white text-sm font-mono text-brand-300">
                                        {formatRupiah(deletingTx.amount)} • {deletingTx.merchant}
                                    </p>
                                </div>

                                <div className="space-y-1.5">
                                    <label className="block text-[11px] font-bold text-slate-300">
                                        <i className="fa-solid fa-lock mr-1 text-rose-400"></i> Masukkan Password Admin (anda321):
                                    </label>
                                    <input 
                                        type="password"
                                        value={deleteTxPassword}
                                        onChange={e => { setDeleteTxPassword(e.target.value); setDeleteTxPassError(''); }}
                                        placeholder="Masukkan password konfirmasi..."
                                        className="w-full p-2.5 bg-slate-950 border border-slate-700 rounded-xl text-white font-mono text-sm focus:ring-2 focus:ring-rose-500"
                                        autoFocus
                                    />
                                    {deleteTxPassError && (
                                        <p className="text-rose-400 text-[11px] font-bold flex items-center gap-1">
                                            <i className="fa-solid fa-circle-exclamation"></i> {deleteTxPassError}
                                        </p>
                                    )}
                                </div>

                                <div className="flex gap-2 pt-2">
                                    <button 
                                        onClick={() => {
                                            setDeletingTx(null);
                                        }} 
                                        className="flex-1 py-2.5 border border-slate-700 rounded-xl text-slate-300 hover:bg-slate-800 font-bold"
                                    >
                                        Batal
                                    </button>
                                    <button 
                                        onClick={() => {
                                            handleDeleteTransaction(deletingTx.id);
                                        }} 
                                        className="flex-1 py-2.5 bg-rose-600 hover:bg-rose-500 text-white rounded-xl font-bold shadow-lg transition"
                                    >
                                        Hapus Permanen
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
