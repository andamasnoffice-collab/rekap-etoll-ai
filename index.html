    <script type="text/babel">
        function formatRupiah(number) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(number || 0);
        }

        function formatDateIndo(dateString) {
            if (!dateString) return '-';
            const date = new Date(dateString);
            if (isNaN(date.getTime())) return dateString;
            return new Intl.DateTimeFormat('id-ID', { day: 'numeric', month: 'short', year: 'numeric' }).format(date);
        }

        function formatCardNumber(val) {
            if (!val) return '';
            const cleaned = val.toString().replace(/\D/g, '').slice(0, 16);
            return cleaned.replace(/(\d{4})(?=\d)/g, '$1 ').trim();
        }

        // Fixed Terbilang Rupiah Logic (Handles Seratus, Seribu, & Triliun correctly)
        function terbilangRupiah(num) {
            const angka = ["", "Satu", "Dua", "Tiga", "Empat", "Lima", "Enam", "Tujuh", "Delapan", "Sembilan", "Sepuluh", "Sebelas"];
            num = Math.floor(Math.abs(Number(num) || 0));
            if (num === 0) return "Nol Rupiah";

            function terbilang(n) {
                if (n < 12) return angka[n];
                if (n < 20) return terbilang(n - 10) + " Belas";
                if (n < 100) return terbilang(Math.floor(n / 10)) + " Puluh " + (n % 10 !== 0 ? terbilang(n % 10) : "");
                if (n < 200) return "Seratus " + (n - 100 !== 0 ? terbilang(n - 100) : "");
                if (n < 1000) return terbilang(Math.floor(n / 100)) + " Ratus " + (n % 100 !== 0 ? terbilang(n % 100) : "");
                if (n < 2000) return "Seribu " + (n - 1000 !== 0 ? terbilang(n - 1000) : "");
                if (n < 1000000) return terbilang(Math.floor(n / 1000)) + " Ribu " + (n % 1000 !== 0 ? terbilang(n % 1000) : "");
                if (n < 1000000000) return terbilang(Math.floor(n / 1000000)) + " Juta " + (n % 1000000 !== 0 ? terbilang(n % 1000000) : "");
                if (n < 1000000000000) return terbilang(Math.floor(n / 1000000000)) + " Milyar " + (n % 1000000000 !== 0 ? terbilang(n % 1000000000) : "");
                return terbilang(Math.floor(n / 1000000000000)) + " Triliun " + (n % 1000000000000 !== 0 ? terbilang(n % 1000000000000) : "");
            }
            return terbilang(num).replace(/\s+/g, ' ').trim() + " Rupiah";
        }

        function detectBankFromCardNumber(cardNum, merchant = '') {
            const clean = (cardNum || '').replace(/\D/g, '');
            const m = (merchant || '').toLowerCase();
            
            if (clean.startsWith('6032') || clean.startsWith('6087') || clean.startsWith('6031') || clean.startsWith('5899') || clean.startsWith('6035') || m.includes('mandiri') || m.includes('e-money') || m.includes('livin')) {
                return { bank: 'Mandiri', color: 'from-blue-600 via-indigo-700 to-blue-900', label: 'Mandiri e-Money' };
            }
            if (clean.startsWith('6013') || clean.startsWith('6019') || clean.startsWith('6014') || clean.startsWith('6015') || m.includes('bca') || m.includes('flazz')) {
                return { bank: 'BCA', color: 'from-sky-600 via-blue-700 to-indigo-950', label: 'BCA Flazz' };
            }
            if (clean.startsWith('6018') || clean.startsWith('5379') || clean.startsWith('5221') || m.includes('bri') || m.includes('brizzi')) {
                return { bank: 'BRI', color: 'from-cyan-600 via-blue-800 to-blue-950', label: 'BRI Brizzi' };
            }
            if (clean.startsWith('1515') || clean.startsWith('7546') || clean.startsWith('5401') || m.includes('bni') || m.includes('tapcash')) {
                return { bank: 'BNI', color: 'from-amber-600 via-orange-700 to-slate-900', label: 'BNI TapCash' };
            }
            if (clean.startsWith('6030') || m.includes('jakcard') || m.includes('dki')) {
                return { bank: 'Bank DKI', color: 'from-emerald-600 via-teal-700 to-slate-900', label: 'DKI JakCard' };
            }

            return { bank: 'e-Toll', color: 'from-purple-600 via-indigo-700 to-slate-900', label: 'Kartu e-Toll' };
        }

        function getMerchantBadge(merchant) {
            const m = (merchant || '').toLowerCase();
            if (m.includes('mandiri') || m.includes('e-money') || m.includes('livin')) {
                return { label: merchant || 'Mandiri e-Money', icon: 'fa-building-columns', bg: 'bg-blue-950/80 text-blue-300 border border-blue-800/60' };
            }
            if (m.includes('bca') || m.includes('flazz')) {
                return { label: merchant || 'BCA Flazz', icon: 'fa-credit-card', bg: 'bg-sky-950/80 text-sky-300 border border-sky-800/60' };
            }
            if (m.includes('bri') || m.includes('brizzi')) {
                return { label: merchant || 'BRI Brizzi', icon: 'fa-wallet', bg: 'bg-cyan-950/80 text-cyan-300 border border-cyan-800/60' };
            }
            if (m.includes('indomaret') || m.includes('alfamart')) {
                return { label: merchant || 'Retail Store', icon: 'fa-store', bg: 'bg-amber-950/80 text-amber-300 border border-amber-800/60' };
            }
            if (m.includes('tokopedia') || m.includes('shopee') || m.includes('blibli')) {
                return { label: merchant || 'E-Commerce', icon: 'fa-cart-shopping', bg: 'bg-emerald-950/80 text-emerald-300 border border-emerald-800/60' };
            }
            return { label: merchant || 'Gate Tol / Rest Area', icon: 'fa-road', bg: 'bg-slate-900 text-slate-300 border border-slate-700' };
        }

        async function callGeminiOCR(base64DataUrl, userApiKey) {
            let mimeType = "image/jpeg";
            let base64Data = base64DataUrl;
            const match = base64DataUrl.match(/^data:(image\/[a-zA-Z]+);base64,(.+)$/);
            if (match) {
                mimeType = match[1];
                base64Data = match[2];
            }

            const apiKey = (userApiKey || "").trim();
            if (!apiKey) {
                throw new Error("API Key Gemini belum diatur. Silakan masukkan API Key Gemini Anda.");
            }

            const systemPrompt = "Anda adalah sistem OCR multimodal khusus mengekstrak data dari invoice/struk e-Toll Indonesia (e-Money, BCA Flazz, Brizzi, Tapcash, Livin, Tokopedia, Indomaret, dll). Ekstrak data secara tepat.";
            const userPrompt = "Analisis foto struk ini. Ekstrak:\n1. etollNumber: 16-digit nomor kartu e-Toll\n2. merchant: Tempat/Aplikasi pembelian\n3. amount: Total nominal (angka murni tanpa titik/koma)\n4. invoiceNumber: Nomor resi / invoice / referensi\n5. date: Tanggal transaksi (YYYY-MM-DD)";

            // Primary model endpoint with fallback support
            const modelNames = ["gemini-2.5-flash", "gemini-2.0-flash", "gemini-1.5-flash"];
            let lastError = null;

            for (const model of modelNames) {
                try {
                    const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
                    const payload = {
                        contents: [{ role: "user", parts: [{ text: userPrompt }, { inlineData: { mimeType, data: base64Data } }] }],
                        systemInstruction: { parts: [{ text: systemPrompt }] },
                        generationConfig: {
                            responseMimeType: "application/json",
                            responseSchema: {
                                type: "OBJECT",
                                properties: {
                                    etollNumber: { type: "STRING" },
                                    merchant: { type: "STRING" },
                                    amount: { type: "NUMBER" },
                                    invoiceNumber: { type: "STRING" },
                                    date: { type: "STRING" }
                                },
                                required: ["etollNumber", "merchant", "amount", "invoiceNumber", "date"]
                            }
                        }
                    };

                    const response = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                    if (!response.ok) {
                        const errJson = await response.json().catch(() => ({}));
                        throw new Error(errJson.error?.message || `HTTP ${response.status} pada model ${model}`);
                    }

                    const result = await response.json();
                    const text = result?.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (!text) {
                        throw new Error("Respons AI kosong atau diblokir oleh filter keamanan.");
                    }

                    // Clean markdown codeblocks if present
                    const cleanJsonStr = text.replace(/```json/g, '').replace(/```/g, '').trim();
                    const parsed = JSON.parse(cleanJsonStr);

                    if (parsed.amount) {
                        parsed.amount = parseFloat(String(parsed.amount).replace(/[^0-9.]/g, '')) || 0;
                    }
                    return parsed;
                } catch (err) {
                    console.warn(`Attempt with ${model} failed:`, err.message);
                    lastError = err;
                }
            }

            throw lastError || new Error("Gagal memproses OCR via Gemini API.");
        }

        const INITIAL_CARDS = [
            { id: 'card-1', label: 'Mandiri e-Money Utama', number: '6032 9812 3456 7890', bank: 'Mandiri', color: 'from-blue-600 via-indigo-700 to-blue-900' },
            { id: 'card-2', label: 'BCA Flazz Operasional', number: '6013 1234 5678 9012', bank: 'BCA', color: 'from-sky-600 via-blue-700 to-indigo-950' }
        ];

        const INITIAL_DUMMY_TXS = [
            { id: 'tx_1', etollNumber: '6032 9812 3456 7890', merchant: 'Mandiri e-Money / Livin', amount: 250000, invoiceNumber: 'INV/2026/08/101', date: '2026-08-01', source: 'Web Scan' },
            { id: 'tx_2', etollNumber: '6013 1234 5678 9012', merchant: 'BCA Flazz TopUp Indomaret', amount: 150000, invoiceNumber: 'IND/FLZ/98212', date: '2026-08-03', source: 'Telegram Bot' },
            { id: 'tx_3', etollNumber: '6032 9812 3456 7890', merchant: 'Gerbang Tol Cikarang Utama', amount: 84000, invoiceNumber: 'JMR/CKR/22901', date: '2026-08-05', source: 'Web Scan' },
            { id: 'tx_4', etollNumber: '6013 1234 5678 9012', merchant: 'Tokopedia e-Toll Topup', amount: 200000, invoiceNumber: 'TKP/2026/88210', date: '2026-08-06', source: 'Telegram Bot' },
            { id: 'tx_5', etollNumber: '6032 9812 3456 7890', merchant: 'BRI Brizzi Rest Area KM 57', amount: 50000, invoiceNumber: 'BRZ/KM57/00341', date: '2026-08-07', source: 'Web Scan' }
        ];

        const currentYearMonth = new Date().toISOString().substring(0, 7);

        function MasterDataTab({ cards, setCards, transactions, setTransactions, setMonthlyDeposits, firebaseProjectId, fetchCloudData, showToastNotification, handleAddCard, deletedCardNumbers, setDeletedCardNumbers }) {
            const [securityModal, setSecurityModal] = React.useState(null);
            const [passwordInput, setPasswordInput] = React.useState('');
            const [passError, setPassError] = React.useState('');
            const [showNewCardInput, setShowNewCardInput] = React.useState(false);
            const [newCardData, setNewCardData] = React.useState({ label: '', number: '', bank: 'Mandiri' });

            const REQUIRED_PASSWORD = 'anda321';

            const handleConfirmAction = async () => {
                if (passwordInput !== REQUIRED_PASSWORD) {
                    setPassError('Password konfirmasi salah! Harap periksa kembali.');
                    return;
                }

                if (!securityModal) return;

                const { type, payload } = securityModal;

                if (type === 'DELETE_CARD') {
                    const cleanNum = (payload.number || '').replace(/\D/g, '');
                    setCards(prev => prev.filter(c => c.id !== payload.id));
                    if (cleanNum) {
                        setDeletedCardNumbers(prev => [...prev, cleanNum]);
                    }
                    showToastNotification(`Kartu (${payload.number}) berhasil dihapus.`);
                } else if (type === 'RESET_LOCAL') {
                    setTransactions([]);
                    localStorage.removeItem('etoll_transactions');
                    showToastNotification('Database lokal berhasil dibersihkan.', 'info');
                } else if (type === 'RESET_ALL') {
                    setTransactions([]);
                    setCards(INITIAL_CARDS);
                    setMonthlyDeposits({});
                    setDeletedCardNumbers([]);
                    localStorage.removeItem('etoll_transactions');
                    localStorage.removeItem('etoll_cards');
                    localStorage.removeItem('etoll_monthly_deposits');
                    localStorage.removeItem('etoll_deleted_cards');

                    if (firebaseProjectId) {
                        try {
                            const targetPid = firebaseProjectId.trim();
                            const dbUrl = `https://${targetPid}-default-rtdb.asia-southeast1.firebasedatabase.app/transactions.json`;
                            await fetch(dbUrl, { method: 'DELETE' });
                            showToastNotification('Seluruh database Cloud & Lokal berhasil dihapus permanen!', 'info');
                            fetchCloudData();
                        } catch (e) {
                            showToastNotification('Lokal terhapus, gagal menghapus Cloud Firebase.', 'error');
                        }
                    } else {
                        showToastNotification('Seluruh data lokal berhasil dibersihkan.', 'info');
                    }
                }

                setSecurityModal(null);
                setPasswordInput('');
                setPassError('');
            };

            const handleCreateCardManual = (e) => {
                e.preventDefault();
                if (!newCardData.number || newCardData.number.replace(/\D/g, '').length < 16) {
                    showToastNotification('Nomor kartu harus 16 digit.', 'error');
                    return;
                }
                handleAddCard(newCardData);
                setNewCardData({ label: '', number: '', bank: 'Mandiri' });
                setShowNewCardInput(false);
            };

            return (
                <div className="space-y-6 max-w-5xl mx-auto">

                    <div className="glass-card p-6 rounded-3xl border border-slate-700/70 shadow-xl space-y-4">

                                <h3 className="font-extrabold text-base text-white flex items-center gap-2">
                                    <i className="fa-solid fa-id-card text-brand-400"></i>
                                    <span>Master Kelola Kartu e-Toll</span>
                                    <span className="text-xs px-2.5 py-0.5 rounded-full bg-slate-800 text-slate-300 font-bold border border-slate-700">
                                        {cards.length} Kartu Terdaftar
                                    </span>
                                </h3>
                                <p className="text-xs text-slate-400 mt-0.5">Tambah atau hapus master kartu terdaftar dalam sistem.</p>
                            </div>
                            <button 
                                onClick={() => setShowNewCardInput(!showNewCardInput)}
                                className="bg-gradient-to-r from-brand-600 to-indigo-600 hover:from-brand-500 hover:to-indigo-500 text-white font-bold text-xs px-3.5 py-2 rounded-xl flex items-center gap-2 shadow-md transition"
                            >
                                <i className={`fa-solid ${showNewCardInput ? 'fa-xmark' : 'fa-plus'}`}></i>
                                <span>{showNewCardInput ? 'Batal' : 'Tambah Kartu Manual'}</span>
                            </button>
                        </div>

                        {showNewCardInput && (
                            <form onSubmit={handleCreateCardManual} className="p-4 bg-slate-900/90 rounded-2xl border border-slate-800 space-y-3">
                                <h4 className="text-xs font-bold text-brand-300 uppercase tracking-wider">Tambah Kartu Baru</h4>
                                <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 text-xs">
                                    <div>
                                        <label className="block text-[10px] font-bold text-slate-400 mb-1">Label / Nama Kartu</label>
                                        <input 
                                            type="text" 
                                            placeholder="Contoh: Flazz Tim Lapangan" 
                                            value={newCardData.label} 
                                            onChange={e => setNewCardData({...newCardData, label: e.target.value})}
                                            className="w-full p-2.5 bg-slate-950 border border-slate-700 rounded-xl text-white font-medium"
                                            required
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-[10px] font-bold text-slate-400 mb-1">Nomor Kartu (16 Digit)</label>
                                        <input

                                        Simpan Kartu

                            </form>
                        )}

                        <div className="overflow-x-auto custom-scrollbar rounded-2xl border border-slate-800">

                                                </button>
                                            </td>

        function App() {
            const [cards, setCards] = React.useState(() => JSON.parse(localStorage.getItem('etoll_cards')) || INITIAL_CARDS);
            const [deletedCardNumbers, setDeletedCardNumbers] = React.useState(() => JSON.parse(localStorage.getItem('etoll_deleted_cards')) || []);
            const [transactions, setTransactions] = React.useState(() => JSON.parse(localStorage.getItem('etoll_transactions')) || INITIAL_DUMMY_TXS);
            const [firebaseProjectId, setFirebaseProjectId] = React.useState(() => localStorage.getItem('etoll_fb_pid') || 'etoll-3366c');
            const [tempFbPid, setTempFbPid] = React.useState(() => localStorage.getItem('etoll_fb_pid') || 'etoll-3366c');
            const [geminiApiKey, setGeminiApiKey] = React.useState(() => localStorage.getItem('etoll_gemini_key') || '');

            const [monthlyDeposits, setMonthlyDeposits] = React.useState(() => JSON.parse(localStorage.getItem('etoll_monthly_deposits')) || {
                [currentYearMonth]: 1500000
            });

            const [dailyUsage, setDailyUsage] = React.useState(() => {
                const today = new Date().toISOString().split('T')[0];
                const saved = JSON.parse(localStorage.getItem('etoll_daily_usage')) || {};
                if (saved.date === today) {
                    return saved;
                }
                return { date: today, count: 2, bytes: 1048576 };
            });

            const FREE_DAILY_LIMIT = 10;

            const updateDailyUsage = (addedBytes = 500000) => {
                const today = new Date().toISOString().split('T')[0];
                setDailyUsage(prev => {
                    const isToday = prev.date === today;
                    const newCount = isToday ? prev.count + 1 : 1;
                    const newBytes = isToday ? prev.bytes + addedBytes : addedBytes;
                    const updated = { date: today, count: newCount, bytes: newBytes };
                    localStorage.setItem('etoll_daily_usage', JSON.stringify(updated));
                    return updated;
                });
            };

            const [spjProfile, setSpjProfile] = React.useState(() => JSON.parse(localStorage.getItem('etoll_spj_profile')) || {
                applicantName: 'Ahmad Subagja',
                division: 'Operasional Logistik',
                vehicleNopol: 'B 1928 SFA',
                companyName: 'PT Nusantara Trans',
                supervisorName: 'Hendra Wijaya'
            });

            const [activeTab, setActiveTab] = React.useState('dashboard');
            const [selectedMonth, setSelectedMonth] = React.useState(currentYearMonth);
            const [selectedCardFilter, setSelectedCardFilter] = React.useState('ALL');
            const [searchQuery, setSearchQuery] = React.useState('');
            const [sortConfig, setSortConfig] = React.useState({ key: 'date', direction: 'desc' });

            const [showScanModal, setShowScanModal] = React.useState(false);
            const [showNfcModal, setShowNfcModal] = React.useState(false);
            const [showSpjPrintModal, setShowSpjPrintModal] = React.useState(false);
            const [deletingTx, setDeletingTx] = React.useState(null);
            const [editingTx, setEditingTx] = React.useState(null);
            const [inspectingTx, setInspectingTx] = React.useState(null);
            const [toast, setToast] = React.useState(null);

            const [syncStatus, setSyncStatus] = React.useState({ state: 'idle', msg: 'Memulai koneksi...' });
            const [isSyncing, setIsSyncing] = React.useState(false);

            const fetchCloudData = React.useCallback(async (pidOverride = null) => {
                const targetPid = (pidOverride !== null ? pidOverride : firebaseProjectId).trim();
                if (!targetPid) {
                    setSyncStatus({ state: 'idle', msg: 'Cloud Sync Non-Aktif (Project ID Kosong)' });
                    return;
                }
                
                setIsSyncing(true);
                const primaryUrl = `https://${targetPid}-default-rtdb.asia-southeast1.firebasedatabase.app/transactions.json`;

                try {
                    let res = await fetch(primaryUrl);
                    if (!res.ok) {
                        throw new Error(`Realtime DB Error ${res.status}. Pastikan Rules database terbuka.`);
                    }
                    const data = await res.json();
                    if (data) {
                        const cloudTxs = Object.keys(data).map(key => ({
                            id: key,
                            ...data[key]
                        }));

                        setTransactions(cloudTxs.sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0)));
                        setSyncStatus({ state: 'success', msg: `Terhubung Realtime DB (${cloudTxs.length} data Cloud)` });
                    } else {
                        setSyncStatus({ state: 'success', msg: 'Terhubung ke Firebase (Database Kosong)' });
                    }
                } catch (e) {
                    console.warn("Cloud Sync Error:", e);
                    setSyncStatus({ state: 'error', msg: e.message || "Gagal terhubung ke Firebase" });
                } finally {
                    setIsSyncing(false);
                }
            }, [firebaseProjectId]);

            React.useEffect(() => {
                if (firebaseProjectId) {
                    fetchCloudData();
                    const interval = setInterval(() => fetchCloudData(), 12000);
                    return () => clearInterval(interval);
                }
            }, [firebaseProjectId, fetchCloudData]);

            React.useEffect(() => { localStorage.setItem('etoll_cards', JSON.stringify(cards)); }, [cards]);
            React.useEffect(() => { localStorage.setItem('etoll_deleted_cards', JSON.stringify(deletedCardNumbers)); }, [deletedCardNumbers]);
            React.useEffect(() => { localStorage.setItem('etoll_transactions', JSON.stringify(transactions)); }, [transactions]);
            React.useEffect(() => { localStorage.setItem('etoll_fb_pid', firebaseProjectId); }, [firebaseProjectId]);
            React.useEffect(() => { localStorage.setItem('etoll_gemini_key', geminiApiKey); }, [geminiApiKey]);
            React.useEffect(() => { localStorage.setItem('etoll_spj_profile', JSON.stringify(spjProfile)); }, [spjProfile]);
            React.useEffect(() => { localStorage.setItem('etoll_monthly_deposits', JSON.stringify(monthlyDeposits)); }, [monthlyDeposits]);

            React.useEffect(() => {
                if (!transactions || transactions.length === 0) return;
                
                setCards(prevCards => {
                    let updatedCards = [...prevCards];
                    let hasNewCard = false;

                    transactions.forEach(tx => {
                        const formattedNum = formatCardNumber(tx.etollNumber);
                        if (!formattedNum) return;

                        const cleanNum = formattedNum.replace(/\D/g, '');
                        if (deletedCardNumbers.includes(cleanNum)) return;

                        const exists = updatedCards.some(c => (c.number || '').replace(/\D/g, '') === cleanNum);
                        
                        if (!exists) {
                            const detected = detectBankFromCardNumber(formattedNum, tx.merchant);
                            const last4 = cleanNum.slice(-4) || '0000';
                            updatedCards.push({
                                id: 'card-auto-' + Date.now() + '-' + Math.random().toString(36).substring(2, 6),
                                label: `${detected.label} (${last4})`,
                                number: formattedNum,
                                bank: detected.bank,
                                color: detected.color
                            });
                            hasNewCard = true;
                        }
                    });

                    return hasNewCard ? updatedCards : prevCards;
                });
            }, [transactions, deletedCardNumbers]);

            const showToastNotification = (msg, type = 'success') => {
                setToast({ msg, type });
                setTimeout(() => setToast(null), 4000);
            };

            const copyToClipboard = (text, label) => {
                navigator.clipboard.writeText(text);
                showToastNotification(`${label} (${text}) berhasil disalin!`);
            };

            const checkDuplicateInvoice = (invoiceNum, excludeId = null) => {
                if (!invoiceNum || !invoiceNum.trim()) return false;
                const clean = invoiceNum.trim().toUpperCase();
                return transactions.some(t => t.id !== excludeId && t.invoiceNumber && t.invoiceNumber.trim().toUpperCase() === clean);
            };

            const handleAddCard = (newCardData) => {
                const formattedNum = formatCardNumber(newCardData.number);
                if (!formattedNum) return null;
                const cleanNum = formattedNum.replace(/\D/g, '');
                
                setDeletedCardNumbers(prev => prev.filter(n => n !== cleanNum));

                const existing = cards.find(c => (c.number || '').replace(/\D/g, '') === cleanNum);
                if (existing) return existing;

                const detected = detectBankFromCardNumber(formattedNum, newCardData.merchant || newCardData.label);
                const last4 = cleanNum.slice(-4) || '0000';
                const newCard = {
                    id: 'card-' + Date.now(),
                    label: newCardData.label || `${detected.label} (${last4})`,
                    number: formattedNum,
                    bank: newCardData.bank || detected.bank,
                    color: detected.color
                };
                setCards(prev => [...prev, newCard]);
                showToastNotification(`Kartu baru (${formattedNum}) berhasil ditambahkan.`);
                return newCard;
            };

            const handleSaveTransaction = async (txData) => {
                let cardNum = formatCardNumber(txData.etollNumber);
                if (cardNum && !cards.some(c => (c.number || '').replace(/\D/g, '') === cardNum.replace(/\D/g, ''))) {
                    handleAddCard({ label: txData.merchant || 'Card', number: cardNum });
                }

                const updatedTx = { 
                    id: txData.id || ('tx_' + Date.now() + '_' + Math.random().toString(36).substring(2, 6)),
                    etollNumber: cardNum,
                    merchant: txData.merchant,
                    amount: Number(txData.amount || 0),
                    invoiceNumber: txData.invoiceNumber,
                    date: txData.date,
                    source: txData.source || 'Web Scan / Manual',
                    createdAt: txData.createdAt || new Date().toISOString()
                };

                setTransactions(prev => [updatedTx, ...prev.filter(t => t.id !== updatedTx.id)]);
                if (updatedTx.date) setSelectedMonth(updatedTx.date.substring(0, 7));

                if (firebaseProjectId) {
                    try {
                        const targetPid = firebaseProjectId.trim();
                        const primaryUrl = `https://${targetPid}-default-rtdb.asia-southeast1.firebasedatabase.app/transactions/${updatedTx.id}.json`;

                        await fetch(primaryUrl, {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(updatedTx)
                        });
                        fetchCloudData();
                    } catch (e) { console.error("Cloud Push Error:", e); }
                }

                setShowScanModal(false);
                setEditingTx(null);
                showToastNotification('Transaksi berhasil dicatat!');
            };

            const handleDeleteTransaction = async (id) => {
                setTransactions(prev => prev.filter(t => t.id !== id));
                setDeletingTx(null);

                if (firebaseProjectId) {
                    try {
                        const targetPid = firebaseProjectId.trim();
                        const dbUrl = `https://${targetPid}-default-rtdb.asia-southeast1.firebasedatabase.app/transactions/${id}.json`;
                        await fetch(dbUrl, { method: 'DELETE' });
                        showToastNotification('Transaksi dihapus dari Firebase Database!', 'info');
                    } catch (e) {
                        console.error("Error deleting from Firebase:", e);
                        showToastNotification('Terhapus di lokal, gagal di Firebase.', 'error');
                    }
                } else {
                    showToastNotification('Transaksi dihapus dari penyimpanan lokal.', 'info');
                }
            };

            const handleExportCsv = () => {
                const headers = ["No", "Tanggal", "Merchant", "Nomor e-Toll", "No Invoice", "Nominal (Rp)", "Sumber"];
                const rows = filteredTransactions.map((t, index) => [
                    index + 1,
                    t.date,
                    `"${(t.merchant || '').replace(/"/g, '""')}"`,
                    `"${t.etollNumber}"`,
                    `"${t.invoiceNumber}"`,
                    t.amount,
                    `"${t.source || 'Web Scan'}"`
                ]);
                
                const csvContent = "data:text/csv;charset=utf-8," 
                    + [headers.join(","), ...rows.map(e => e.join(","))].join("\n");
                
                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", `Rekap_SPJ_eToll_${selectedMonth}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const handleExportExcel = () => {
                const currentDeposit = monthlyDeposits[selectedMonth] || 0;
                const totalSpent = filteredTransactions.reduce((s, t) => s + Number(t.amount || 0), 0);
                const balance = currentDeposit - totalSpent;

                const wb = XLSX.utils.book_new();
                
                const data = [
                    ["SURAT PERTANGGUNGJAWABAN (SPJ) BIAYA OPERASIONAL E-TOLL"],
                    [`PERIODE: ${selectedMonth === 'ALL' ? 'Semua Periode' : selectedMonth}`],
                    [`Nama Pemohon`, spjProfile.applicantName, "", `Divisi`, spjProfile.division],
                    [`Nopol Kendaraan`, spjProfile.vehicleNopol, "", `Perusahaan`, spjProfile.companyName],
                    [""],
                    ["RINGKASAN DEPOSIT UANG MUKA & REALISASI"],
                    ["Deposit Uang Muka (Kasbon)", currentDeposit],
                    ["Total Realisasi e-Toll", totalSpent],
                    [balance >= 0 ? "Sisa Deposit (Pengembalian)" : "Kurang Bayar (Reimbursement)", Math.abs(balance)],
                    ["Terbilang Realisasi", terbilangRupiah(totalSpent)],
                    [""],
                    ["RINCIAN TRANSAKSI E-TOLL"],
                    ["No", "Tanggal", "Merchant / Pembelian", "Nomor Card e-Toll", "No. Invoice / Resi", "Nominal (Rp)", "Sumber Data"]
                ];

                filteredTransactions.forEach((t, idx) => {
                    data.push([
                        idx + 1,
                        t.date,
                        t.merchant,
                        t.etollNumber,
                        t.invoiceNumber,
                        Number(t.amount || 0),
                        t.source || 'Web Scan'
                    ]);
                });

                data.push(["", "", "", "", "TOTAL REALISASI:", totalSpent, ""]);

                const ws = XLSX.utils.aoa_to_sheet(data);
                ws['!cols'] = [{ wch: 6 }, { wch: 14 }, { wch: 28 }, { wch: 22 }, { wch: 22 }, { wch: 18 }, { wch: 16 }];

                XLSX.utils.book_append_sheet(wb, ws, "Rekap_SPJ_eToll");
                XLSX.writeFile(wb, `Rekap_SPJ_eToll_${selectedMonth}.xlsx`);
                showToastNotification("Berkas Excel (.xlsx) berhasil diunduh!");
            };

            const handleSaveCloudSettings = async () => {
                const cleanPid = tempFbPid.trim();
                setFirebaseProjectId(cleanPid);
                localStorage.setItem('etoll_fb_pid', cleanPid);
                localStorage.setItem('etoll_gemini_key', geminiApiKey);
                
                showToastNotification("Menguji koneksi ke Realtime DB...");
                await fetchCloudData(cleanPid);
            };

            const availableMonths = React.useMemo(() => {
                const setM = new Set();
                setM.add(currentYearMonth);
                transactions.forEach(t => {
                    if (t.date && t.date.length >= 7) {
                        setM.add(t.date.substring(0, 7));
                    }
                });
                return Array.from(setM).sort().reverse();
            }, [transactions]);

            const filteredTransactions = React.useMemo(() => {
                let result = transactions.filter(t => {
                    const matchesMonth = selectedMonth === 'ALL' || (t.date && t.date.startsWith(selectedMonth));
                    const cleanCardFilter = selectedCardFilter !== 'ALL' ? selectedCardFilter.replace(/\D/g, '') : 'ALL';
                    const cleanTxCard = (t.etollNumber || '').replace(/\D/g, '');
                    const matchesCard = selectedCardFilter === 'ALL' || cleanTxCard === cleanCardFilter;
                    const matchesSearch = !searchQuery || 
                        (t.merchant && t.merchant.toLowerCase().includes(searchQuery.toLowerCase())) ||
                        (t.invoiceNumber && t.invoiceNumber.toLowerCase().includes(searchQuery.toLowerCase())) ||
                        (t.etollNumber && t.etollNumber.toLowerCase().includes(searchQuery.toLowerCase()));
                    return matchesMonth && matchesCard && matchesSearch;
                });

                if (sortConfig.key) {
                    result.sort((a, b) => {
                        let aVal = a[sortConfig.key] || '';
                        let bVal = b[sortConfig.key] || '';
                        if (sortConfig.key === 'amount') {
                            aVal = Number(aVal || 0);
                            bVal = Number(bVal || 0);
                        }
                        if (aVal < bVal) return sortConfig.direction === 'asc' ? -1 : 1;
                        if (aVal > bVal) return sortConfig.direction === 'asc' ? 1 : -1;
                        return 0;
                    });
                }
                return result;
            }, [transactions, selectedMonth, selectedCardFilter, searchQuery, sortConfig]);

            const handleSort = (key) => {
                setSortConfig(prev => ({
                    key,
                    direction: prev.key === key && prev.direction === 'asc' ? 'desc' : 'asc'
                }));
            };

            const monthTotalSpent = React.useMemo(() => {
                return filteredTransactions.reduce((s, t) => s + Number(t.amount || 0), 0);
            }, [filteredTransactions]);

            const tableStats = React.useMemo(() => {
                const count = filteredTransactions.length;
                const total = monthTotalSpent;
                const avg = count > 0 ? total / count : 0;
                const max = count > 0 ? Math.max(...filteredTransactions.map(t => Number(t.amount || 0))) : 0;
                return { count, total, avg, max };
            }, [filteredTransactions, monthTotalSpent]);

            const cardBreakdown = React.useMemo(() => {
                const cardMap = {};

                cards.forEach(c => {
                    const formattedNum = formatCardNumber(c.number);
                    const cleanNum = formattedNum.replace(/\D/g, '');
                    cardMap[cleanNum] = {
                        id: c.id,
                        label: c.label,
                        bank: c.bank,
                        number: formattedNum,
                        total: 0,
                        count: 0
                    };
                });

                filteredTransactions.forEach(t => {
                    const formattedNum = formatCardNumber(t.etollNumber);
                    const cleanNum = formattedNum.replace(/\D/g, '');
                    if (cleanNum) {
                        if (!cardMap[cleanNum]) {
                            const detected = detectBankFromCardNumber(formattedNum, t.merchant);
                            cardMap[cleanNum] = {
                                id: 'unregistered-' + cleanNum,
                                label: `${detected.label} (${cleanNum.slice(-4) || 'e-Toll'})`,
                                bank: detected.bank,
                                number: formattedNum,
                                total: 0,
                                count: 0
                            };
                        }
                        cardMap[cleanNum].total += Number(t.amount || 0);
                        cardMap[cleanNum].count += 1;
                    }
                });

                const list = Object.values(cardMap).filter(item => item.total > 0);
                list.sort((a, b) => b.total - a.total);
                return list;
            }, [cards, filteredTransactions]);

            const grandTotalSpent = React.useMemo(() => {
                return transactions.reduce((s, t) => s + Number(t.amount || 0), 0);
            }, [transactions]);

            const overallCardBreakdown = React.useMemo(() => {
                const cardMap = {};

                cards.forEach(c => {
                    const formattedNum = formatCardNumber(c.number);
                    const cleanNum = formattedNum.replace(/\D/g, '');
                    cardMap[cleanNum] = {
                        id: c.id,
                        label: c.label,
                        bank: c.bank,
                        number: formattedNum,
                        total: 0,
                        count: 0
                    };
                });

                transactions.forEach(t => {
                    const formattedNum = formatCardNumber(t.etollNumber);
                    const cleanNum = formattedNum.replace(/\D/g, '');
                    if (cleanNum) {
                        if (!cardMap[cleanNum]) {
                            const detected = detectBankFromCardNumber(formattedNum, t.merchant);
                            cardMap[cleanNum] = {
                                id: 'unregistered-' + cleanNum,
                                label: `${detected.label} (${cleanNum.slice(-4) || 'e-Toll'})`,
                                bank: detected.bank,
                                number: formattedNum,
                                total: 0,
                                count: 0
                            };
                        }
                        cardMap[cleanNum].total += Number(t.amount || 0);
                        cardMap[cleanNum].count += 1;
                    }
                });

                const list = Object.values(cardMap);
                list.sort((a, b) => b.total - a.total);
                return list;
            }, [cards, transactions]);

            const activeDeposit = monthlyDeposits[selectedMonth] || 0;
            const depositBalance = activeDeposit - monthTotalSpent;

            return (
                <div className="min-h-screen flex flex-col relative overflow-hidden">

        function NfcModal({ cards, setCards, transactions, currentMonth, onClose, showToastNotification }) {
            const [scannedCardNum, setScannedCardNum] = React.useState('');
            const [scannedUid, setScannedUid] = React.useState('');
            const [matchedCard, setMatchedCard] = React.useState(null);
            const [isScanning, setIsScanning] = React.useState(false);
            const [unregisteredMode, setUnregisteredMode] = React.useState(false);
            
            // Pair/Register Form State
            const [pairingOption, setPairingOption] = React.useState('EXISTING');
            const [selectedExistingCardId, setSelectedExistingCardId] = React.useState('');
            const [newCardForm, setNewCardForm] = React.useState({ label: '', number: '', bank: 'Mandiri' });

            const [nfcSupported] = React.useState('NDEFReader' in window);
            const [nfcStatus, setNfcStatus] = React.useState(
                'NDEFReader' in window 
                    ? 'Klik "Aktifkan Sensor NFC HP" lalu tempelkan kartu e-Toll ke belakang perangkat Anda.' 
                    : 'Browser ini tidak mendukung Web NFC API (Gunakan Chrome Android) atau jalankan Mode Simulasi.'
            );

            const handleNfcReadSuccess = (uidRaw, cardNumFromNdef = '') => {
                const cleanUid = (uidRaw || '').replace(/:/g, '').toUpperCase();
                setScannedUid(uidRaw || cleanUid);

                // Find card by matching nfcUid or number
                let foundCard = cards.find(c => {
                    const cCleanNum = (c.number || '').replace(/\D/g, '');
                    const cNfcUid = (c.nfcUid || '').replace(/:/g, '').toUpperCase();
                    return (cleanUid && cNfcUid === cleanUid) || (cleanUid && cCleanNum.includes(cleanUid));
                });

                if (!foundCard && cardNumFromNdef) {
                    const formattedNdef = formatCardNumber(cardNumFromNdef);
                    foundCard = cards.find(c => c.number === formattedNdef);
                }

                if (foundCard) {
                    setScannedCardNum(foundCard.number);
                    setMatchedCard(foundCard);
                    setUnregisteredMode(false);
                    setNfcStatus(`Kartu Terdaftar Ditemukan: ${foundCard.label}`);
                } else {
                    setScannedCardNum('');
                    setMatchedCard(null);
                    setUnregisteredMode(true);
                    setNfcStatus(`Kartu NFC Terdeteksi! (UID: ${uidRaw || 'N/A'}). Silakan hubungkan dengan data kartu.`);
                }
            };

            const startNfcScan = async () => {
                if (!('NDEFReader' in window)) {
                    setNfcStatus('Web NFC tidak didukung di browser ini. Gunakan Google Chrome di Android.');
                    return;
                }

                try {
                    setNfcStatus('Meminta izin akses sensor NFC browser...');
                    const ndef = new window.NDEFReader();
                    await ndef.scan();
                    setIsScanning(true);
                    setNfcStatus('Sensor NFC Aktif! Tempelkan kartu e-Toll ke belakang HP...');

                    ndef.onreading = (event) => {
                        if (navigator.vibrate) {
                            try { navigator.vibrate([100, 50, 100]); } catch (e) {}
                        }

                        const uid = event.serialNumber || '';
                        let cardNumFromNdef = '';
                        if (event.message && event.message.records) {
                            for (const record of event.message.records) {
                                if (record.recordType === 'text') {
                                    try {
                                        const textDecoder = new TextDecoder(record.encoding || 'utf-8');
                                        cardNumFromNdef = textDecoder.decode(record.data);
                                    } catch (e) {}
                                }
                            }
                        }

                        handleNfcReadSuccess(uid, cardNumFromNdef);
                    };

                    ndef.onreadingerror = () => {
                        if (navigator.vibrate) {
                            try { navigator.vibrate(200); } catch (e) {}
                        }
                        setNfcStatus('Kartu terdeteksi! Tempelkan rapat posisi chip kartu dengan sensor HP.');
                    };
                } catch (error) {
                    console.error("NFC Scan Error:", error);
                    setIsScanning(false);
                    if (error.name === 'NotAllowedError') {
                        setNfcStatus('Akses NFC ditolak. Berikan izin akses pada pop-up Chrome Anda.');
                    } else {
                        setNfcStatus('Gagal mengaktifkan NFC: ' + (error.message || error));
                    }
                }
            };

            const handleSimulateNfc = () => {
                const shouldPickUnregistered = Math.random() > 0.5 || cards.length === 0;
                if (!shouldPickUnregistered && cards.length > 0) {
                    const randomCard = cards[Math.floor(Math.random() * cards.length)];
                    handleNfcReadSuccess(randomCard.nfcUid || '04:A2:B3:C4:D5:E6', randomCard.number);
                } else {
                    const fakeUid = '04:' + Math.floor(10+Math.random()*89) + ':' + Math.floor(10+Math.random()*89) + ':A1:B2:C3';
                    handleNfcReadSuccess(fakeUid);
                }
            };

            const handleSaveNfcPairing = (e) => {
                e.preventDefault();
                const cleanUid = (scannedUid || '').replace(/:/g, '').toUpperCase();

                if (pairingOption === 'EXISTING') {
                    if (!selectedExistingCardId) {
                        showToastNotification('Pilih kartu terdaftar yang ingin dihubungkan.', 'error');
                        return;
                    }
                    setCards(prev => prev.map(c => {
                        if (c.id === selectedExistingCardId) {
                            const updated = { ...c, nfcUid: cleanUid };
                            setMatchedCard(updated);
                            setScannedCardNum(updated.number);
                            return updated;
                        }
                        return c;
                    }));
                    showToastNotification('Sensor NFC berhasil dihubungkan dengan kartu pilihan!');
                } else {
                    if (!newCardForm.number || newCardForm.number.replace(/\D/g, '').length < 16) {
                        showToastNotification('Nomor kartu harus 16 digit.', 'error');
                        return;
                    }
                    const formattedNum = formatCardNumber(newCardForm.number);
                    const detected = detectBankFromCardNumber(formattedNum, newCardForm.label);
                    const newCard = {
                        id: 'card-nfc-' + Date.now(),
                        label: newCardForm.label || `${detected.label} (${formattedNum.slice(-4)})`,
                        number: formattedNum,
                        bank: newCardForm.bank || detected.bank,
                        color: detected.color,
                        nfcUid: cleanUid
                    };
                    setCards(prev => [...prev, newCard]);
                    setMatchedCard(newCard);
                    setScannedCardNum(newCard.number);
                    showToastNotification(`Kartu NFC baru (${formattedNum}) berhasil didaftarkan!`);
                }

                setUnregisteredMode(false);
            };

            const cardSpentThisMonth = React.useMemo(() => {
                if (!scannedCardNum) return 0;
                const cleanTarget = scannedCardNum.replace(/\D/g, '');
                return transactions
                    .filter(t => (t.etollNumber || '').replace(/\D/g, '') === cleanTarget && t.date && t.date.startsWith(currentMonth))
                    .reduce((s, t) => s + Number(t.amount || 0), 0);
            }, [scannedCardNum, transactions, currentMonth]);

            return (
                <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4 backdrop-blur-md modal-backdrop overflow-y-auto">
                    <div className="glass-panel p-6 rounded-3xl max-w-md w-full space-y-4 my-6 shadow-2xl border border-slate-700">
                        <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                            <h3 className="font-extrabold text-base flex items-center gap-2 text-purple-400">
                                <i className="fa-solid fa-nfc-symbol"></i> Web NFC Hardware Reader
                            </h3>
                            <button onClick={onClose} className="text-slate-400 hover:text-white text-lg">
                                <i className="fa-solid fa-xmark"></i>
                            </button>
                        </div>

                        <div className="py-2 space-y-3 text-center">
                            <div className={`w-20 h-20 rounded-full border flex items-center justify-center mx-auto text-3xl transition-all duration-500 ${
                                isScanning 
                                    ? 'bg-purple-600/30 border-purple-400 text-purple-300 animate-pulse shadow-lg shadow-purple-500/30' 
                                    : 'bg-slate-900 border-slate-700 text-slate-500'
                            }`}>
                                <i className="fa-solid fa-wifi rotate-90"></i>
                            </div>

                            <div className="p-3 bg-slate-950/80 rounded-2xl border border-slate-800 text-xs">
                                <p className="font-bold text-slate-200">{nfcStatus}</p>
                            </div>

                            <div className="flex flex-col gap-2">
                                {nfcSupported ? (
                                    <button 
                                        onClick={startNfcScan} 
                                        disabled={isScanning}
                                        className={`w-full py-3 rounded-xl font-extrabold text-xs flex items-center justify-center gap-2 shadow-lg transition ${
                                            isScanning 
                                                ? 'bg-emerald-600 text-white animate-pulse' 
                                                : 'bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white'
                                        }`}
                                    >
                                        <i className={`fa-solid ${isScanning ? 'fa-circle-notch animate-spin' : 'fa-podcast'}`}></i>
                                        <span>{isScanning ? 'Sensor NFC Siap Membaca...' : 'Aktifkan Sensor NFC HP'}</span>
                                    </button>
                                ) : (
                                    <div className="p-2.5 bg-amber-950/50 border border-amber-800/60 rounded-xl text-[11px] text-amber-300 text-left font-medium">
                                        <i className="fa-solid fa-circle-info mr-1 text-amber-400"></i>
                                        Web NFC memerlukan Google Chrome Android dengan hardware NFC aktif.
                                    </div>
                                )}

                                <button 
                                    onClick={handleSimulateNfc} 
                                    className="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3.5 py-2 rounded-xl font-bold border border-slate-700 transition"
                                >
                                    <i className="fa-solid fa-vial text-purple-400 mr-1"></i> Simulasi Tap NFC (Demo)
                                </button>
                            </div>
                        </div>

                        {/* FORM PAIRING KARTU JIKA KARTU NFC BELUM TERDAFTAR */}
                        {unregisteredMode && (
                            <form onSubmit={handleSaveNfcPairing} className="p-4 bg-amber-950/40 border border-amber-700/60 rounded-2xl text-left space-y-3">
                                <div className="flex items-center gap-2 text-amber-400 font-extrabold text-xs uppercase">
                                    <i className="fa-solid fa-triangle-exclamation"></i>
                                    <span>Kartu NFC Belum Terdaftar</span>
                                </div>
                                <p className="text-[11px] text-slate-300">
                                    UID Hardware: <span className="font-mono font-bold text-amber-300">{scannedUid}</span>. Pilih cara pendaftaran kartu ini:
                                </p>

                                <div className="flex gap-2 pt-1">
                                    <button 
                                        type="button" 
                                        onClick={() => setPairingOption('EXISTING')}
                                        className={`flex-1 py-1.5 px-2 rounded-lg text-[11px] font-bold border transition ${
                                            pairingOption === 'EXISTING' ? 'bg-amber-500/20 text-amber-300 border-amber-500' : 'bg-slate-900 text-slate-400 border-slate-800'
                                        }`}
                                    >
                                        Hubungkan Kartu Ada
                                    </button>
                                    <button 
                                        type="button" 
                                        onClick={() => setPairingOption('NEW')}
                                        className={`flex-1 py-1.5 px-2 rounded-lg text-[11px] font-bold border transition ${
                                            pairingOption === 'NEW' ? 'bg-amber-500/20 text-amber-300 border-amber-500' : 'bg-slate-900 text-slate-400 border-slate-800'
                                        }`}
                                    >
                                        Daftarkan Kartu Baru
                                    </button>
                                </div>

                                {pairingOption === 'EXISTING' ? (
                                    <div>
                                        <label className="block text-[10px] font-bold text-slate-400 mb-1">Pilih Kartu Terdaftar di Master:</label>
                                        <select 
                                            value={selectedExistingCardId}
                                            onChange={e => setSelectedExistingCardId(e.target.value)}
                                            className="w-full p-2 bg-slate-950 border border-slate-700 rounded-xl text-xs text-white font-bold"
                                            required
                                        >
                                            <option value="">-- Pilih Kartu --</option>
                                            {cards.map(c => (
                                                <option key={c.id} value={c.id}>
                                                    {c.label} ({c.number})
                                                </option>
                                            ))}
                                        </select>
                                    </div>
                                ) : (
                                    <div className="space-y-2 text-xs">
                                        <div>
                                            <label className="block text-[10px] font-bold text-slate-400 mb-1">Label Kartu</label>
                                            <input 
                                                type="text" 
                                                placeholder="Contoh: e-Money Tim Operasional" 
                                                value={newCardForm.label}
                                                onChange={e => setNewCardForm({...newCardForm, label: e.target.value})}
                                                className="w-full p-2 bg-slate-950 border border-slate-700 rounded-xl text-white font-medium"
                                                required
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-[10px] font-bold text-slate-400 mb-1">Nomor 16-Digit Fisik Kartu</label>
                                            <input 
                                                type="text" 
                                                placeholder="6032 1234 5678 9012" 
                                                value={newCardForm.number}
                                                onChange={e => setNewCardForm({...newCardForm, number: formatCardNumber(e.target.value)})}
                                                className="w-full p-2 bg-slate-950 border border-slate-700 rounded-xl font-mono text-white"
                                                required
                                            />
                                        </div>
                                    </div>
                                )}

                                <button 
                                    type="submit" 
                                    className="w-full py-2 bg-amber-600 hover:bg-amber-500 text-white font-bold rounded-xl text-xs shadow-md transition"
                                >
                                    Simpan & Hubungkan NFC
                                </button>
                            </form>
                        )}

                        {/* HASIL BACA KARTU YANG SUDAH TERHUBUNG */}
                        {scannedCardNum && !unregisteredMode && (
                            <div className="p-4 bg-slate-950 rounded-2xl border border-purple-900/60 text-left space-y-2">
                                <div className="flex justify-between items-center">
                                    <p className="text-[10px] font-bold text-purple-400 uppercase">Kartu NFC Terverifikasi:</p>
                                    {scannedUid && (
                                        <span className="text-[10px] font-mono text-slate-400 px-2 py-0.5 rounded bg-slate-900 border border-slate-800">
                                            UID: {scannedUid}
                                        </span>
                                    )}
                                </div>

                                <p className="text-base font-mono font-bold text-white">
                                    {scannedCardNum}
                                </p>

                                {matchedCard && (
                                    <p className="text-xs font-extrabold text-emerald-400 flex items-center gap-1">
                                        <i className="fa-solid fa-circle-check"></i>
                                        <span>{matchedCard.label} ({matchedCard.bank})</span>
                                    </p>
                                )}

                                <div className="pt-2 border-t border-slate-800 flex justify-between items-center">
                                    <span className="text-xs text-slate-400">Total Pengisian Bulan Ini ({currentMonth}):</span>
                                    <span className="text-lg font-black text-purple-300">{formatRupiah(cardSpentThisMonth)}</span>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        function SpjPrintModal({ spjProfile, selectedMonth, transactions, depositAmount, onClose }) {
            const totalAmount = transactions.reduce((sum, t) => sum + Number(t.amount || 0), 0);
            const balance = depositAmount - totalAmount;

            return (
                <div className="fixed inset-0 z-50 bg-black/90 flex items-center justify-center p-4 backdrop-blur-md overflow-y-auto modal-backdrop">
                    <div className="bg-white text-slate-900 p-8 rounded-2xl max-w-3xl w-full space-y-6 my-8 print-container shadow-2xl">
                        <div className="flex justify-between items-center border-b pb-4 no-print">
                            <h3 className="font-bold text-sm text-slate-800">Dokumen Lembar SPJ Resmi (Siap Cetak PDF)</h3>
                            <div className="flex gap-2">
                                <button onClick={() => window.print()} className="bg-brand-600 text-white text-xs font-bold px-4 py-2 rounded-xl flex items-center gap-2 hover:bg-brand-700 transition">
                                    <i className="fa-solid fa-print"></i> Cetak / Simpan PDF
                                </button>
                                <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-lg">
                                    <i className="fa-solid fa-xmark"></i>
                                </button>
                            </div>
                        </div>

                        <div className="p-4 space-y-6 bg-white text-black font-sans">
                            <div className="border-b-2 border-slate-800 pb-3 flex justify-between items-end">
                                <div>
                                    <h2 className="font-black text-xl uppercase tracking-wider">{spjProfile.companyName || 'PT NUSANTARA TRANS'}</h2>
                                    <p className="text-xs text-slate-600">SURAT PERTANGGUNGJAWABAN (SPJ) BIAYA OPERASIONAL E-TOLL</p>
                                </div>
                                <div className="text-right text-xs">
                                    <p className="font-bold">Periode: {selectedMonth}</p>
                                    <p className="text-slate-500">Tanggal Buat: {new Date().toLocaleDateString('id-ID')}</p>
                                </div>
                            </div>

                            <div className="grid grid-cols-2 gap-4 text-xs">
                                <div>
                                    <p><span className="font-bold">Nama Pemohon:</span> {spjProfile.applicantName}</p>
                                    <p><span className="font-bold">Divisi:</span> {spjProfile.division}</p>
                                    <p><span className="font-bold">Nopol Kendaraan:</span> {spjProfile.vehicleNopol}</p>
                                </div>
                                <div className="p-3 bg-slate-50 border rounded-lg space-y-1">
                                    <p className="flex justify-between"><span className="font-semibold">Deposit Uang Muka:</span> <span>{formatRupiah(depositAmount)}</span></p>
                                    <p className="flex justify-between"><span className="font-semibold">Total Realisasi e-Toll:</span> <span>{formatRupiah(totalAmount)}</span></p>
                                    <p className="flex justify-between font-bold border-t pt-1">
                                        <span>{balance >= 0 ? "Sisa Uang Muka:" : "Kurang Bayar:"}</span> 
                                        <span className={balance >= 0 ? "text-emerald-700" : "text-rose-700"}>{formatRupiah(Math.abs(balance))}</span>
                                    </p>
                                </div>
                            </div>

                            <table className="w-full text-left text-xs border-collapse border border-slate-300">
                                <thead>
                                    <tr className="bg-slate-100 border-b border-slate-300">
                                        <th className="p-2 border">No</th>
                                        <th className="p-2 border">Tanggal</th>
                                        <th className="p-2 border">Merchant / Pembelian</th>
                                        <th className="p-2 border">Nomor Kartu</th>
                                        <th className="p-2 border">No. Invoice</th>
                                        <th className="p-2 border text-right">Nominal (Rp)</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {transactions.map((t, idx) => (
                                        <tr key={t.id} className="border-b border-slate-200">
                                            <td className="p-2 border text-center">{idx + 1}</td>
                                            <td className="p-2 border">{formatDateIndo(t.date)}</td>
                                            <td className="p-2 border font-bold">{t.merchant}</td>
                                            <td className="p-2 border font-mono">{formatCardNumber(t.etollNumber)}</td>
                                            <td className="p-2 border font-mono">{t.invoiceNumber}</td>
                                            <td className="p-2 border text-right font-bold">{Number(t.amount).toLocaleString('id-ID')}</td>
                                        </tr>
                                    ))}
                                    <tr className="font-bold bg-slate-50 border-t-2 border-slate-400">
                                        <td colSpan="5" className="p-2 border text-right">TOTAL REALISASI SPJ:</td>
                                        <td className="p-2 border text-right">{formatRupiah(totalAmount)}</td>
                                    </tr>
                                </tbody>
                            </table>

                            <p className="text-xs italic font-semibold">Terbilang Realisasi: {terbilangRupiah(totalAmount)}</p>

                            <div className="grid grid-cols-3 gap-4 text-center text-xs pt-8">
                                <div>
                                    <p>Pemohon / Driver</p>
                                    <div className="h-16"></div>
                                    <p className="font-bold underline">{spjProfile.applicantName}</p>
                                </div>
                                <div>
                                    <p>Pemeriksa / Keuangan</p>
                                    <div className="h-16"></div>
                                    <p className="font-bold underline">( ............................ )</p>
                                </div>
                                <div>
                                    <p>Mengetahui / Atasan</p>
                                    <div className="h-16"></div>
                                    <p className="font-bold underline">{spjProfile.supervisorName || 'Hendra Wijaya'}</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
