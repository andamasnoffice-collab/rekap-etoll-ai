                                            </div>

                                            {/* 4. Bendahara Pengeluaran Pembantu (BPP) */}
                                            <div className="space-y-2 p-3 bg-slate-950/70 rounded-xl border border-slate-800 hover:border-amber-500/40 transition">
                                                <div className="flex items-center gap-1.5 pb-1 border-b border-slate-800/80">
                                                    <span className="w-5 h-5 rounded-md bg-amber-500/20 text-amber-300 flex items-center justify-center font-bold text-[10px]">4</span>
                                                    <p className="font-bold text-amber-300">Bendahara Pengeluaran Pembantu (BPP)</p>
                                                </div>
                                                <div>
                                                    <label className="text-[10px] text-slate-400 block mb-0.5">Nama Lengkap</label>
                                                    <input 
                                                        type="text" 
                                                        value={spjProfile.bppName || ''} 
                                                        onChange={e => setSpjProfile({...spjProfile, bppName: e.target.value})}
                                                        className="w-full p-2 bg-slate-900 border border-slate-700 rounded-lg text-white font-medium focus:ring-1 focus:ring-amber-400"
                                                        placeholder="Contoh: Rita Hindrawati, S.S."
                                                    />
                                                </div>
                                                <div>
                                                    <label className="text-[10px] text-slate-400 block mb-0.5">NIP</label>
                                                    <input 
                                                        type="text" 
                                                        value={spjProfile.bppNip || ''} 
                                                        onChange={e => setSpjProfile({...spjProfile, bppNip: e.target.value})}
                                                        className="w-full p-2 bg-slate-900 border border-slate-700 rounded-lg text-white font-mono focus:ring-1 focus:ring-amber-400"
                                                        placeholder="Contoh: 198203102009102001"
                                                    />
                                                </div>
                                            </div>
                                        </div>

                                        {/* Pengaturan Nomor & Administrasi Dokumen SPJ */}
                                        <div className="p-3.5 bg-slate-950/50 rounded-xl border border-slate-800 space-y-2.5">
                                            <p className="text-[11px] font-bold text-slate-300 flex items-center gap-2">
                                                <i className="fa-solid fa-file-pen text-indigo-400"></i>
                                                <span>Data Nomor Bukti & Mata Anggaran (Kuitansi & SPBy)</span>
                                            </p>
                                            <div className="grid grid-cols-1 sm:grid-cols-4 gap-3 text-xs">
                                                <div>
                                                    <label className="text-[10px] text-slate-400 block mb-1">Nomor Bukti</label>
                                                    <input 
                                                        type="text"
                                                        value={spjProfile.buktiNo || ''}
                                                        onChange={e => setSpjProfile({...spjProfile, buktiNo: e.target.value})}
                                                        placeholder="Contoh: BK-08/2026/01"
                                                        className="w-full p-2 bg-slate-900 border border-slate-700 rounded-lg text-white font-mono text-xs focus:ring-1 focus:ring-indigo-400"
                                                    />
                                                </div>
                                                <div>
                                                    <label className="text-[10px] text-slate-400 block mb-1">Nomor SPBy</label>
                                                    <input 
                                                        type="text"
                                                        value={spjProfile.spbyNo || ''}
                                                        onChange={e => setSpjProfile({...spjProfile, spbyNo: e.target.value})}
                                                        placeholder="Contoh: 104/UN27/SPBY/2026"
                                                        className="w-full p-2 bg-slate-900 border border-slate-700 rounded-lg text-white font-mono text-xs focus:ring-1 focus:ring-indigo-400"
                                                    />
                                                </div>
                                                <div>
                                                    <label className="text-[10px] text-slate-400 block mb-1">Tanggal SPBy</label>
                                                    <input 
                                                        type="text"
                                                        value={spjProfile.spbyDate || ''}
                                                        onChange={e => setSpjProfile({...spjProfile, spbyDate: e.target.value})}
                                                        placeholder="Contoh: 31 Agustus 2026"
                                                        className="w-full p-2 bg-slate-900 border border-slate-700 rounded-lg text-white text-xs focus:ring-1 focus:ring-indigo-400"
                                                    />
                                                </div>
                                                <div>
                                                    <label className="text-[10px] text-slate-400 block mb-1">Mata Anggaran (MAK)</label>
                                                    <input 
                                                        type="text"
                                                        value={spjProfile.mak || ''}
                                                        onChange={e => setSpjProfile({...spjProfile, mak: e.target.value})}
                                                        placeholder="Contoh: 023.17.WA.525111"
                                                        className="w-full p-2 bg-slate-900 border border-slate-700 rounded-lg text-white font-mono text-xs focus:ring-1 focus:ring-indigo-400"
                                                    />
                                                </div>
                                            </div>
                                        </div>

                                        <div className="flex justify-end pt-1">
                                            <button 
                                                onClick={() => handleUpdateSpjProfile(spjProfile)}
                                                className="bg-brand-600 hover:bg-brand-500 text-white font-bold text-xs px-5 py-2.5 rounded-xl transition shadow-lg flex items-center gap-2"
                                            >
                                                <i className="fa-solid fa-floppy-disk"></i>
                                                <span>Simpan Profil Pejabat & Administrasi</span>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'cloud_config' && (
                            <div className="glass-card p-6 rounded-3xl border border-slate-700/70 shadow-xl space-y-6 max-w-4xl mx-auto">
                                <div className="border-b border-slate-800 pb-3">
                                    <h3 className="font-extrabold text-base text-white flex items-center gap-2">
                                        <i className="fa-solid fa-cloud text-sky-400"></i>
                                        <span>Konfigurasi Firebase & Google Drive Webhook</span>
                                    </h3>
                                    <p className="text-xs text-slate-400 mt-0.5">Sinkronisasi data multi-device dan pencadangan foto struk otomatis ke Google Drive.</p>
                                </div>

                                <div className="space-y-4 text-xs">
                                    <div className="space-y-1.5">
                                        <label className="block text-slate-300 font-bold">Firebase Project ID (Realtime DB):</label>
                                        <input 
                                            type="text" 
                                            value={tempFbPid} 
                                            onChange={e => setTempFbPid(e.target.value)}
                                            placeholder="Contoh: etoll-3366c"
                                            className="w-full p-3 bg-slate-950 border border-slate-700 rounded-xl text-white font-mono text-sm"
                                        />
                                    </div>

                                    <div className="space-y-1.5">
                                        <label className="block text-slate-300 font-bold">Gemini API Key (Google AI Studio OCR):</label>
                                        <input 
                                            type="password" 
                                            value={geminiApiKey} 
                                            onChange={e => setGeminiApiKey(e.target.value)}
                                            placeholder="AIzaSy..."
                                            className="w-full p-3 bg-slate-950 border border-slate-700 rounded-xl text-white font-mono text-sm"
                                        />
                                    </div>

                                    <div className="space-y-1.5">
                                        <label className="block text-slate-300 font-bold">Google Apps Script Webhook URL (Google Drive):</label>
                                        <input 
                                            type="text" 
                                            value={gdriveWebhookUrl} 
                                            onChange={e => setGdriveWebhookUrl(e.target.value)}
                                            placeholder="https://script.google.com/macros/s/.../exec"
                                            className="w-full p-3 bg-slate-950 border border-slate-700 rounded-xl text-white font-mono text-sm"
                                        />
                                    </div>

                                    <div className="pt-2 flex justify-end">
                                        <button 
                                            onClick={handleSaveCloudSettings}
                                            className="px-5 py-2.5 bg-gradient-to-r from-sky-600 to-blue-600 hover:from-sky-500 hover:to-blue-500 text-white font-bold rounded-xl text-xs shadow-lg transition"
                                        >
                                            Simpan & Uji Koneksi Cloud
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'master_data' && (
                            <MasterDataTab 
                                cards={cards} 
                                setCards={setCards} 
                                transactions={transactions} 
                                setTransactions={setTransactions} 
                                setMonthlyDeposits={setMonthlyDeposits} 
                                firebaseProjectId={firebaseProjectId} 
                                fetchCloudData={fetchCloudData} 
                                showToastNotification={showToastNotification} 
                                handleAddCard={handleAddCard} 
                                deletedCardNumbers={deletedCardNumbers} 
                                setDeletedCardNumbers={setDeletedCardNumbers} 
                                pushToCloud={pushToCloud}
                            />
                        )}
                    </main>

                    {inspectingTx && (
                        <InspectTransactionModal 
                            transaction={inspectingTx}
                            onClose={() => setInspectingTx(null)}
                        />
                    )}

                    {showSpjPrintModal && (
                        <SpjPrintModal 
                            spjProfile={spjProfile}
                            selectedMonth={selectedMonth}
                            transactions={transactions}
                            depositAmount={monthlyDeposits[selectedMonth] || 0}
                            cards={cards}
                            spjSortBy={spjSortBy}
                            setSpjSortBy={setSpjSortBy}
                            onClose={() => setShowSpjPrintModal(false)}
                        />
                    )}

                    {showScanModal && (
                        <ScanAndAddModal 
                            userApiKey={geminiApiKey}
                            setGeminiApiKey={setGeminiApiKey}
                            checkDuplicateInvoice={checkDuplicateInvoice}
                            cards={cards}
                            onSave={handleSaveTransaction}
                            onClose={() => setShowScanModal(false)}
                            showToastNotification={showToastNotification}
                            dailyUsage={dailyUsage}
                            freeDailyLimit={FREE_DAILY_LIMIT}
                            updateDailyUsage={updateDailyUsage}
                            gdriveWebhookUrl={gdriveWebhookUrl}
                        />
                    )}

                    {showNfcModal && (
                        <NfcModal 
                            cards={cards}
                            transactions={transactions}
                            currentMonth={selectedMonth}
                            onClose={() => setShowNfcModal(false)}
                        />
                    )}

                    {editingTx && (
                        <EditTransactionModal 
                            transaction={editingTx}
                            onSave={handleSaveTransaction}
                            onClose={() => setEditingTx(null)}
                        />
                    )}

                    {showDepositModal && (
                        <div className="fixed inset-0 z-50 bg-black/85 flex items-center justify-center p-4 backdrop-blur-md modal-backdrop">
                            <div className="glass-panel p-6 rounded-3xl max-w-md w-full space-y-4 shadow-2xl border border-purple-500/50">
                                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                                    <h3 className="font-extrabold text-base flex items-center gap-2 text-purple-300">
                                        <i className="fa-solid fa-vault"></i> Edit Deposit Kasbon Uang Muka
                                    </h3>
                                    <button onClick={() => setShowDepositModal(false)} className="text-slate-400 hover:text-white text-lg">
                                        <i className="fa-solid fa-xmark"></i>
                                    </button>
                                </div>

                                <div className="space-y-4 text-xs">
                                    <div>
                                        <label className="block text-[11px] font-bold text-slate-300 mb-1">Periode Bulan:</label>
                                        <select
                                            value={depositModalMonth}
                                            onChange={(e) => {
                                                const m = e.target.value;
                                                setDepositModalMonth(m);
                                                setDepositModalValue(String(monthlyDeposits[m] ?? 20000000));
                                            }}
                                            className="w-full p-2.5 bg-slate-950 border border-slate-700 rounded-xl text-amber-300 font-bold"
                                        >
                                            {availableMonths.map(m => (
                                                <option key={m} value={m}>📅 Periode {m}</option>
                                            ))}
                                        </select>
                                    </div>

                                    <div>
                                        <label className="block text-[11px] font-bold text-slate-300 mb-1">Nominal Deposit Kasbon (Rp):</label>
                                        <input 
                                            type="number"
                                            value={depositModalValue}
                                            onChange={(e) => setDepositModalValue(e.target.value)}
                                            placeholder="Contoh: 20000000"
                                            className="w-full p-3 bg-slate-950 border border-slate-700 rounded-xl text-white font-mono text-base font-bold focus:ring-2 focus:ring-purple-500"
                                            autoFocus
                                        />
                                        <p className="text-[11px] text-emerald-400 font-bold mt-1.5 flex items-center gap-1.5">
                                            <i className="fa-solid fa-money-bill-wave"></i>
                                            <span>Terbaca: {formatRupiah(Number(depositModalValue) || 0)}</span>
                                        </p>
                                    </div>

                                    <div>
                                        <p className="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">Pilihan Cepat Nominal:</p>
                                        <div className="grid grid-cols-3 gap-2">
                                            {[10000000, 15000000, 20000000, 25000000, 30000000, 35000000].map(val => (
                                                <button
                                                    key={val}
                                                    type="button"
                                                    onClick={() => setDepositModalValue(String(val))}
                                                    className={`py-1.5 px-2 rounded-xl text-[11px] font-bold border transition ${
                                                        Number(depositModalValue) === val 
                                                            ? 'bg-purple-600 border-purple-400 text-white' 
                                                            : 'bg-slate-900 border-slate-700 text-slate-300 hover:border-slate-500'
                                                    }`}
                                                >
                                                    {val / 1000000} Juta
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                </div>

                                <div className="flex gap-2 pt-2 border-t border-slate-800">
                                    <button 
                                        type="button" 
                                        onClick={() => setShowDepositModal(false)} 
                                        className="flex-1 py-2.5 border border-slate-700 rounded-xl text-xs font-bold text-slate-300 hover:bg-slate-800"
                                    >
                                        Batal
                                    </button>
                                    <button 
                                        type="button" 
                                        onClick={() => {
                                            handleUpdateDeposit(depositModalMonth, depositModalValue);
                                            setShowDepositModal(false);
                                        }} 
                                        className="flex-1 py-2.5 bg-purple-600 hover:bg-purple-500 text-white rounded-xl text-xs font-bold shadow-lg transition"
                                    >
                                        Simpan Kasbon
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {deletingTx && (
                        <div className="fixed inset-0 z-50 bg-black/85 flex items-center justify-center p-4 backdrop-blur-md">
                            <div className="glass-panel p-6 rounded-3xl max-w-sm w-full space-y-4 shadow-2xl border border-rose-800/80 text-xs">
                                <h4 className="font-extrabold text-sm text-white flex items-center gap-2 text-rose-400">
                                    <i className="fa-solid fa-trash-can text-rose-500"></i>
                                    <span>Konfirmasi Hapus Transaksi</span>
                                </h4>
                                <div className="p-3 bg-slate-950/80 rounded-2xl border border-slate-800 space-y-1">
                                    <p className="text-slate-300">
                                        Anda akan menghapus transaksi bukti <strong>{deletingTx.invoiceNumber || deletingTx.merchant}</strong>:
                                    </p>
                                    <p className="font-bold text-white text-sm font-mono text-brand-300">
                                        {formatRupiah(deletingTx.amount)} • {deletingTx.merchant}
                                    </p>
                                </div>

                                <div className="space-y-1.5">
                                    <label className="block text-[11px] font-bold text-slate-300">
                                        <i className="fa-solid fa-lock mr-1 text-rose-400"></i> Masukkan Password Admin (anda321):
                                    </label>
                                    <input 
                                        type="password"
                                        value={deleteTxPassword}
                                        onChange={e => { setDeleteTxPassword(e.target.value); setDeleteTxPassError(''); }}
                                        placeholder="Masukkan password konfirmasi..."
                                        className="w-full p-2.5 bg-slate-950 border border-slate-700 rounded-xl text-white font-mono text-sm focus:ring-2 focus:ring-rose-500"
                                        autoFocus
                                    />
                                    {deleteTxPassError && (
                                        <p className="text-rose-400 text-[11px] font-bold flex items-center gap-1">
                                            <i className="fa-solid fa-circle-exclamation"></i> {deleteTxPassError}
                                        </p>
                                    )}
                                </div>

                                <div className="flex gap-2 pt-2">
                                    <button 
                                        onClick={() => {
                                            setDeletingTx(null);
                                        }} 
                                        className="flex-1 py-2.5 border border-slate-700 rounded-xl text-slate-300 hover:bg-slate-800 font-bold"
                                    >
                                        Batal
                                    </button>
                                    <button 
                                        onClick={() => {
                                            handleDeleteTransaction(deletingTx.id);
                                        }} 
                                        className="flex-1 py-2.5 bg-rose-600 hover:bg-rose-500 text-white rounded-xl font-bold shadow-lg transition"
                                    >
                                        Hapus Permanen
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
