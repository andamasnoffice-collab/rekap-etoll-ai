    <script type="text/babel">
        function formatRupiah(number) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(number || 0);
        }

        function formatNumberOnly(number) {
            return new Intl.NumberFormat('id-ID', { maximumFractionDigits: 0 }).format(number || 0);
        }

        function formatDateIndo(dateString) {
            if (!dateString) return '-';
            const date = new Date(dateString);
            if (isNaN(date.getTime())) return dateString;
            return new Intl.DateTimeFormat('id-ID', { day: 'numeric', month: 'short', year: 'numeric' }).format(date);
        }

        function formatCardNumber(val) {
            if (!val) return '';
            const cleaned = val.toString().replace(/\D/g, '').slice(0, 16);
            return cleaned.replace(/(\d{4})(?=\d)/g, '$1 ').trim();
        }

        function terbilangRupiah(num) {
            const angka = ["", "Satu", "Dua", "Tiga", "Empat", "Lima", "Enam", "Tujuh", "Delapan", "Sembilan", "Sepuluh", "Sebelas"];
            num = Math.floor(Math.abs(Number(num) || 0));
            if (num === 0) return "Nol Rupiah";

            function terbilang(n) {
                if (n < 12) return angka[n];
                if (n < 20) return terbilang(n - 10) + " Belas";
                if (n < 100) return terbilang(Math.floor(n / 10)) + " Puluh " + (n % 10 !== 0 ? terbilang(n % 10) : "");
                if (n < 200) return "Seratus " + (n - 100 !== 0 ? terbilang(n - 100) : "");
                if (n < 1000) return terbilang(Math.floor(n / 100)) + " Ratus " + (n % 100 !== 0 ? terbilang(n % 100) : "");
                if (n < 2000) return "Seribu " + (n - 1000 !== 0 ? terbilang(n - 1000) : "");
                if (n < 1000000) return terbilang(Math.floor(n / 1000)) + " Ribu " + (n % 1000 !== 0 ? terbilang(n % 1000) : "");
                if (n < 1000000000) return terbilang(Math.floor(n / 1000000)) + " Juta " + (n % 1000000 !== 0 ? terbilang(n % 1000000) : "");
                if (n < 1000000000000) return terbilang(Math.floor(n / 1000000000)) + " Milyar " + (n % 1000000000 !== 0 ? terbilang(n % 1000000000) : "");
                return terbilang(Math.floor(n / 1000000000000)) + " Triliun " + (n % 1000000000000 !== 0 ? terbilang(n % 1000000000000) : "");
            }
            return terbilang(num).replace(/\s+/g, ' ').trim() + " Rupiah";
        }

        function detectBankFromCardNumber(cardNum, merchant = '') {
            const clean = (cardNum || '').replace(/\D/g, '');
            const m = (merchant || '').toLowerCase();
            
            if (clean.startsWith('6032') || clean.startsWith('6087') || clean.startsWith('6031') || clean.startsWith('5899') || clean.startsWith('6035') || m.includes('mandiri') || m.includes('e-money') || m.includes('livin')) {
                return { bank: 'Mandiri', color: 'from-blue-600 via-indigo-700 to-blue-900', label: 'Mandiri e-Money' };
            }
            if (clean.startsWith('6013') || clean.startsWith('6019') || clean.startsWith('6014') || clean.startsWith('6015') || m.includes('bca') || m.includes('flazz')) {
                return { bank: 'BCA', color: 'from-sky-600 via-blue-700 to-indigo-950', label: 'BCA Flazz' };
            }
            if (clean.startsWith('6018') || clean.startsWith('5379') || clean.startsWith('5221') || m.includes('bri') || m.includes('brizzi')) {
                return { bank: 'BRI', color: 'from-cyan-600 via-blue-800 to-blue-950', label: 'BRI Brizzi' };
            }
            if (clean.startsWith('1515') || clean.startsWith('7546') || clean.startsWith('5401') || m.includes('bni') || m.includes('tapcash')) {
                return { bank: 'BNI', color: 'from-amber-600 via-orange-700 to-slate-900', label: 'BNI TapCash' };
            }
            if (clean.startsWith('6030') || m.includes('jakcard') || m.includes('dki')) {
                return { bank: 'Bank DKI', color: 'from-emerald-600 via-teal-700 to-slate-900', label: 'DKI JakCard' };
            }

            return { bank: 'BCA', color: 'from-sky-600 via-blue-700 to-indigo-950', label: 'BCA Flazz' };
        }

        function getGoogleDriveDirectImageUrl(url) {
            if (!url) return '';
            const cleanUrl = String(url).trim();
            if (cleanUrl.startsWith('data:image')) return cleanUrl;

            let fileId = null;
            const match1 = cleanUrl.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
            if (match1 && match1[1]) {
                fileId = match1[1];
            } else {
                const match2 = cleanUrl.match(/id=([a-zA-Z0-9_-]+)/);
                if (match2 && match2[1]) {
                    fileId = match2[1];
                } else if (/^[a-zA-Z0-9_-]{25,}$/.test(cleanUrl)) {
                    fileId = cleanUrl;
                }
            }

            if (fileId) {
                // Gunakan parameter resolusi tinggi (sz=w2500) agar gambar dicetak dalam kualitas tajam/HD
                return `https://drive.google.com/thumbnail?id=${fileId}&sz=w2500`;
            }
            return cleanUrl;
        }

        async function callGeminiOCR(base64DataUrl, userApiKey) {
            let mimeType = "image/jpeg";
            let base64Data = base64DataUrl;
            const match = base64DataUrl.match(/^data:(image\/[a-zA-Z]+);base64,(.+)$/);
            if (match) {
                mimeType = match[1];
                base64Data = match[2];
            }

            const apiKey = (userApiKey || "").trim();
            if (!apiKey) {
                throw new Error("API Key Gemini belum diatur. Silakan masukkan API Key Gemini Anda.");
            }

            const systemPrompt = "Anda adalah sistem OCR multimodal khusus mengekstrak data dari invoice/struk e-Toll Indonesia (e-Money, BCA Flazz, Brizzi, Tapcash, Livin, Tokopedia, Indomaret, dll). Ekstrak data secara tepat.";
            const userPrompt = "Analisis foto struk ini. Ekstrak:\n1. etollNumber: 16-digit nomor kartu e-Toll\n2. merchant: Tempat/Aplikasi pembelian\n3. amount: Total nominal (angka murni tanpa titik/koma)\n4. invoiceNumber: Nomor resi / invoice / referensi\n5. date: Tanggal transaksi (YYYY-MM-DD)";

            const modelNames = ["gemini-2.5-flash", "gemini-3-flash-preview"];
            let lastError = null;

            for (const model of modelNames) {
                try {
                    const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
                    const payload = {
                        contents: [{ role: "user", parts: [{ text: userPrompt }, { inlineData: { mimeType, data: base64Data } }] }],
                        systemInstruction: { parts: [{ text: systemPrompt }] },
                        generationConfig: {
                            responseMimeType: "application/json",
                            responseSchema: {
                                type: "OBJECT",
                                properties: {
                                    etollNumber: { type: "STRING" },
                                    merchant: { type: "STRING" },
                                    amount: { type: "NUMBER" },
                                    invoiceNumber: { type: "STRING" },
                                    date: { type: "STRING" }
                                },
                                required: ["etollNumber", "merchant", "amount", "invoiceNumber", "date"]
                            }
                        }
                    };

                    const response = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                    if (!response.ok) {
                        const errJson = await response.json().catch(() => ({}));
                        throw new Error(errJson.error?.message || `HTTP ${response.status} pada model ${model}`);
                    }

                    const result = await response.json();
                    const text = result?.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (!text) {
                        throw new Error("Respons AI kosong atau diblokir oleh filter keamanan.");
                    }

                    const cleanJsonStr = text.replace(/```json/g, '').replace(/```/g, '').trim();
                    const parsed = JSON.parse(cleanJsonStr);

                    if (parsed.amount) {
                        parsed.amount = parseFloat(String(parsed.amount).replace(/[^0-9.]/g, '')) || 0;
                    }
                    return parsed;
                } catch (err) {
                    console.warn(`Attempt with ${model} failed:`, err.message);
                    lastError = err;
                }
            }

            throw lastError || new Error("Gagal memproses OCR via Gemini API.");
        }

                    const matchedPreset = INITIAL_CARDS.find(ic => (ic.number || '').replace(/\D/g, '') === cleanNum);

        function NfcModal({ cards, transactions, currentMonth, onClose }) {
            const [scannedCardNum, setScannedCardNum] = React.useState('');
            const [matchedCard, setMatchedCard] = React.useState(null);
            const [isScanning, setIsScanning] = React.useState(false);
            const [unregisteredMode, setUnregisteredMode] = React.useState(false);

            const [nfcSupported] = React.useState('NDEFReader' in window);
            const [nfcStatus, setNfcStatus] = React.useState(
                'NDEFReader' in window 
                    ? 'Klik "Aktifkan Sensor NFC HP" lalu tempelkan kartu e-Toll ke bagian belakang HP Anda.' 
                    : 'Gunakan Google Chrome Android dengan NFC aktif atau gunakan tombol simulasi.'
            );

            const handleNfcReadSuccess = (uidRaw, cardNumFromNdef = '') => {
                const cleanUid = (uidRaw || '').replace(/:/g, '').toUpperCase();

                let foundCard = cards.find(c => {
                    const cCleanNum = (c.number || '').replace(/\D/g, '');
                    const cNfcUid = (c.nfcUid || '').replace(/:/g, '').toUpperCase();
                    return (cleanUid && cNfcUid === cleanUid) || (cleanUid && cCleanNum.includes(cleanUid));
                });

                if (!foundCard && cardNumFromNdef) {
                    const formattedNdef = formatCardNumber(cardNumFromNdef);
                    foundCard = cards.find(c => c.number === formattedNdef);
                }

                if (foundCard) {
                    setScannedCardNum(foundCard.number);
                    setMatchedCard(foundCard);
                    setUnregisteredMode(false);
                    setNfcStatus(`Kartu Terdaftar: ${foundCard.label}`);
                } else {
                    setScannedCardNum('');
                    setMatchedCard(null);
                    setUnregisteredMode(true);
                    setNfcStatus(`Kartu NFC Baru Terdeteksi (UID: ${uidRaw || 'N/A'}).`);
                }
            };

            const startNfcScan = async () => {
                if (!('NDEFReader' in window)) return;
                try {
                    const ndef = new window.NDEFReader();
                    await ndef.scan();
                    setIsScanning(true);
                    setNfcStatus('Sensor NFC Aktif! Tempelkan kartu...');

                    ndef.onreading = (event) => {
                        const uid = event.serialNumber || '';
                        handleNfcReadSuccess(uid);
                    };
                } catch (error) {
                    setIsScanning(false);
                    setNfcStatus('Gagal mengaktifkan NFC: ' + error.message);
                }
            };

            const handleSimulateNfc = () => {
                if (cards.length > 0) {
                    const randomCard = cards[Math.floor(Math.random() * cards.length)];
                    handleNfcReadSuccess(randomCard.nfcUid || '04:A2:B3:C4:D5:E6', randomCard.number);
                }
            };

            const cardSpentThisMonth = React.useMemo(() => {
                if (!scannedCardNum) return 0;
                const cleanTarget = scannedCardNum.replace(/\D/g, '');
                return transactions
                    .filter(t => (t.etollNumber || '').replace(/\D/g, '') === cleanTarget && t.date && t.date.startsWith(currentMonth))
                    .reduce((s, t) => s + Number(t.amount || 0), 0);
            }, [scannedCardNum, transactions, currentMonth]);

            return (
                <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4 backdrop-blur-md modal-backdrop overflow-y-auto">
                    <div className="glass-panel p-6 rounded-3xl max-w-md w-full space-y-4 my-6 shadow-2xl border border-slate-700">
                        <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                            <h3 className="font-extrabold text-base flex items-center gap-2 text-purple-400">
                                <i className="fa-solid fa-nfc-symbol"></i> Web NFC Hardware Reader
                            </h3>
                            <button onClick={onClose} className="text-slate-400 hover:text-white text-lg">
                                <i className="fa-solid fa-xmark"></i>
                            </button>
                        </div>

                        <div className="py-2 space-y-3 text-center">
                            <div className="p-3 bg-slate-950/80 rounded-2xl border border-slate-800 text-xs">
                                <p className="font-bold text-slate-200">{nfcStatus}</p>
                            </div>

                            <div className="flex flex-col gap-2">
                                {nfcSupported && (
                                    <button 
                                        onClick={startNfcScan} 
                                        disabled={isScanning}
                                        className="w-full py-3 bg-purple-600 hover:bg-purple-500 text-white rounded-xl font-extrabold text-xs transition"
                                    >
                                        {isScanning ? 'Sensor NFC Siap Membaca...' : 'Aktifkan Sensor NFC HP'}
                                    </button>
                                )}
                                <button 
                                    onClick={handleSimulateNfc} 
                                    className="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3.5 py-2 rounded-xl font-bold border border-slate-700 transition"
                                >
                                    <i className="fa-solid fa-vial text-purple-400 mr-1"></i> Simulasi Tap Kartu
                                </button>
                            </div>
                        </div>

                        {scannedCardNum && !unregisteredMode && (
                            <div className="p-4 bg-slate-950 rounded-2xl border border-purple-900/60 text-left space-y-2">
                                <div className="flex justify-between items-center">
                                    <p className="text-[10px] font-bold text-purple-400 uppercase">Kartu NFC Terbaca:</p>
                                </div>
                                <p className="text-base font-mono font-bold text-white">{scannedCardNum}</p>
                                {matchedCard && (
                                    <p className="text-xs font-bold text-emerald-400">{matchedCard.label}</p>
                                )}
                                <div className="pt-2 border-t border-slate-800 flex justify-between items-center">
                                    <span className="text-xs text-slate-400">Total Pengeluaran Bulan Ini:</span>
                                    <span className="text-lg font-black text-purple-300">{formatRupiah(cardSpentThisMonth)}</span>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }
    </script>

    <script type="text/babel">
        function App() {
            const [cards, setCards] = React.useState(() => {
                const saved = JSON.parse(localStorage.getItem('etoll_cards'));
                if (!saved || saved.length < 15 || saved.some(c => (c.label || '').includes('('))) {
                    return INITIAL_CARDS;
                }
                return saved;
            });
            const [deletedCardNumbers, setDeletedCardNumbers] = React.useState(() => JSON.parse(localStorage.getItem('etoll_deleted_cards')) || []);
            const [transactions, setTransactions] = React.useState(() => {
                const saved = JSON.parse(localStorage.getItem('etoll_transactions'));
                if (!saved || saved.length < 15) {
                    return INITIAL_DUMMY_TXS;
                }
                return saved;

                                    {/* Kolom Khusus Pengaturan Nama Driver & Nopol untuk Cetak SPJ */}
                                    <div className="p-5 bg-slate-900/80 rounded-2xl border border-slate-800 space-y-3">
                                        <div className="flex flex-col sm:flex-row justify-between sm:items-center gap-2 pb-2 border-b border-slate-800">
                                            <div>
                                                <h4 className="text-xs font-black text-amber-300 uppercase tracking-wider flex items-center gap-2">
                                                    <i className="fa-solid fa-id-card-clip"></i>
                                                    <span>Pengaturan Nama Driver & No. Polisi Yang Dicetak Pada SPJ ({selectedMonth})</span>
                                                </h4>
                                                <p className="text-[11px] text-slate-400 mt-0.5">Edit nama pengemudi dan plat nopol kendaraan langsung di sini untuk menyesuaikan lembar cetak SPJ.</p>
                                            </div>
                                            <span className="text-[10px] font-bold px-2.5 py-1 rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/30 shrink-0">
                                                {cardBreakdown.length} Driver Terlibat Bulan Ini
                                            </span>
                                        </div>

                                        <div className="overflow-x-auto custom-scrollbar rounded-xl border border-slate-800">
                                            <table className="w-full text-left text-xs border-collapse">
                                                <thead>
                                                    <tr className="bg-slate-950 text-slate-400 uppercase font-bold text-[10px] tracking-wider border-b border-slate-800">
                                                        <th className="py-2.5 px-3 w-10 text-center">No</th>
                                                        <th className="py-2.5 px-3">Nomor e-Toll</th>
                                                        <th className="py-2.5 px-3">Nama Driver (Tampil di SPJ)</th>
                                                        <th className="py-2.5 px-3">No. Polisi (Tampil di SPJ)</th>
                                                        <th className="py-2.5 px-3 text-right">Total Bulan Ini</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-slate-800/80 bg-slate-900/50">
                                                    {cardBreakdown.map((item, idx) => {
                                                        const clean = item.number.replace(/\D/g, '');
                                                        return (
                                                            <tr key={item.number} className="hover:bg-slate-800/40 transition">
                                                                <td className="py-2.5 px-3 text-center font-bold text-slate-400">{idx + 1}</td>
                                                                <td className="py-2.5 px-3 font-mono text-slate-300 font-bold whitespace-nowrap">{item.number}</td>
                                                                <td className="py-2.5 px-3">
                                                                    <input 
                                                                        type="text"
                                                                        value={item.label}
                                                                        onChange={(e) => {
                                                                            const val = e.target.value;
                                                                            setCards(prev => {
                                                                                const existingIdx = prev.findIndex(c => (c.number || '').replace(/\D/g, '') === clean);
                                                                                let updated;
                                                                                if (existingIdx >= 0) {
                                                                                    updated = [...prev];
                                                                                    updated[existingIdx] = { ...updated[existingIdx], label: val };
                                                                                } else {
                                                                                    const detected = detectBankFromCardNumber(item.number);
                                                                                    updated = [...prev, {
                                                                                        id: 'card-' + Date.now(),
                                                                                        label: val,
                                                                                        nopol: item.nopol || 'AD 1060 XA',
                                                                                        number: item.number,
                                                                                        bank: detected.bank,
                                                                                        color: detected.color
                                                                                    }];
                                                                                }
                                                                                pushToCloud('cards', updated);
                                                                                return updated;
                                                                            });
                                                                        }}
                                                                        className="w-full p-2 bg-slate-950 border border-slate-700 rounded-lg text-white font-medium text-xs focus:ring-1 focus:ring-amber-400"
                                                                        placeholder="Masukkan nama driver..."
                                                                    />
                                                                </td>
                                                                <td className="py-2.5 px-3">
                                                                    <input 
                                                                        type="text"
                                                                        value={item.nopol}
                                                                        onChange={(e) => {
                                                                            const val = e.target.value.toUpperCase();
                                                                            setCards(prev => {
                                                                                const existingIdx = prev.findIndex(c => (c.number || '').replace(/\D/g, '') === clean);
                                                                                let updated;
                                                                                if (existingIdx >= 0) {
                                                                                    updated = [...prev];
                                                                                    updated[existingIdx] = { ...updated[existingIdx], nopol: val };
                                                                                } else {
                                                                                    const detected = detectBankFromCardNumber(item.number);
                                                                                    updated = [...prev, {
                                                                                        id: 'card-' + Date.now(),
                                                                                        label: item.label,
                                                                                        nopol: val,
                                                                                        number: item.number,
                                                                                        bank: detected.bank,
                                                                                        color: detected.color
                                                                                    }];
                                                                                }
                                                                                pushToCloud('cards', updated);
                                                                                return updated;
                                                                            });
                                                                        }}
                                                                        className="w-full p-2 bg-slate-950 border border-slate-700 rounded-lg text-amber-300 font-mono font-bold uppercase text-xs focus:ring-1 focus:ring-amber-400"
                                                                        placeholder="Contoh: AD 1060 XA"
                                                                    />
                                                                </td>
                                                                <td className="py-2.5 px-3 text-right font-black text-brand-300 whitespace-nowrap">
                                                                    {formatRupiah(item.total)}
                                                                </td>
                                                            </tr>
                                                        );
                                                    })}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>

                                    {/* Pejabat Configuration Form */}
                                    <div className="p-5 bg-slate-900/80 rounded-2xl border border-slate-800 space-y-4">
                                        <h4 className="text-xs font-bold text-brand-300 uppercase tracking-wider flex items-center gap-2">
                                            <i className="fa-solid fa-signature"></i>
                                            <span>Konfigurasi Pejabat Penandatangan SPJ UNS</span>
                                        </h4>
                                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 text-xs">
                                            <div className="space-y-2 p-3 bg-slate-950/70 rounded-xl border border-slate-800">
                                                <p className="font-bold text-amber-300">1. Penanggungjawab Pengemudi</p>
                                                <div>
                                                    <label className="text-[10px] text-slate-400 block mb-0.5">Nama Lengkap</label>
                                                    <input 
                                                        type="text" 
                                                        value={spjProfile.applicantName} 
                                                        onChange={e => setSpjProfile({...spjProfile, applicantName: e.target.value})}
                                                        className="w-full p-2 bg-slate-900 border border-slate-700 rounded-lg text-white font-medium"
                                                    />
                                                </div>
                                                <div>
                                                    <label className="text-[10px] text-slate-400 block mb-0.5">NIP</label>
                                                    <input 
                                                        type="text" 
                                                        value={spjProfile.applicantNip} 
                                                        onChange={e => setSpjProfile({...spjProfile, applicantNip: e.target.value})}
                                                        className="w-full p-2 bg-slate-900 border border-slate-700 rounded-lg text-white font-mono"
                                                    />
                                                </div>
                                            </div>

                                            <div className="space-y-2 p-3 bg-slate-950/70 rounded-xl border border-slate-800">
                                                <p className="font-bold text-amber-300">2. Kasubdit Umum dan Logistik</p>
                                                <div>
                                                    <label className="text-[10px] text-slate-400 block mb-0.5">Nama Lengkap</label>
                                                    <input 
                                                        type="text" 
                                                        value={spjProfile.kasubditName} 
                                                        onChange={e => setSpjProfile({...spjProfile, kasubditName: e.target.value})}
                                                        className="w-full p-2 bg-slate-900 border border-slate-700 rounded-lg text-white font-medium"
                                                    />
                                                </div>
                                                <div>
                                                    <label className="text-[10px] text-slate-400 block mb-0.5">NIP</label>
                                                    <input 
                                                        type="text" 
                                                        value={spjProfile.kasubditNip} 
                                                        onChange={e => setSpjProfile({...spjProfile, kasubditNip: e.target.value})}
                                                        className="w-full p-2 bg-slate-900 border border-slate-700 rounded-lg text-white font-mono"
                                                    />
                                                </div>
                                            </div>

                                            <div className="space-y-2 p-3 bg-slate-950/70 rounded-xl border border-slate-800">
                                                <p className="font-bold text-amber-300">3. Pejabat Pembuat Komitmen (PPK)</p>
                                                <div>
                                                    <label className="text-[10px] text-slate-400 block mb-0.5">Nama Lengkap</label>
                                                    <input 
                                                        type="text" 
                                                        value={spjProfile.ppkName} 
                                                        onChange={e => setSpjProfile({...spjProfile, ppkName: e.target.value})}
                                                        className="w-full p-2 bg-slate-900 border border-slate-700 rounded-lg text-white font-medium"
                                                    />
                                                </div>
                                                <div>
                                                    <label className="text-[10px] text-slate-400 block mb-0.5">NIP</label>
                                                    <input 
                                                        type="text" 
                                                        value={spjProfile.ppkNip} 
                                                        onChange={e => setSpjProfile({...spjProfile, ppkNip: e.target.value})}
                                                        className="w-full p-2 bg-slate-900 border border-slate-700 rounded-lg text-white font-mono"
                                                    />
                                                </div>
                                            </div>
                                        </div>
                                        <div className="flex justify-end">
                                            <button 
                                                onClick={() => handleUpdateSpjProfile(spjProfile)}
                                                className="bg-brand-600 hover:bg-brand-500 text-white font-bold text-xs px-4 py-2 rounded-xl transition shadow"
                                            >
                                                Simpan Profil Pejabat
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'cloud_config' && (
                            <div className="glass-card p-6 rounded-3xl border border-slate-700/70 shadow-xl space-y-6 max-w-4xl mx-auto">
                                <div className="border-b border-slate-800 pb-3">
                                    <h3 className="font-extrabold text-base text-white flex items-center gap-2">
                                        <i className="fa-solid fa-cloud text-sky-400"></i>
                                        <span>Konfigurasi Firebase & Google Drive Webhook</span>
                                    </h3>
                                    <p className="text-xs text-slate-400 mt-0.5">Sinkronisasi data multi-device dan pencadangan foto struk otomatis ke Google Drive.</p>
                                </div>

                                <div className="space-y-4 text-xs">
                                    <div className="space-y-1.5">
                                        <label className="block text-slate-300 font-bold">Firebase Project ID (Realtime DB):</label>
                                        <input 
                                            type="text" 
                                            value={tempFbPid} 
                                            onChange={e => setTempFbPid(e.target.value)}
                                            placeholder="Contoh: etoll-3366c"
                                            className="w-full p-3 bg-slate-950 border border-slate-700 rounded-xl text-white font-mono text-sm"
                                        />
                                    </div>

                                    <div className="space-y-1.5">
                                        <label className="block text-slate-300 font-bold">Gemini API Key (Google AI Studio OCR):</label>
                                        <input 
                                            type="password" 
                                            value={geminiApiKey} 
                                            onChange={e => setGeminiApiKey(e.target.value)}
                                            placeholder="AIzaSy..."
                                            className="w-full p-3 bg-slate-950 border border-slate-700 rounded-xl text-white font-mono text-sm"
                                        />
                                    </div>

                                    <div className="space-y-1.5">
                                        <label className="block text-slate-300 font-bold">Google Apps Script Webhook URL (Google Drive):</label>
                                        <input 
                                            type="text" 
                                            value={gdriveWebhookUrl} 
                                            onChange={e => setGdriveWebhookUrl(e.target.value)}
                                            placeholder="https://script.google.com/macros/s/.../exec"
                                            className="w-full p-3 bg-slate-950 border border-slate-700 rounded-xl text-white font-mono text-sm"
                                        />
                                    </div>

                                    <div className="pt-2 flex justify-end">
                                        <button 
                                            onClick={handleSaveCloudSettings}
                                            className="px-5 py-2.5 bg-gradient-to-r from-sky-600 to-blue-600 hover:from-sky-500 hover:to-blue-500 text-white font-bold rounded-xl text-xs shadow-lg transition"
                                        >
                                            Simpan & Uji Koneksi Cloud
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'master_data' && (
                            <MasterDataTab 
                                cards={cards} 
                                setCards={setCards} 
                                transactions={transactions} 
                                setTransactions={setTransactions} 
                                setMonthlyDeposits={setMonthlyDeposits} 
                                firebaseProjectId={firebaseProjectId} 
                                fetchCloudData={fetchCloudData} 
                                showToastNotification={showToastNotification} 
                                handleAddCard={handleAddCard} 
                                deletedCardNumbers={deletedCardNumbers} 
                                setDeletedCardNumbers={setDeletedCardNumbers} 
                            />
                        )}
                    </main>

                    {inspectingTx && (
                        <InspectTransactionModal 
                            transaction={inspectingTx}
                            onClose={() => setInspectingTx(null)}
                        />
                    )}

                    {showSpjPrintModal && (
                        <SpjPrintModal 
                            spjProfile={spjProfile}
                            selectedMonth={selectedMonth}
                            transactions={transactions}
                            depositAmount={monthlyDeposits[selectedMonth] || 0}
                            cards={cards}
                            setCards={setCards}
                            pushToCloud={pushToCloud}
                            showToastNotification={showToastNotification}
                            onClose={() => setShowSpjPrintModal(false)}
                        />
                    )}

                    {showScanModal && (
                        <ScanAndAddModal 
                            userApiKey={geminiApiKey}
                            setGeminiApiKey={setGeminiApiKey}
                            checkDuplicateInvoice={checkDuplicateInvoice}
                            cards={cards}
                            onSave={handleSaveTransaction}
                            onClose={() => setShowScanModal(false)}
                            showToastNotification={showToastNotification}
                            dailyUsage={dailyUsage}
                            freeDailyLimit={FREE_DAILY_LIMIT}
                            updateDailyUsage={updateDailyUsage}
                        />
                    )}

                    {showNfcModal && (
                        <NfcModal 
                            cards={cards}
                            transactions={transactions}
                            currentMonth={selectedMonth}
                            onClose={() => setShowNfcModal(false)}
                        />
                    )}

                    {editingTx && (
                        <EditTransactionModal 
                            transaction={editingTx}
                            onSave={handleSaveTransaction}
                            onClose={() => setEditingTx(null)}
                        />
                    )}

                    {deletingTx && (
                        <div className="fixed inset-0 z-50 bg-black/85 flex items-center justify-center p-4 backdrop-blur-md">
                            <div className="glass-panel p-6 rounded-3xl max-w-sm w-full space-y-4 shadow-2xl border border-rose-800/80 text-xs">
                                <h4 className="font-extrabold text-sm text-white flex items-center gap-2">
                                    <i className="fa-solid fa-trash-can text-rose-400"></i>
                                    <span>Hapus Transaksi?</span>
                                </h4>
                                <p className="text-slate-300">
                                    Apakah Anda yakin ingin menghapus transaksi <strong>{deletingTx.invoiceNumber || deletingTx.merchant}</strong> ({formatRupiah(deletingTx.amount)})?
                                </p>
                                <div className="flex gap-2 pt-2">
                                    <button onClick={() => setDeletingTx(null)} className="flex-1 py-2 border border-slate-700 rounded-xl text-slate-300 hover:bg-slate-800 font-bold">
                                        Batal
                                    </button>
                                    <button onClick={() => handleDeleteTransaction(deletingTx.id)} className="flex-1 py-2 bg-rose-600 hover:bg-rose-500 text-white rounded-xl font-bold shadow">
                                        Hapus
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
