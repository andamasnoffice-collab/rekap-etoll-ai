<body class="min-h-full antialiased selection:bg-brand-500 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        function formatRupiah(number) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(number || 0);
        }

        function formatDateIndo(dateString) {
            if (!dateString) return '-';
            const date = new Date(dateString);
            if (isNaN(date.getTime())) return dateString;
            return new Intl.DateTimeFormat('id-ID', { day: 'numeric', month: 'short', year: 'numeric' }).format(date);
        }

        function formatCardNumber(val) {
            if (!val) return '';
            const cleaned = val.toString().replace(/\D/g, '').slice(0, 16);
            return cleaned.replace(/(.{4})/g, '$1 ').trim();
        }

        function terbilangRupiah(num) {
            const angka = ["", "Satu", "Dua", "Tiga", "Empat", "Lima", "Enam", "Tujuh", "Delapan", "Sembilan", "Sepuluh", "Sebelas"];
            num = Math.floor(Math.abs(num || 0));
            if (num === 0) return "Nol Rupiah";
            function terbilang(n) {
                if (n < 12) return angka[n];
                if (n < 20) return terbilang(n - 10) + " Belas";
                if (n < 100) return terbilang(Math.floor(n / 10)) + " Puluh " + terbilang(n % 10);
                if (n < 1000) return terbilang(Math.floor(n / 100)) + " Ratus " + terbilang(n % 100);
                if (n < 2000) return "Seribu " + terbilang(n - 1000);
                if (n < 1000000) return terbilang(Math.floor(n / 1000)) + " Ribu " + terbilang(n % 1000);
                if (n < 1000000000) return terbilang(Math.floor(n / 1000000)) + " Juta " + terbilang(n % 1000000);
                return terbilang(Math.floor(n / 1000000000)) + " Milyar " + terbilang(n % 1000000000);
            }
            return terbilang(num).replace(/\s+/g, ' ').trim() + " Rupiah";
        }

        async function callGeminiOCR(base64DataUrl, userApiKey) {
            let mimeType = "image/jpeg";
            let base64Data = base64DataUrl;
            const match = base64DataUrl.match(/^data:(image\/[a-zA-Z]+);base64,(.+)$/);
            if (match) {
                mimeType = match[1];
                base64Data = match[2];
            }

            const systemPrompt = "Anda adalah sistem OCR multimodal khusus mengekstrak data dari invoice/struk e-Toll Indonesia (e-Money, BCA Flazz, Brizzi, Tapcash, Livin, Tokopedia, Indomaret, dll). Ekstrak data secara tepat.";
            const userPrompt = "Analisis foto struk ini. Ekstrak:\n1. etollNumber: 16-digit nomor kartu e-Toll\n2. merchant: Tempat/Aplikasi pembelian\n3. amount: Total nominal (angka)\n4. invoiceNumber: Nomor resi / invoice / referensi\n5. date: Tanggal transaksi (YYYY-MM-DD)";
            
            const apiKey = userApiKey || "";
            if (!apiKey) {
                throw new Error("API Key Gemini belum diatur. Silakan masukkan API Key Gemini Anda.");
            }

            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

            const payload = {
                contents: [{ role: "user", parts: [{ text: userPrompt }, { inlineData: { mimeType, data: base64Data } }] }],
                systemInstruction: { parts: [{ text: systemPrompt }] },
                generationConfig: {
                    responseMimeType: "application/json",
                    responseSchema: {
                        type: "OBJECT",
                        properties: {
                            etollNumber: { type: "STRING" },
                            merchant: { type: "STRING" },
                            amount: { type: "NUMBER" },
                            invoiceNumber: { type: "STRING" },
                            date: { type: "STRING" }
                        },
                        required: ["etollNumber", "merchant", "amount", "invoiceNumber", "date"]
                    }
                }
            };

            const response = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            if (!response.ok) {
                const errJson = await response.json().catch(() => ({}));
                throw new Error(errJson.error?.message || "Gagal memproses OCR via Gemini API.");
            }
            const result = await response.json();
            return JSON.parse(result.candidates[0].content.parts[0].text);
        }

        function SpendingTrendChart({ transactions, selectedMonth }) {
            const chartRef = React.useRef(null);
            const chartInstance = React.useRef(null);

            React.useEffect(() => {
                if (!chartRef.current) return;
                
                const filtered = transactions.filter(t => selectedMonth === 'ALL' || (t.date && t.date.startsWith(selectedMonth)));
                
                const dateMap = {};
                filtered.forEach(t => {
                    const d = t.date || 'Lainnya';
                    dateMap[d] = (dateMap[d] || 0) + Number(t.amount || 0);
                });

                const sortedDates = Object.keys(dateMap).sort();
                const labels = sortedDates.length > 0 ? sortedDates.map(d => formatDateIndo(d)) : ['Belum Ada Data'];
                const values = sortedDates.length > 0 ? sortedDates.map(d => dateMap[d]) : [0];

                if (chartInstance.current) {
                    chartInstance.current.destroy();
                    chartInstance.current = null;
                }

                const ctx = chartRef.current.getContext('2d');
                const gradient = ctx.createLinearGradient(0, 0, 0, 250);
                gradient.addColorStop(0, 'rgba(99, 102, 241, 0.4)');
                gradient.addColorStop(1, 'rgba(99, 102, 241, 0.0)');

                chartInstance.current = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Pengeluaran e-Toll (Rp)',
                            data: values,
                            borderColor: '#6366f1',
                            borderWidth: 3,
                            backgroundColor: gradient,
                            fill: true,
                            tension: 0.35,
                            pointBackgroundColor: '#818cf8',
                            pointBorderColor: '#1e1b4b',
                            pointRadius: 4,
                            pointHoverRadius: 7
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false },
                            tooltip: {
                                backgroundColor: '#0f172a',
                                titleFont: { family: 'Plus Jakarta Sans', size: 12, weight: 'bold' },
                                bodyFont: { family: 'Plus Jakarta Sans', size: 12 },
                                padding: 12,
                                cornerRadius: 10,
                                callbacks: {
                                    label: function(context) {
                                        return ' Nominal: ' + formatRupiah(context.parsed.y);
                                    }
                                }
                            }
                        },
                        scales: {
                            x: {
                                grid: { color: 'rgba(255, 255, 255, 0.05)' },
                                ticks: { color: '#94a3b8', font: { family: 'Plus Jakarta Sans', size: 10 } }
                            },
                            y: {
                                grid: { color: 'rgba(255, 255, 255, 0.05)' },
                                ticks: { 
                                    color: '#94a3b8', 
                                    font: { family: 'Plus Jakarta Sans', size: 10 },
                                    callback: function(value) {
                                        if (value >= 1000000) return (value/1000000).toFixed(1) + 'Jt';
                                        if (value >= 1000) return (value/1000).toFixed(0) + 'Rb';
                                        return value;
                                    }
                                }
                            }
                        }
                    }
                });

                return () => {
                    if (chartInstance.current) {
                        chartInstance.current.destroy();
                        chartInstance.current = null;
                    }
                };
            }, [transactions, selectedMonth]);

            return (
                <div className="h-64 w-full relative">
                    <canvas ref={chartRef}></canvas>
                </div>
            );
        }

        function CardDistributionChart({ cards, transactions, selectedMonth }) {
            const chartRef = React.useRef(null);
            const chartInstance = React.useRef(null);

            React.useEffect(() => {
                if (!chartRef.current) return;

                const filtered = transactions.filter(t => selectedMonth === 'ALL' || (t.date && t.date.startsWith(selectedMonth)));
                
                const cardTotals = {};
                cards.forEach(c => {
                    cardTotals[c.label] = 0;
                });

                filtered.forEach(t => {
                    const matchedCard = cards.find(c => c.number === t.etollNumber);
                    const label = matchedCard ? matchedCard.label : (t.etollNumber || 'Lainnya');
                    cardTotals[label] = (cardTotals[label] || 0) + Number(t.amount || 0);
                });

                const labels = Object.keys(cardTotals);
                const values = Object.values(cardTotals);
                const hasData = values.some(v => v > 0);

                if (chartInstance.current) {
                    chartInstance.current.destroy();
                    chartInstance.current = null;
                }

                const ctx = chartRef.current.getContext('2d');

                chartInstance.current = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: hasData ? labels : ['Belum Ada Transaksi'],
                        datasets: [{
                            data: hasData ? values : [1],
                            backgroundColor: hasData ? [
                                '#6366f1', '#06b6d4', '#10b981', '#f59e0b', '#ec4899', '#8b5cf6'
                            ] : ['#334155'],
                            borderWidth: 2,
                            borderColor: '#0f172a'
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        cutout: '70%',
                        plugins: {
                            legend: {
                                position: 'bottom',
                                labels: {
                                    color: '#cbd5e1',
                                    font: { family: 'Plus Jakarta Sans', size: 11, weight: '600' },
                                    padding: 15,
                                    usePointStyle: true
                                }
                            },
                            tooltip: {
                                backgroundColor: '#0f172a',
                                titleFont: { family: 'Plus Jakarta Sans', size: 12, weight: 'bold' },
                                bodyFont: { family: 'Plus Jakarta Sans', size: 12 },
                                padding: 12,
                                cornerRadius: 10,
                                callbacks: {
                                    label: function(context) {
                                        if (!hasData) return ' Tidak ada data';
                                        return ' Total: ' + formatRupiah(context.parsed);
                                    }
                                }
                            }
                        }
                    }
                });

                return () => {
                    if (chartInstance.current) {
                        chartInstance.current.destroy();
                        chartInstance.current = null;
                    }
                };
            }, [cards, transactions, selectedMonth]);

            return (
                <div className="h-64 w-full relative flex items-center justify-center">
                    <canvas ref={chartRef}></canvas>
                </div>
            );
        }

        const INITIAL_CARDS = [
            { id: 'card-1', label: 'Mandiri e-Money Utama', number: '6032 9812 3456 7890', bank: 'Mandiri', color: 'from-blue-600 via-indigo-600 to-slate-900' },
            { id: 'card-2', label: 'BCA Flazz Operasional', number: '6013 1234 5678 9012', bank: 'BCA', color: 'from-cyan-500 via-blue-600 to-indigo-900' }
        ];

        const currentYearMonth = new Date().toISOString().substring(0, 7);

        function App() {
            const [cards, setCards] = React.useState(() => JSON.parse(localStorage.getItem('etoll_cards')) || INITIAL_CARDS);
            const [transactions, setTransactions] = React.useState(() => JSON.parse(localStorage.getItem('etoll_transactions')) || []);
            const [monthlyDeposits, setMonthlyDeposits] = React.useState(() => JSON.parse(localStorage.getItem('etoll_monthly_deposits')) || {
                [currentYearMonth]: 1500000
            });
            const [firebaseProjectId, setFirebaseProjectId] = React.useState(() => localStorage.getItem('etoll_fb_pid') || 'etoll-3366c');
            const [tempFbPid, setTempFbPid] = React.useState(() => localStorage.getItem('etoll_fb_pid') || 'etoll-3366c');
            const [geminiApiKey, setGeminiApiKey] = React.useState(() => localStorage.getItem('etoll_gemini_key') || '');

            const [spjProfile, setSpjProfile] = React.useState(() => JSON.parse(localStorage.getItem('etoll_spj_profile')) || {
                applicantName: 'Ahmad Subagja',
                division: 'Operasional Logistik',
                vehicleNopol: 'B 1928 SFA',
                companyName: 'PT Nusantara Trans',
                supervisorName: 'Hendra Wijaya'
            });

            const [activeTab, setActiveTab] = React.useState('dashboard');
            const [selectedMonth, setSelectedMonth] = React.useState(currentYearMonth);
            const [selectedCardFilter, setSelectedCardFilter] = React.useState('ALL');
            const [searchQuery, setSearchQuery] = React.useState('');

            const [showScanModal, setShowScanModal] = React.useState(false);
            const [showNfcModal, setShowNfcModal] = React.useState(false);
            const [showDepositModal, setShowDepositModal] = React.useState(false);
            const [showSpjPrintModal, setShowSpjPrintModal] = React.useState(false);
            const [deletingTx, setDeletingTx] = React.useState(null);
            const [toast, setToast] = React.useState(null);

            const [syncStatus, setSyncStatus] = React.useState({ state: 'idle', msg: '' });
            const [isSyncing, setIsSyncing] = React.useState(false);

            const fetchCloudData = React.useCallback(async (pidOverride = null) => {
                const targetPid = (pidOverride !== null ? pidOverride : firebaseProjectId).trim();
                if (!targetPid) {
                    setSyncStatus({ state: 'idle', msg: 'Cloud Sync Non-Aktif (Project ID Kosong)' });
                    return;
                }
                
                setIsSyncing(true);
                const primaryUrl = `https://${targetPid}-default-rtdb.asia-southeast1.firebasedatabase.app/etoll_transactions.json`;
                const fallbackUrl = `https://${targetPid}.firebaseio.com/etoll_transactions.json`;

                try {
                    let res = await fetch(primaryUrl);
                    if (!res.ok) {
                        res = await fetch(fallbackUrl);
                    }
                    if (!res.ok) {
                        throw new Error(`Realtime DB Error ${res.status}. Pastikan Rules database terbuka.`);
                    }
                    const data = await res.json();
                    if (data && typeof data === 'object') {
                        const cloudTxs = Object.keys(data).map(key => ({
                            fbKey: key,
                            ...data[key],
                            id: data[key].id || key
                        }));

                        setTransactions(prev => {
                            const cloudInvoiceSet = new Set(cloudTxs.map(t => t.invoiceNumber ? t.invoiceNumber.trim().toUpperCase() : t.id));
                            const cloudIdSet = new Set(cloudTxs.map(t => t.id));
                            
                            // Hanya pertahankan data lokal yang belum sempat tersinkron ke cloud
                            const localOnly = prev.filter(p => {
                                const inv = p.invoiceNumber ? p.invoiceNumber.trim().toUpperCase() : null;
                                if (inv && cloudInvoiceSet.has(inv)) return false;
                                if (p.id && cloudIdSet.has(p.id)) return false;
                                return true;
                            });

                            const combined = [...cloudTxs, ...localOnly];
                            return combined.sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));
                        });

                        setSyncStatus({ state: 'success', msg: `Terhubung Realtime DB (${cloudTxs.length} data di Cloud)` });
                    } else {
                        setSyncStatus({ state: 'success', msg: 'Terhubung ke Firebase (Belum ada transaksi)' });
                    }
                } catch (e) {
                    console.warn("Cloud Sync Error:", e);
                    setSyncStatus({ state: 'error', msg: e.message || "Gagal terhubung ke Firebase" });
                } finally {
                    setIsSyncing(false);
                }
            }, [firebaseProjectId]);

            React.useEffect(() => {
                if (firebaseProjectId) {
                    fetchCloudData();
                    const interval = setInterval(() => fetchCloudData(), 12000);
                    return () => clearInterval(interval);
                }
            }, [firebaseProjectId, fetchCloudData]);

            React.useEffect(() => { localStorage.setItem('etoll_cards', JSON.stringify(cards)); }, [cards]);
            React.useEffect(() => { localStorage.setItem('etoll_transactions', JSON.stringify(transactions)); }, [transactions]);
            React.useEffect(() => { localStorage.setItem('etoll_monthly_deposits', JSON.stringify(monthlyDeposits)); }, [monthlyDeposits]);
            React.useEffect(() => { localStorage.setItem('etoll_fb_pid', firebaseProjectId); }, [firebaseProjectId]);
            React.useEffect(() => { localStorage.setItem('etoll_gemini_key', geminiApiKey); }, [geminiApiKey]);
            React.useEffect(() => { localStorage.setItem('etoll_spj_profile', JSON.stringify(spjProfile)); }, [spjProfile]);

            const showToastNotification = (msg, type = 'success') => {
                setToast({ msg, type });
                setTimeout(() => setToast(null), 4000);
            };

            const handleSaveDeposit = (monthKey, amount) => {
                setMonthlyDeposits(prev => ({
                    ...prev,
                    [monthKey]: Number(amount || 0)
                }));
                setShowDepositModal(false);
                showToastNotification(`Deposit Uang Muka untuk periode ${monthKey} diperbarui.`);
            };

            const currentDeposit = React.useMemo(() => {
                if (selectedMonth === 'ALL') {
                    return Object.values(monthlyDeposits).reduce((a, b) => a + Number(b || 0), 0);
                }
                return Number(monthlyDeposits[selectedMonth] || 0);
            }, [monthlyDeposits, selectedMonth]);

            const checkDuplicateInvoice = (invoiceNum, excludeId = null) => {
                if (!invoiceNum || !invoiceNum.trim()) return false;
                const clean = invoiceNum.trim().toUpperCase();
                return transactions.some(t => t.id !== excludeId && t.invoiceNumber && t.invoiceNumber.trim().toUpperCase() === clean);
            };

            const handleAddCard = (newCardData) => {
                const formattedNum = formatCardNumber(newCardData.number);
                const existing = cards.find(c => c.number.replace(/\s+/g, '') === formattedNum.replace(/\s+/g, ''));
                if (existing) return existing;

                const colorPalettes = [
                    'from-indigo-600 via-purple-600 to-slate-900',
                    'from-emerald-600 via-teal-700 to-slate-900',
                    'from-amber-500 via-orange-600 to-slate-900',
                    'from-rose-600 via-pink-600 to-slate-900'
                ];
                const randomColor = colorPalettes[cards.length % colorPalettes.length];

                const newCard = {
                    id: 'card-' + Date.now(),
                    label: newCardData.label || 'e-Toll Card ' + (cards.length + 1),
                    number: formattedNum,
                    bank: newCardData.bank || 'e-Toll',
                    color: randomColor
                };
                setCards(prev => [...prev, newCard]);
                showToastNotification(`Kartu baru (${formattedNum}) berhasil ditambahkan.`);
                return newCard;
            };

            const handleSaveTransaction = async (txData) => {
                let cardNum = formatCardNumber(txData.etollNumber);
                if (cardNum && !cards.some(c => c.number.replace(/\s+/g, '') === cardNum.replace(/\s+/g, ''))) {
                    handleAddCard({ label: 'Auto ' + (txData.merchant || 'Card'), number: cardNum, bank: 'e-Toll' });
                }

                const updatedTx = { 
                    id: txData.id || ('tx-' + Date.now()),
                    etollNumber: cardNum,
                    merchant: txData.merchant,
                    amount: Number(txData.amount || 0),
                    invoiceNumber: txData.invoiceNumber,
                    date: txData.date,
                    createdAt: txData.createdAt || new Date().toISOString()
                };

                if (txData.id) {
                    setTransactions(prev => prev.map(t => t.id === updatedTx.id ? updatedTx : t));
                } else {
                    setTransactions(prev => [updatedTx, ...prev]);
                    if (updatedTx.date) setSelectedMonth(updatedTx.date.substring(0, 7));
                    setSelectedCardFilter('ALL');

                    if (firebaseProjectId) {
                        try {
                            const targetPid = firebaseProjectId.trim();
                            const primaryUrl = `https://${targetPid}-default-rtdb.asia-southeast1.firebasedatabase.app/etoll_transactions.json`;
                            const fallbackUrl = `https://${targetPid}.firebaseio.com/etoll_transactions.json`;

                            let res = await fetch(primaryUrl, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify(updatedTx)
                            });
                            if (!res.ok) {
                                await fetch(fallbackUrl, {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify(updatedTx)
                                });
                            }
                            fetchCloudData();
                        } catch (e) { console.error("Cloud Push Error:", e); }
                    }
                }
                setShowScanModal(false);
                showToastNotification('Transaksi berhasil dicatat!');
            };

            const handleDeleteTransaction = async (txToDelete) => {
                if (!txToDelete) return;
                const targetId = typeof txToDelete === 'object' ? txToDelete.id : txToDelete;
                const targetFbKey = typeof txToDelete === 'object' ? txToDelete.fbKey : null;
                const targetInvoice = typeof txToDelete === 'object' ? txToDelete.invoiceNumber : null;

                // 1. Hapus dari state lokal & localStorage

                    const next = prev.filter(t => {
                        if (targetId && t.id === targetId) return false;
                        if (targetFbKey && t.fbKey === targetFbKey) return false;
                        if (targetInvoice && t.invoiceNumber && t.invoiceNumber.trim().toUpperCase() === targetInvoice.trim().toUpperCase()) return false;
                        return true;
                    });
                    localStorage.setItem('etoll_transactions', JSON.stringify(next));
                    return next;

                setDeletingTx(null);

                        const keysToDelete = [];
                        if (targetFbKey) keysToDelete.push(targetFbKey);

                        const fallbackUrl = `https://${targetPid}.firebaseio.com/etoll_transactions.json`;

                        let res = await fetch(primaryUrl);
                        if (!res.ok) res = await fetch(fallbackUrl);
                        if (res.ok) {
                            const cloudData = await res.json();
                            if (cloudData && typeof cloudData === 'object') {
                                Object.keys(cloudData).forEach(k => {
                                    const item = cloudData[k];
                                    if (k === targetId || k === targetFbKey || item.id === targetId ||

                                        if (!keysToDelete.includes(k)) keysToDelete.push(k);
                                    }
                                });
                            }

                            let delRes = await fetch(delPrimary, { method: 'DELETE' });
                            if (!delRes.ok) {
                                await fetch(delFallback, { method: 'DELETE' });
                            }
                        }

                    reader.readAsDataURL(file);

                        const cleanInvoice = (result.invoiceNumber || '').toString().trim().toUpperCase();

                        setFormData({
                            etollNumber: formattedCard,
                            merchant: result.merchant || 'Gate Tol / Rest Area',
                            amount: result.amount || '',
                            invoiceNumber: cleanInvoice,
                            date: result.date || new Date().toISOString().substring(0, 10)
                        });

                        if (cleanInvoice && checkDuplicateInvoice(cleanInvoice)) {
                            setDuplicateWarning(true);
                        } else {
                            setDuplicateWarning(false);
                        }
                        showToastNotification("Struk berhasil di-scan dengan AI Gemini!");

                                        Rp 500.000
                                    </button>
                                    <button type="button" onClick={() => handlePreset(1000000)} className="py-2 px-3 bg-slate-800 hover:bg-slate-700 rounded-xl text-slate-200 font-bold border border-slate-700">
                                        Rp 1.000.000
                                    </button>
                                    <button type="button" onClick={() => handlePreset(1500000)} className="py-2 px-3 bg-slate-800 hover:bg-slate-700 rounded-xl text-slate-200 font-bold border border-slate-700">
                                        Rp 1.500.000
                                    </button>
                                    <button type="button" onClick={() => handlePreset(2000000)} className="py-2 px-3 bg-slate-800 hover:bg-slate-700 rounded-xl text-slate-200 font-bold border border-slate-700">
                                        Rp 2.000.000
                                    </button>
                                </div>
                            </div>

                            <div className="pt-3 flex gap-2.5">
                                <button type="button" onClick={onClose} className="flex-1 py-3 border border-slate-700 rounded-xl text-slate-300 font-bold hover:bg-slate-800">
                                    Batal
                                </button>
                                <button type="submit" className="flex-1 py-3 bg-brand-600 hover:bg-brand-500 text-white font-extrabold rounded-xl shadow-lg shadow-brand-500/25">
                                    Simpan Deposit
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
