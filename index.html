        function safeStorageGet(key, fallback = null) {
            try {
                const value = localStorage.getItem(key);
                return value === null ? fallback : value;
            } catch (e) {
                console.warn('localStorage read failed:', key, e);
                return fallback;
            }
        }

        function safeStorageSet(key, value) {
            try {
                localStorage.setItem(key, value);
                return true;
            } catch (e) {
                console.warn('localStorage write failed:', key, e);
                return false;
            }
        }

        function getLocalDateString(date = new Date()) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function compressImageDataUrl(dataUrl, maxWidth = 1280, quality = 0.72) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => {
                    const scale = Math.min(1, maxWidth / img.naturalWidth);
                    const canvas = document.createElement('canvas');
                    canvas.width = Math.max(1, Math.round(img.naturalWidth * scale));
                    canvas.height = Math.max(1, Math.round(img.naturalHeight * scale));
                    const ctx = canvas.getContext('2d', { alpha: false });
                    if (!ctx) return reject(new Error('Browser tidak mendukung Canvas untuk kompresi gambar.'));
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    resolve(canvas.toDataURL('image/jpeg', quality));
                };
                img.onerror = () => reject(new Error('Gambar struk tidak dapat dibaca.'));
                img.src = dataUrl;
            });
        }

        function formatRupiah(number) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(number || 0);
        }

        function formatNumberOnly(number) {
            return new Intl.NumberFormat('id-ID', { maximumFractionDigits: 0 }).format(number || 0);
        }

        function formatDateIndo(dateString) {
            if (!dateString) return '-';
            const date = new Date(dateString);
            if (isNaN(date.getTime())) return dateString;
            return new Intl.DateTimeFormat('id-ID', { day: 'numeric', month: 'short', year: 'numeric' }).format(date);
        }

        function formatCardNumber(val) {
            if (!val) return '';
            const cleaned = val.toString().replace(/\D/g, '').slice(0, 16);
            return cleaned.replace(/(\d{4})(?=\d)/g, '$1 ').trim();
        }

        function terbilangRupiah(num) {
            const angka = ["", "Satu", "Dua", "Tiga", "Empat", "Lima", "Enam", "Tujuh", "Delapan", "Sembilan", "Sepuluh", "Sebelas"];
            num = Math.floor(Math.abs(Number(num) || 0));
            if (num === 0) return "Nol Rupiah";

            function terbilang(n) {
                if (n < 12) return angka[n];
                if (n < 20) return terbilang(n - 10) + " Belas";
                if (n < 100) return terbilang(Math.floor(n / 10)) + " Puluh " + (n % 10 !== 0 ? terbilang(n % 10) : "");
                if (n < 200) return "Seratus " + (n - 100 !== 0 ? terbilang(n - 100) : "");
                if (n < 1000) return terbilang(Math.floor(n / 100)) + " Ratus " + (n % 100 !== 0 ? terbilang(n % 100) : "");
                if (n < 2000) return "Seribu " + (n - 1000 !== 0 ? terbilang(n - 1000) : "");
                if (n < 1000000) return terbilang(Math.floor(n / 1000)) + " Ribu " + (n % 1000 !== 0 ? terbilang(n % 1000) : "");
                if (n < 1000000000) return terbilang(Math.floor(n / 1000000)) + " Juta " + (n % 1000000 !== 0 ? terbilang(n % 1000000) : "");
                if (n < 1000000000000) return terbilang(Math.floor(n / 1000000000)) + " Miliar " + (n % 1000000000 !== 0 ? terbilang(n % 1000000000) : "");
                return terbilang(Math.floor(n / 1000000000000)) + " Triliun " + (n % 1000000000000 !== 0 ? terbilang(n % 1000000000000) : "");
            }
            return terbilang(num).replace(/\s+/g, ' ').trim() + " Rupiah";
        }

        function detectBankFromCardNumber(cardNum, merchant = '') {
            const clean = (cardNum || '').replace(/\D/g, '');
            const m = (merchant || '').toLowerCase();
            
            if (clean.startsWith('6032') || clean.startsWith('6087') || clean.startsWith('6031') || clean.startsWith('5899') || clean.startsWith('6035') || m.includes('mandiri') || m.includes('e-money') || m.includes('livin')) {
                return { bank: 'Mandiri', color: 'from-blue-600 via-indigo-700 to-blue-900', label: 'Mandiri e-Money' };
            }
            if (clean.startsWith('6013') || clean.startsWith('6019') || clean.startsWith('6014') || clean.startsWith('6015') || m.includes('bca') || m.includes('flazz')) {
                return { bank: 'BCA', color: 'from-sky-600 via-blue-700 to-indigo-950', label: 'BCA Flazz' };
            }
            if (clean.startsWith('6018') || clean.startsWith('5379') || clean.startsWith('5221') || m.includes('bri') || m.includes('brizzi')) {
                return { bank: 'BRI', color: 'from-cyan-600 via-blue-800 to-blue-950', label: 'BRI Brizzi' };
            }
            if (clean.startsWith('1515') || clean.startsWith('7546') || clean.startsWith('5401') || m.includes('bni') || m.includes('tapcash')) {
                return { bank: 'BNI', color: 'from-amber-600 via-orange-700 to-slate-900', label: 'BNI TapCash' };
            }
            if (clean.startsWith('6030') || m.includes('jakcard') || m.includes('dki')) {
                return { bank: 'Bank DKI', color: 'from-emerald-600 via-teal-700 to-slate-900', label: 'DKI JakCard' };
            }

            return { bank: 'BCA', color: 'from-sky-600 via-blue-700 to-indigo-950', label: 'BCA Flazz' };
        }

        function getGoogleDriveDirectImageUrl(url) {
            if (!url) return '';
            const cleanUrl = String(url).trim();
            if (cleanUrl.startsWith('data:image')) return cleanUrl;

            let fileId = null;
            const match1 = cleanUrl.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
            if (match1 && match1[1]) {
                fileId = match1[1];
            } else {
                const match2 = cleanUrl.match(/id=([a-zA-Z0-9_-]+)/);
                if (match2 && match2[1]) {
                    fileId = match2[1];
                } else if (/^[a-zA-Z0-9_-]{25,}$/.test(cleanUrl)) {
                    fileId = cleanUrl;
                }
            }

            if (fileId) {
                return `https://drive.google.com/thumbnail?id=${fileId}&sz=w2500`;
            }
            return cleanUrl;
        }

        async function callGeminiOCR(base64DataUrl, userApiKey) {
            let mimeType = "image/jpeg";
            let base64Data = base64DataUrl;
            const match = base64DataUrl.match(/^data:(image\/[a-zA-Z0-9.+]+);base64,(.+)$/);
            if (match) {
                mimeType = match[1];
                base64Data = match[2];
            }

            const apiKey = (userApiKey || "").trim();
            if (!apiKey) {
                throw new Error("API Key Gemini belum diisi. Silakan masukkan API Key Gemini Anda.");
            }

            const systemPrompt = "Anda adalah sistem OCR multimodal khusus mengekstrak data dari invoice/struk e-Toll Indonesia (e-Money, BCA Flazz, Brizzi, Tapcash, Livin, Tokopedia, Indomaret, dll). Ekstrak data secara tepat.";
            const userPrompt = "Analisis foto struk ini. Ekstrak:\n1. etollNumber: 16-digit nomor kartu e-Toll\n2. merchant: Nama driver atau tempat/aplikasi pembelian\n3. amount: Total nominal (angka murni tanpa titik/koma)\n4. invoiceNumber: Nomor resi / invoice / referensi\n5. date: Tanggal transaksi (YYYY-MM-DD)";

            // Prioritaskan model stable yang ada di Google AI Studio
            const modelNames = ["gemini-1.5-flash", "gemini-2.0-flash", "gemini-1.5-pro", "gemini-2.5-flash"];
            let lastError = null;

            for (const model of modelNames) {
                try {
                    const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
                    const payload = {
                        contents: [{ role: "user", parts: [{ text: userPrompt }, { inlineData: { mimeType, data: base64Data } }] }],
                        systemInstruction: { parts: [{ text: systemPrompt }] },
                        generationConfig: {
                            responseMimeType: "application/json",
                            responseSchema: {
                                type: "OBJECT",
                                properties: {
                                    etollNumber: { type: "STRING" },
                                    merchant: { type: "STRING" },
                                    amount: { type: "NUMBER" },
                                    invoiceNumber: { type: "STRING" },
                                    date: { type: "STRING" }
                                },
                                required: ["etollNumber", "merchant", "amount", "invoiceNumber", "date"]
                            }
                        }
                    };

                    const response = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                    if (!response.ok) {
                        const errJson = await response.json().catch(() => ({}));
                        throw new Error(errJson.error?.message || `HTTP ${response.status} pada model ${model}`);
                    }

                    const result = await response.json();
                    const text = result?.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (!text) {
                        throw new Error("Respons AI kosong atau diblokir oleh filter keamanan.");
                    }

                    const cleanJsonStr = text.replace(/```json/g, '').replace(/```/g, '').trim();
                    const parsed = JSON.parse(cleanJsonStr);

                    if (parsed.amount) {
                        parsed.amount = parseFloat(String(parsed.amount).replace(/[^0-9.]/g, '')) || 0;
                    }
                    return parsed;
                } catch (err) {
                    console.warn(`Percobaan model ${model} gagal:`, err.message);
                    lastError = err;
                }
            }

            throw lastError || new Error("Gagal memproses OCR via Gemini API.");
        }

        function ScanAndAddModal({ userApiKey, setGeminiApiKey, checkDuplicateInvoice, cards, onSave, onClose, showToastNotification, dailyUsage, freeDailyLimit, updateDailyUsage, gdriveWebhookUrl }) {
            const [selectedImage, setSelectedImage] = React.useState(null);
            const [selectedImageBytes, setSelectedImageBytes] = React.useState(500000);
            const [isScanning, setIsScanning] = React.useState(false);
            const [duplicateWarning, setDuplicateWarning] = React.useState(false);
            const [allowDuplicateOverride, setAllowDuplicateOverride] = React.useState(false);
            const [modalApiKey, setModalApiKey] = React.useState(userApiKey || '');

            const isQuotaExceeded = !modalApiKey && dailyUsage.count >= freeDailyLimit;

            const [formData, setFormData] = React.useState({
                etollNumber: '',
                merchant: '',
                amount: '',
                invoiceNumber: '',
                date: getLocalDateString(),
                gdriveUrl: ''
            });

            const handleSaveApiKey = () => {
                if (modalApiKey.trim()) {
                    setGeminiApiKey(modalApiKey.trim());
                    showToastNotification("API Key Gemini disimpan!");
                }
            };

            const handleFileSelect = (e) => {
                const file = e.target.files[0];
                if (file) {
                    setSelectedImageBytes(file.size || 500000);
                    const reader = new FileReader();
                    reader.onload = async (event) => {
                        try {
                            const compressed = await compressImageDataUrl(event.target.result);
                            setSelectedImage(compressed);
                            setFormData(prev => ({ ...prev, gdriveUrl: compressed }));
                        } catch (err) {
                            showToastNotification(err.message || 'Gagal memproses foto struk.', 'error');
                        }
                    };
                    reader.readAsDataURL(file);
                }
            };

            const handleRunOcr = async () => {
                if (!selectedImage) return;

                if (!modalApiKey.trim()) {
                    showToastNotification('API Key Gemini wajib diisi untuk menjalankan OCR dari browser ini.', 'error');
                    return;
                }

                if (isQuotaExceeded) {
                    showToastNotification("Batas kuota gratis harian tercapai. Masukkan API Key Gemini.", "error");
                    return;
                }

                setIsScanning(true);
                try {
                    const result = await callGeminiOCR(selectedImage, modalApiKey);
                    if (result) {
                        const formattedCard = formatCardNumber(result.etollNumber || '');
                        const cleanInvoice = (result.invoiceNumber || '').toString().trim().toUpperCase();

                        setFormData(prev => ({
                            ...prev,
                            etollNumber: formattedCard,
                            merchant: result.merchant || 'Saiful Pramono',
                            amount: result.amount || '',
                            invoiceNumber: cleanInvoice,
                            date: result.date || getLocalDateString(),
                            gdriveUrl: selectedImage
                        }));

                        if (cleanInvoice && checkDuplicateInvoice(cleanInvoice)) {
                            setDuplicateWarning(true);
                        } else {
                            setDuplicateWarning(false);
                        }

                        updateDailyUsage(selectedImageBytes);
                        showToastNotification("Struk berhasil di-scan dengan AI!");
                    }
                } catch (err) {
                    showToastNotification(err.message || "Gagal OCR Struk.", "error");
                } finally {
                    setIsScanning(false);
                }
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                if (checkDuplicateInvoice(formData.invoiceNumber) && !allowDuplicateOverride) {
                    setDuplicateWarning(true);
                    return;
                }
                onSave({ ...formData, gdriveUrl: formData.gdriveUrl || selectedImage || '', source: 'Web Scan' });

            return (
                <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4 backdrop-blur-md overflow-y-auto modal-backdrop">

                            <form onSubmit={handleSubmit} className="space-y-3 pt-2">

    <script type="text/babel">
        function SpjPrintModal({ spjProfile, selectedMonth, transactions, depositAmount, cards, spjSortBy = 'total-desc', setSpjSortBy, onClose }) {
            const [selectedDocView, setSelectedDocView] = React.useState('ALL');
            const [invoicesPerPage, setInvoicesPerPage] = React.useState(4);

            const getMonthLabelIndo = (yearMonth) => {
                if (!yearMonth || yearMonth === 'ALL') return 'Agustus 2026';
                const [year, month] = yearMonth.split('-');
                const months = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
                const mIdx = parseInt(month, 10) - 1;
                return `${months[mIdx] || month} ${year}`;
            };

            // Bangun map transaksi untuk bulan yang dipilih
            const monthlyTxs = transactions.filter(t => selectedMonth === 'ALL' || (t.date && t.date.startsWith(selectedMonth)));

            // Gabungkan master kartu dan kartu dari transaksi agar tidak ada data yang terlewat
            const knownCardsMap = {};
            cards.forEach(c => {
                const clean = (c.number || '').replace(/\D/g, '');
                if (clean) knownCardsMap[clean] = { ...c };
            });

            monthlyTxs.forEach(t => {
                const clean = (t.etollNumber || '').replace(/\D/g, '');
                if (clean && !knownCardsMap[clean]) {
                    const detected = detectBankFromCardNumber(t.etollNumber, t.merchant);
                    const official = OFFICIAL_DRIVER_MAP[clean];
                    knownCardsMap[clean] = {
                        id: 'tx-card-' + clean,
                        label: official ? official.name : (t.merchant || detected.label),
                        nopol: official ? official.nopol : 'AD 1214 XU',
                        number: formatCardNumber(t.etollNumber),
                        bank: detected.bank
                    };
                }
            });

            const displayList = Object.values(knownCardsMap)
                .map((c, originalIdx) => {
                    const formattedNum = formatCardNumber(c.number);
                    const cleanNum = formattedNum.replace(/\D/g, '');
                    
                    const officialData = OFFICIAL_DRIVER_MAP[cleanNum];
                    let driverName = c.label;
                    if (!driverName || driverName.startsWith('BCA Flazz (') || driverName.startsWith('Mandiri') || driverName.startsWith('Kartu')) {
                        driverName = officialData ? officialData.name : c.label;
                    }

                    let nopol = c.nopol || (officialData ? officialData.nopol : 'AD 1214 XU');

                    const cardTxs = monthlyTxs.filter(t => (t.etollNumber || '').replace(/\D/g, '') === cleanNum);
                    const totalSpent = cardTxs.reduce((sum, t) => sum + Number(t.amount || 0), 0);

                    return {
                        originalIndex: originalIdx,
                        name: driverName,
                        nopol: nopol,
                        number: formattedNum,
                        cleanNumber: cleanNum,
                        total: totalSpent,
                        txCount: cardTxs.length
                    };
                })
                .filter(item => Number(item.total || 0) > 0);

            // Terapkan pengurutan dinamis sesuai preferensi yang dipilih
            displayList.sort((a, b) => {
                if (spjSortBy === 'total-desc') return b.total - a.total;
                if (spjSortBy === 'total-asc') return a.total - b.total;
                if (spjSortBy === 'name-asc') return (a.name || '').localeCompare(b.name || '');
                if (spjSortBy === 'nopol-asc') return (a.nopol || '').localeCompare(b.nopol || '');
                if (spjSortBy === 'card-asc') return (a.cleanNumber || '').localeCompare(b.cleanNumber || '');
                return a.originalIndex - b.originalIndex;
            });

            const totalAmount = displayList.reduce((sum, item) => sum + Number(item.total || 0), 0);

            // Susun invoice/struk secara berurutan sesuai Nomor Urut Rekapan
            const orderedInvoices = [];
            displayList.forEach((driverItem, driverIdx) => {
                const driverTxs = monthlyTxs
                    .filter(t => (t.etollNumber || '').replace(/\D/g, '') === driverItem.cleanNumber)
                    .sort((a, b) => new Date(a.date || 0) - new Date(b.date || 0));

                driverTxs.forEach((tx, subIdx) => {
                    orderedInvoices.push({
                        rekapNo: driverIdx + 1,
                        subIndex: subIdx + 1,
                        driverName: driverItem.name,
                        nopol: driverItem.nopol,
                        etollNumber: driverItem.number,
                        invoiceNumber: tx.invoiceNumber || `INV-${tx.id}`,
                        date: tx.date,
                        amount: Number(tx.amount || 0),
                        merchant: tx.merchant || driverItem.name,
                        gdriveUrl: tx.gdriveUrl || tx.driveFileUrl || '',
                        source: tx.source || 'Web'
                    });
                });
            });

            const invoicePages = [];
            for (let i = 0; i < orderedInvoices.length; i += invoicesPerPage) {
                invoicePages.push(orderedInvoices.slice(i, i + invoicesPerPage));
            }

            return (
                <div className="fixed inset-0 z-50 bg-black/90 flex items-center justify-center p-2 sm:p-4 backdrop-blur-md overflow-y-auto print-modal-overlay">
                    <div className="bg-slate-900 text-slate-100 rounded-3xl max-w-5xl w-full my-4 print-container shadow-2xl overflow-hidden border border-slate-700">
                        {/* TOOLBAR NO-PRINT */}
                        <div className="flex flex-col lg:flex-row justify-between items-start lg:items-center p-4 bg-slate-950 text-white gap-3 no-print border-b border-slate-800">
                            <div className="flex items-center gap-3">
                                <div className="p-2.5 rounded-2xl bg-gradient-to-tr from-amber-500/20 to-orange-500/20 text-amber-400 font-bold text-sm border border-amber-500/30">
                                    <i className="fa-solid fa-file-contract"></i>
                                </div>
                                <div>
                                    <h3 className="font-extrabold text-sm text-white flex items-center gap-2">
                                        Dokumen SPJ Resmi (Format Legal & Margin Khusus)
                                        <span className="text-[10px] px-2 py-0.5 rounded-full bg-slate-800 text-amber-300 border border-slate-700 font-normal">
                                            {3 + invoicePages.length} Halaman
                                        </span>
                                    </h3>
                                    <p className="text-[11px] text-slate-400">Rekap, Kuitansi, SPBy, & Lampiran Struk ({invoicesPerPage} Struk/Lembar, Margin Sempit)</p>
                                </div>
                            </div>

                            <div className="flex flex-wrap items-center gap-2">
                                <div className="flex items-center bg-slate-800/90 p-1 rounded-xl text-xs font-bold border border-slate-700">
                                    <span className="text-[10px] font-bold text-slate-400 px-2 flex items-center gap-1">
                                        <i className="fa-solid fa-arrow-down-short-wide text-brand-400"></i> Urutkan:
                                    </span>
                                    <select
                                        value={spjSortBy}
                                        onChange={(e) => setSpjSortBy && setSpjSortBy(e.target.value)}
                                        className="bg-slate-900 text-amber-300 font-bold text-xs px-2 py-1 rounded-lg border border-slate-700 focus:outline-none"
                                    >
                                        <option value="total-desc">💰 Nominal Terbesar</option>
                                        <option value="total-asc">🪙 Nominal Terkecil</option>
                                        <option value="name-asc">👤 Nama Driver (A-Z)</option>
                                        <option value="nopol-asc">🚗 No. Polisi (Nopol)</option>
                                        <option value="card-asc">💳 Nomor e-Toll</option>
                                        <option value="master-order">📋 Urutan Master Asli</option>
                                    </select>
                                </div>

                                <div className="flex items-center bg-slate-800/90 p-1 rounded-xl text-xs font-bold border border-slate-700">
                                    <span className="text-[10px] font-bold text-slate-400 px-2 flex items-center gap-1">
                                        <i className="fa-solid fa-layer-group text-amber-400"></i> Layout:
                                    </span>
                                    <button 
                                        onClick={() => setInvoicesPerPage(4)} 
                                        className={`px-2.5 py-1 rounded-lg transition text-xs flex items-center gap-1.5 ${invoicesPerPage === 4 ? 'bg-indigo-600 text-white font-black shadow' : 'text-slate-400 hover:text-white'}`}
                                    >
                                        <span>4 / Hal (Besar)</span>
                                    </button>
                                    <button 
                                        onClick={() => setInvoicesPerPage(6)} 
                                        className={`px-2.5 py-1 rounded-lg transition text-xs flex items-center gap-1.5 ${invoicesPerPage === 6 ? 'bg-indigo-600 text-white font-black shadow' : 'text-slate-400 hover:text-white'}`}
                                    >
                                        <span>6 / Hal (Hemat)</span>
                                    </button>
                                </div>

                                <div className="flex bg-slate-800/90 p-1 rounded-xl text-xs font-bold border border-slate-700">

        function NfcModal({ cards, transactions, currentMonth, onClose }) {
            const [scannedCardNum, setScannedCardNum] = React.useState('');
            const [matchedCard, setMatchedCard] = React.useState(null);
            const [isScanning, setIsScanning] = React.useState(false);
            const [unregisteredMode, setUnregisteredMode] = React.useState(false);

            const [nfcSupported] = React.useState('NDEFReader' in window);
            const [nfcStatus, setNfcStatus] = React.useState(
                'NDEFReader' in window 
                    ? 'Klik "Aktifkan Sensor NFC HP" lalu tempelkan kartu e-Toll ke bagian belakang HP Anda.' 
                    : 'Gunakan Google Chrome Android dengan NFC aktif atau gunakan tombol simulasi.'
            );

            const handleNfcReadSuccess = (uidRaw, cardNumFromNdef = '') => {
                const cleanUid = (uidRaw || '').replace(/:/g, '').toUpperCase();

                let foundCard = cards.find(c => {
                    const cCleanNum = (c.number || '').replace(/\D/g, '');
                    const cNfcUid = (c.nfcUid || '').replace(/:/g, '').toUpperCase();
                    return (cleanUid && cNfcUid === cleanUid) || (cleanUid && cCleanNum.includes(cleanUid));
                });

                if (!foundCard && cardNumFromNdef) {
                    const formattedNdef = formatCardNumber(cardNumFromNdef);
                    foundCard = cards.find(c => c.number === formattedNdef);
                }

                if (foundCard) {
                    setScannedCardNum(foundCard.number);
                    setMatchedCard(foundCard);
                    setUnregisteredMode(false);
                    setNfcStatus(`Kartu Terdaftar: ${foundCard.label}`);
                } else {
                    setScannedCardNum('');
                    setMatchedCard(null);
                    setUnregisteredMode(true);
                    setNfcStatus(`Kartu NFC Baru Terdeteksi (UID: ${uidRaw || 'N/A'}).`);
                }
            };

            const startNfcScan = async () => {
                if (!('NDEFReader' in window)) return;
                try {
                    const ndef = new window.NDEFReader();
                    await ndef.scan();
                    setIsScanning(true);
                    setNfcStatus('Sensor NFC Aktif! Tempelkan kartu...');

                    ndef.onreading = (event) => {
                        const uid = event.serialNumber || '';
                        handleNfcReadSuccess(uid);
                    };
                } catch (error) {
                    setIsScanning(false);
                    setNfcStatus('Gagal mengaktifkan NFC: ' + error.message);
                }
            };

            const handleSimulateNfc = () => {
                if (cards.length > 0) {
                    const randomCard = cards[Math.floor(Math.random() * cards.length)];
                    handleNfcReadSuccess(randomCard.nfcUid || '04:A2:B3:C4:D5:E6', randomCard.number);
                }
            };

            const cardSpentThisMonth = React.useMemo(() => {
                if (!scannedCardNum) return 0;
                const cleanTarget = scannedCardNum.replace(/\D/g, '');
                return transactions
                    .filter(t => (t.etollNumber || '').replace(/\D/g, '') === cleanTarget && (currentMonth === 'ALL' || (t.date && t.date.startsWith(currentMonth))))
                    .reduce((s, t) => s + Number(t.amount || 0), 0);
            }, [scannedCardNum, transactions, currentMonth]);

            return (
                <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4 backdrop-blur-md modal-backdrop overflow-y-auto">
                    <div className="glass-panel p-6 rounded-3xl max-w-md w-full space-y-4 my-6 shadow-2xl border border-slate-700">
                        <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                            <h3 className="font-extrabold text-base flex items-center gap-2 text-purple-400">
                                <i className="fa-solid fa-nfc-symbol"></i> Web NFC Hardware Reader
                            </h3>
                            <button onClick={onClose} className="text-slate-400 hover:text-white text-lg">
                                <i className="fa-solid fa-xmark"></i>
                            </button>
                        </div>

                        <div className="py-2 space-y-3 text-center">
                            <div className="p-3 bg-slate-950/80 rounded-2xl border border-slate-800 text-xs">
                                <p className="font-bold text-slate-200">{nfcStatus}</p>
                            </div>

                            <div className="flex flex-col gap-2">
                                {nfcSupported && (
                                    <button 
                                        onClick={startNfcScan} 
                                        disabled={isScanning}
                                        className="w-full py-3 bg-purple-600 hover:bg-purple-500 text-white rounded-xl font-extrabold text-xs transition"
                                    >
                                        {isScanning ? 'Sensor NFC Siap Membaca...' : 'Aktifkan Sensor NFC HP'}
                                    </button>
                                )}
                                <button 
                                    onClick={handleSimulateNfc} 
                                    className="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3.5 py-2 rounded-xl font-bold border border-slate-700 transition"
                                >
                                    <i className="fa-solid fa-vial text-purple-400 mr-1"></i> Simulasi Tap Kartu
                                </button>
                            </div>
                        </div>

                        {scannedCardNum && !unregisteredMode && (
                            <div className="p-4 bg-slate-950 rounded-2xl border border-purple-900/60 text-left space-y-2">
                                <p className="text-[10px] font-bold text-purple-400 uppercase">Kartu NFC Terbaca:</p>
                                <p className="text-base font-mono font-bold text-white">{scannedCardNum}</p>
                                {matchedCard && (
                                    <p className="text-xs font-bold text-emerald-400">{matchedCard.label} ({matchedCard.nopol})</p>
                                )}
                                <div className="pt-2 border-t border-slate-800 flex justify-between items-center">
                                    <span className="text-xs text-slate-400">Total Pengeluaran ({currentMonth}):</span>
                                    <span className="text-lg font-black text-purple-300">{formatRupiah(cardSpentThisMonth)}</span>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }
    </script>

                        city: 'Surakarta',
                        ta: '2026',

                        spbyNo: '/2026',
                        mak: '',
                        kasubditName: 'Widyo Agung Nugroho. S.Kom.',
                        kasubditNip: '198110212008121001',
                        bppName: 'Rita Hindrawati, S.S.',
                        bppNip: '198203102009102001',
                        ppkName: 'Marsilia Dika Pramesti S.E.',
                        ppkNip: '198608222008122001'
                    };
                } catch (e) {
                    return {};
                }
            });

            const [activeTab, setActiveTab] = React.useState('dashboard');
            // Mode Admin: area sensitif hanya ditampilkan setelah password admin benar.
            // Status tidak disimpan ke localStorage agar sesi admin berakhir saat halaman di-refresh.
            const [isAdminMode, setIsAdminMode] = React.useState(false);
            const [showAdminLogin, setShowAdminLogin] = React.useState(false);
            const [adminPasswordInput, setAdminPasswordInput] = React.useState('');
            const [adminPassError, setAdminPassError] = React.useState('');
            const [selectedMonth, setSelectedMonth] = React.useState(currentYearMonth);
            const [analyticsViewMode, setAnalyticsViewMode] = React.useState('DRIVER'); // 'DRIVER', 'BANK', 'TIMELINE'
            const [selectedCardFilter, setSelectedCardFilter] = React.useState('ALL');
            const [searchQuery, setSearchQuery] = React.useState('');
            const [sortConfig, setSortConfig] = React.useState({ key: 'date', direction: 'desc' });
            const [spjSortBy, setSpjSortBy] = React.useState('total-desc');

            const [showScanModal, setShowScanModal] = React.useState(false);
            const [showNfcModal, setShowNfcModal] = React.useState(false);
            const [showSpjPrintModal, setShowSpjPrintModal] = React.useState(false);
            const [showDepositModal, setShowDepositModal] = React.useState(false);
            const [depositModalMonth, setDepositModalMonth] = React.useState(currentYearMonth);
            const [depositModalValue, setDepositModalValue] = React.useState('');
            const [deletingTx, setDeletingTx] = React.useState(null);
            const [deleteTxPassword, setDeleteTxPassword] = React.useState('');
            const [deleteTxPassError, setDeleteTxPassError] = React.useState('');
            const [editingTx, setEditingTx] = React.useState(null);
            const [inspectingTx, setInspectingTx] = React.useState(null);
            const [toast, setToast] = React.useState(null);
            const [syncStatus, setSyncStatus] = React.useState({ state: 'idle', msg: 'Memulai koneksi...' });

            const REQUIRED_PASSWORD = 'anda321';

            const openAdminLogin = () => {
                if (isAdminMode) {
                    setIsAdminMode(false);
                    if (['monthly_recap', 'cloud_config', 'master_data'].includes(activeTab)) {
                        setActiveTab('dashboard');
                    }
                    showToastNotification('Mode Admin dinonaktifkan.', 'info');

                }
                setAdminPasswordInput('');
                setAdminPassError('');
                setShowAdminLogin(true);
            };

            const confirmAdminLogin = () => {
                if (adminPasswordInput !== REQUIRED_PASSWORD) {
                    setAdminPassError('Password admin salah! Harap periksa kembali.');
                    return;
                }
                setIsAdminMode(true);
                setShowAdminLogin(false);
                setAdminPasswordInput('');
                setAdminPassError('');
                showToastNotification('Mode Admin aktif. Menu administrasi dan data penting telah dibuka.', 'success');
            };

            const handleAdminTab = (tab) => {
                if (!isAdminMode) {
                    openAdminLogin();
                    return;
                }
                setActiveTab(tab);
            };

            const handleUpdateDeposit = (monthKey, amount) => {
                const targetMonth = (!monthKey || monthKey === 'ALL') ? currentYearMonth : monthKey;
                const num = Math.max(0, Number(amount) || 0);
                const updated = { ...monthlyDeposits, [targetMonth]: num };
                setMonthlyDeposits(updated);
                safeStorageSet('etoll_monthly_deposits', JSON.stringify(updated));
                pushToCloud('monthlyDeposits', updated);
                showToastNotification(`Deposit Kasbon ${targetMonth} berhasil diatur ke ${formatRupiah(num)}!`);
            };

            const openDepositModalForMonth = (m) => {
                const target = (!m || m === 'ALL') ? currentYearMonth : m;
                setDepositModalMonth(target);
                setDepositModalValue(String(monthlyDeposits[target] ?? 20000000));
                setShowDepositModal(true);
            };

            const pushToCloud = async (path, data) => {
                if (!firebaseProjectId) return;
                try {
                    const targetPid = firebaseProjectId.trim();
                    const response = await fetch(`https://${targetPid}-default-rtdb.asia-southeast1.firebasedatabase.app/${path}.json`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(data)
                    });
                    if (!response.ok) throw new Error(`Firebase HTTP ${response.status}`);
                } catch (e) {
                    console.error("Cloud push failed for", path, e);
                }
            };

            // Perbaikan Bug 2: Jangan sinkronkan kartu yang sudah sengaja dihapus
            React.useEffect(() => {
                if (!transactions || transactions.length === 0) return;
                let addedAny = false;
                const existingCleanNums = new Set(cards.map(c => (c.number || '').replace(/\D/g, '')));
                const deletedSet = new Set(deletedCardNumbers);
                const newCardsToAdd = [];

                transactions.forEach(tx => {
                    const cleanNum = (tx.etollNumber || '').replace(/\D/g, '');
                    if (cleanNum && cleanNum.length >= 12 && !existingCleanNums.has(cleanNum) && !deletedSet.has(cleanNum)) {
                        existingCleanNums.add(cleanNum);
                        const officialData = OFFICIAL_DRIVER_MAP[cleanNum];
                        const matchedPreset = INITIAL_CARDS.find(ic => (ic.number || '').replace(/\D/g, '') === cleanNum);
                        const detected = detectBankFromCardNumber(tx.etollNumber, tx.merchant);

                        let driverName = officialData ? officialData.name : (matchedPreset ? matchedPreset.label : null);
                        let nopol = officialData ? officialData.nopol : (matchedPreset ? matchedPreset.nopol : null);

                        if (!driverName) {
                            driverName = (tx.merchant && !['bank bri', 'brimo', 'mandiri', 'livin'].some(b => tx.merchant.toLowerCase().includes(b))) 
                                ? tx.merchant 
                                : `Driver Baru (${cleanNum.slice(-4)})`;
                        }
                        if (!nopol) {
                            nopol = 'AD 1214 XU';
                        }

                        newCardsToAdd.push({
                            id: 'card-' + Date.now() + '-' + Math.random().toString(36).substring(2, 6),
                            label: driverName,
                            nopol: nopol,
                            number: formatCardNumber(tx.etollNumber),
                            bank: detected.bank,
                            color: detected.color
                        });
                        addedAny = true;
                    }
                });

                if (addedAny && newCardsToAdd.length > 0) {
                    setCards(prev => {
                        const updated = [...prev, ...newCardsToAdd];
                        safeStorageSet('etoll_cards', JSON.stringify(updated));
                        pushToCloud('cards', updated);
                        return updated;
                    });
                }
            }, [transactions, deletedCardNumbers, cards]);

            const fetchCloudData = React.useCallback(async (pidOverride = null) => {
                const targetPid = (pidOverride !== null ? pidOverride : firebaseProjectId).trim();
                if (!targetPid) {
                    setSyncStatus({ state: 'idle', msg: 'Cloud Sync Non-Aktif' });
                    return;
                }
                
                const baseUrl = `https://${targetPid}-default-rtdb.asia-southeast1.firebasedatabase.app`;

                try {
                    const txRes = await fetch(`${baseUrl}/transactions.json`);
                    if (txRes.ok) {
                        const data = await txRes.json();
                        if (data) {
                            const cloudTxs = Object.keys(data).map(key => ({
                                id: key,
                                ...data[key]
                            }));
                            setTransactions(cloudTxs.sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0)));
                        }
                    }

                    const profileRes = await fetch(`${baseUrl}/spjProfile.json`);
                    if (profileRes.ok) {
                        const pData = await profileRes.json();
                        if (pData) setSpjProfile(prev => ({ ...prev, ...pData }));
                    }

                    const cardsRes = await fetch(`${baseUrl}/cards.json`);
                    if (cardsRes.ok) {
                        const cData = await cardsRes.json();
                        if (cData && Array.isArray(cData) && cData.length > 0) setCards(cData);
                    }

                    const depRes = await fetch(`${baseUrl}/monthlyDeposits.json`);
                    if (depRes.ok) {
                        const dData = await depRes.json();
                        if (dData) setMonthlyDeposits(dData);
                    }

                    setSyncStatus({ state: 'success', msg: `Terhubung Cloud Firebase` });
                } catch (e) {
                    setSyncStatus({ state: 'error', msg: e.message || "Gagal terhubung ke Firebase" });
                }
            }, [firebaseProjectId]);

            React.useEffect(() => {
                if (firebaseProjectId) {
                    fetchCloudData();
                    const interval = setInterval(() => fetchCloudData(), 15000);
                    return () => clearInterval(interval);
                }
            }, [firebaseProjectId, fetchCloudData]);

            React.useEffect(() => { safeStorageSet('etoll_cards', JSON.stringify(cards)); }, [cards]);
            React.useEffect(() => { safeStorageSet('etoll_deleted_cards', JSON.stringify(deletedCardNumbers)); }, [deletedCardNumbers]);
            React.useEffect(() => { safeStorageSet('etoll_transactions', JSON.stringify(transactions)); }, [transactions]);
            React.useEffect(() => { safeStorageSet('etoll_fb_pid', firebaseProjectId); }, [firebaseProjectId]);
            React.useEffect(() => { safeStorageSet('etoll_gemini_key', geminiApiKey); }, [geminiApiKey]);
            React.useEffect(() => { safeStorageSet('etoll_gdrive_webhook', gdriveWebhookUrl); }, [gdriveWebhookUrl]);
            React.useEffect(() => { safeStorageSet('etoll_spj_profile', JSON.stringify(spjProfile)); }, [spjProfile]);
            React.useEffect(() => { safeStorageSet('etoll_monthly_deposits', JSON.stringify(monthlyDeposits)); }, [monthlyDeposits]);

            const showToastNotification = (msg, type = 'success') => {
                setToast({ msg, type });
                setTimeout(() => setToast(null), 4000);
            };

            const handleUpdateSpjProfile = (newProfile) => {
                setSpjProfile(newProfile);
                pushToCloud('spjProfile', newProfile);
                showToastNotification('Profil SPJ & Pejabat berhasil diperbarui & disimpan ke Cloud!');
            };

            const checkDuplicateInvoice = (invoiceNum, excludeId = null) => {
                if (!invoiceNum || !invoiceNum.trim()) return false;
                const clean = invoiceNum.trim().toUpperCase();
                return transactions.some(t => t.id !== excludeId && t.invoiceNumber && t.invoiceNumber.trim().toUpperCase() === clean);
            };

            const handleAddCard = (newCardData) => {
                const formattedNum = formatCardNumber(newCardData.number);
                if (!formattedNum) return null;
                const cleanNum = formattedNum.replace(/\D/g, '');
                
                setDeletedCardNumbers(prev => prev.filter(n => n !== cleanNum));

                const existing = cards.find(c => (c.number || '').replace(/\D/g, '') === cleanNum);
                if (existing) {
                    showToastNotification(`Kartu (${formattedNum}) sudah terdaftar sebelumnya.`, 'info');
                    return existing;
                }

                const detected = detectBankFromCardNumber(formattedNum, newCardData.merchant || newCardData.label);
                const newCard = {
                    id: 'card-' + Date.now(),
                    label: newCardData.label || `${detected.label} (${cleanNum.slice(-4) || 'e-Toll'})`,
                    nopol: (newCardData.nopol || 'AD 1214 XU').toUpperCase(),
                    number: formattedNum,
                    bank: newCardData.bank || detected.bank,
                    color: detected.color
                };
                const updated = [...cards, newCard];
                setCards(updated);
                pushToCloud('cards', updated);
                showToastNotification(`Kartu baru (${formattedNum}) berhasil ditambahkan.`);
                return newCard;
            };

            const handleSaveTransaction = async (txData) => {
                let cardNum = formatCardNumber(txData.etollNumber);
                if (cardNum && !cards.some(c => (c.number || '').replace(/\D/g, '') === cardNum.replace(/\D/g, ''))) {
                    const cleanNum = cardNum.replace(/\D/g, '');
                    const officialData = OFFICIAL_DRIVER_MAP[cleanNum];
                    const matchedPreset = INITIAL_CARDS.find(ic => (ic.number || '').replace(/\D/g, '') === cleanNum);
                    handleAddCard({
                        label: officialData?.name || matchedPreset?.label || txData.merchant || 'Driver Baru',
                        nopol: officialData?.nopol || matchedPreset?.nopol || '',
                        number: cardNum
                    });
                }

                const updatedTx = { 
                    id: txData.id || ('tx_' + Date.now() + '_' + Math.random().toString(36).substring(2, 6)),
                    etollNumber: cardNum,
                    merchant: txData.merchant,
                    amount: Number(txData.amount || 0),
                    invoiceNumber: txData.invoiceNumber,
                    date: txData.date,
                    gdriveUrl: txData.gdriveUrl || '',
                    source: txData.source || 'Web Scan / Manual',
                    createdAt: txData.createdAt || new Date().toISOString()
                };

                setTransactions(prev => [updatedTx, ...prev.filter(t => t.id !== updatedTx.id)]);
                if (updatedTx.date) setSelectedMonth(updatedTx.date.substring(0, 7));

                if (firebaseProjectId) {
                    try {
                        const targetPid = firebaseProjectId.trim();
                        const primaryUrl = `https://${targetPid}-default-rtdb.asia-southeast1.firebasedatabase.app/transactions/${updatedTx.id}.json`;

                        const response = await fetch(primaryUrl, {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(updatedTx)
                        });
                        if (!response.ok) throw new Error(`Firebase HTTP ${response.status}`);
                    } catch (e) { console.error("Cloud Push Error:", e); }
                }

                setShowScanModal(false);
                setEditingTx(null);
                showToastNotification('Transaksi berhasil dicatat!');
            };

                        const response = await fetch(dbUrl, { method: 'DELETE' });
                        if (!response.ok) throw new Error(`Firebase HTTP ${response.status}`);
                        showToastNotification('Transaksi dihapus dari Firebase Database!', 'info');

                        showToastNotification('Terhapus di lokal, gagal di Firebase.', 'error');

                    ["RINGKASAN DEPOSIT UANG MUKA & REALISASI"],

                    [""],

                    data.push([

                        c.label,
                        c.bank,
                        c.number,
                        c.count,
                        c.total

                    const matchesCard = selectedCardFilter === 'ALL' || cleanTxCard === cleanCardFilter;
                    const matchesSearch = !searchQuery ||

                        (t.invoiceNumber && t.invoiceNumber.toLowerCase().includes(searchQuery.toLowerCase())) ||
                        (t.etollNumber && t.etollNumber.toLowerCase().includes(searchQuery.toLowerCase()));
                    return matchesCard && matchesSearch;
                });

                if (sortConfig.key) {
                    result.sort((a, b) => {
                        let aVal = a[sortConfig.key] || '';
                        let bVal = b[sortConfig.key] || '';
                        if (sortConfig.key === 'amount') {
                            aVal = Number(aVal || 0);
                            bVal = Number(bVal || 0);
                        }
                        if (aVal < bVal) return sortConfig.direction === 'asc' ? -1 : 1;
                        if (aVal > bVal) return sortConfig.direction === 'asc' ? 1 : -1;
                        return 0;
                    });
                }
                return result;
            }, [monthlyTransactions, selectedCardFilter, searchQuery, sortConfig]);

            const handleSort = (key) => {
                setSortConfig(prev => ({
                    key,
                    direction: prev.key === key && prev.direction === 'asc' ? 'desc' : 'asc'

            const monthTotalSpent = React.useMemo(() => {
                return monthlyTransactions.reduce((s, t) => s + Number(t.amount || 0), 0);
            }, [monthlyTransactions]);

            const tableStats = React.useMemo(() => {
                const count = filteredTransactions.length;
                const total = filteredTransactions.reduce((s, t) => s + Number(t.amount || 0), 0);
                const avg = count > 0 ? total / count : 0;
                const max = count > 0 ? Math.max(...filteredTransactions.map(t => Number(t.amount || 0))) : 0;
                return { count, total, avg, max };
            }, [filteredTransactions]);

            const cardBreakdown = React.useMemo(() => {
                const cardMap = {};

                cards.forEach(c => {
                    const formattedNum = formatCardNumber(c.number);
                    const cleanNum = formattedNum.replace(/\D/g, '');
                    cardMap[cleanNum] = {
                        id: c.id,
                        label: c.label,
                        nopol: c.nopol,
                        bank: c.bank,
                        number: formattedNum,
                        total: 0,
                        count: 0
                    };
                });

                monthlyTransactions.forEach(t => {
                    const formattedNum = formatCardNumber(t.etollNumber);
                    const cleanNum = formattedNum.replace(/\D/g, '');
                    if (cleanNum) {
                        if (!cardMap[cleanNum]) {
                            const detected = detectBankFromCardNumber(formattedNum, t.merchant);
                            cardMap[cleanNum] = {
                                id: 'unregistered-' + cleanNum,
                                label: `${t.merchant || detected.label}`,
                                nopol: 'AD 1214 XU',
                                bank: detected.bank,
                                number: formattedNum,
                                total: 0,
                                count: 0
                            };
                        }
                        cardMap[cleanNum].total += Number(t.amount || 0);
                        cardMap[cleanNum].count += 1;
                    }
                });

                const list = Object.values(cardMap).filter(item => item.total > 0);
                list.sort((a, b) => b.total - a.total);
                return list;
            }, [cards, monthlyTransactions]);

            // List driver SPJ yang diurutkan sesuai pilihan kriteria
            const sortedSpjDriverList = React.useMemo(() => {
                const list = [...cardBreakdown];
                list.sort((a, b) => {
                    if (spjSortBy === 'total-desc') return b.total - a.total;
                    if (spjSortBy === 'total-asc') return a.total - b.total;
                    if (spjSortBy === 'name-asc') return (a.label || '').localeCompare(b.label || '');
                    if (spjSortBy === 'nopol-asc') return (a.nopol || '').localeCompare(b.nopol || '');
                    if (spjSortBy === 'card-asc') return (a.number || '').localeCompare(b.number || '');
                    return 0;
                });
                return list;
            }, [cardBreakdown, spjSortBy]);

            const activeDeposit = monthlyDeposits[selectedMonth] || 0;
            const depositBalance = activeDeposit - monthTotalSpent;

            // Analisis Pengeluaran Berdasarkan Bank Penerbit Kartu
            const bankBreakdown = React.useMemo(() => {
                const map = {};
                monthlyTransactions.forEach(t => {
                    const info = detectBankFromCardNumber(t.etollNumber, t.merchant);
                    const bName = info.bank || 'Lainnya';
                    if (!map[bName]) {
                        map[bName] = { bank: bName, label: info.label, color: info.color, total: 0, count: 0 };
                    }
                    map[bName].total += Number(t.amount || 0);
                    map[bName].count += 1;
                });
                return Object.values(map).sort((a, b) => b.total - a.total);
            }, [monthlyTransactions]);

            // Analisis Tren Pengeluaran Harian dalam Bulan Terpilih
            const dailyTimeline = React.useMemo(() => {
                const map = {};
                monthlyTransactions.forEach(t => {
                    const d = t.date || 'Lainnya';
                    if (!map[d]) {
                        map[d] = { date: d, total: 0, count: 0 };
                    }
                    map[d].total += Number(t.amount || 0);
                    map[d].count += 1;
                });
                return Object.values(map).sort((a, b) => (a.date > b.date ? 1 : -1));
            }, [monthlyTransactions]);

            // Hitung Rasio Penyerapan Kasbon
            const absorptionPercent = activeDeposit > 0 ? Math.min(100, Math.round((monthTotalSpent / activeDeposit) * 100)) : 0;
            const isLiveMonthActive = selectedMonth === currentYearMonth;

            return (
                <div className="min-h-screen flex flex-col relative overflow-hidden">

                        <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-brand-600 via-indigo-600 to-purple-600 flex items-center justify-center text-white shadow-lg shadow-brand-500/20 border border-brand-400/30">
                                    <i className="fa-solid fa-road text-lg"></i>
                                </div>
                                <div>
                                    <h1 className="font-black text-xl bg-gradient-to-r from-blue-400 via-indigo-300 to-purple-400 bg-clip-text text-transparent flex items-center gap-2">
                                        RekapToll
                                        <span className={`text-[10px] font-bold px-2.5 py-0.5 rounded-full border flex items-center gap-1.5 ${
                                            syncStatus.state === 'success' ? 'bg-emerald-500/20 text-emerald-300 border-emerald-500/30' :
                                            syncStatus.state === 'error' ? 'bg-rose-500/20 text-rose-300 border-rose-500/30' :
                                            'bg-sky-500/20 text-sky-300 border-sky-500/30'
                                        }`}>
                                            <span className={`w-2 h-2 rounded-full ${
                                                syncStatus.state === 'success' ? 'bg-emerald-400 animate-pulse' :
                                                syncStatus.state === 'error' ? 'bg-rose-400' : 'bg-sky-400 animate-spin'
                                            }`}></span>
                                            <span>{syncStatus.state === 'success' ? 'Cloud Synced' : syncStatus.state === 'error' ? 'Sync Error' : 'Connecting...'}</span>
                                        </span>
                                    </h1>
                                </div>
                            </div>

                            <div className="flex items-center gap-2">
                                <button onClick={() => setShowNfcModal(true)} className="bg-purple-600/80 hover:bg-purple-600 text-white font-medium px-3.5 py-2 rounded-xl text-xs sm:text-sm flex items-center gap-2 shadow-lg shadow-purple-900/30 border border-purple-400/30 transition backdrop-blur-md">
                                    <i className="fa-solid fa-nfc-symbol text-sm animate-pulse"></i>
                                    <span>NFC Reader</span>
                                </button>
                                <button onClick={() => setShowScanModal(true)} className="bg-gradient-to-r from-brand-600 to-indigo-600 hover:from-brand-500 hover:to-indigo-500 text-white font-medium px-3.5 py-2 rounded-xl text-xs sm:text-sm flex items-center gap-2 shadow-lg shadow-brand-900/40 border border-brand-400/30 transition">
                                    <i className="fa-solid fa-camera text-xs"></i>

                                    <i className={`fa-solid ${isAdminMode ? 'fa-lock-open' : 'fa-user-shield'} text-xs`}></i>

                                        <i className="fa-solid fa-database text-rose-400"></i> Master Data & Reset
                                    </button>
                                </>

                    </header>

                    {showAdminLogin && (

                                <div className="flex items-center gap-3">

                    {toast && (

                                <i className={`fa-solid ${toast.type === 'error' ? 'fa-circle-xmark text-rose-400' : 'fa-circle-check text-emerald-400'} text-sm`}></i>
                                <span>{toast.msg}</span>
                            </div>
