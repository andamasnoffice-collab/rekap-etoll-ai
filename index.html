<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RekapToll - Rekapitulasi e-Toll OCR & Anti Duplikat (Cloud Synced)</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f7ff',
                            100: '#e0effe',
                            500: '#2563eb',
                            600: '#1d4ed8',
                            700: '#1e40af',
                            800: '#1e3a8a',
                            900: '#172554',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts & CDN Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- React & Babel Standalone -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.05); border-radius: 8px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.2); border-radius: 8px; }
        @media print {
            .no-print { display: none !important; }
            body { background: white !important; color: black !important; }
        }
    </style>
</head>
<body class="text-slate-800 dark:text-slate-100 dark:bg-slate-900 transition-colors duration-200">
    <div id="root"></div>

    <script type="text/babel">

        // Helper Functions
        function formatRupiah(number) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(number || 0);
        }

        function formatDateIndo(dateString) {
            if (!dateString) return '-';
            const date = new Date(dateString);
            if (isNaN(date.getTime())) return dateString;
            return new Intl.DateTimeFormat('id-ID', { day: 'numeric', month: 'short', year: 'numeric' }).format(date);
        }

        function formatCardNumber(val) {
            if (!val) return '';
            const cleaned = val.toString().replace(/\D/g, '').slice(0, 16);
            return cleaned.replace(/(.{4})/g, '$1 ').trim();
        }

        function terbilangRupiah(num) {
            const angka = ["", "Satu", "Dua", "Tiga", "Empat", "Lima", "Enam", "Tujuh", "Delapan", "Sembilan", "Sepuluh", "Sebelas"];
            num = Math.floor(Math.abs(num || 0));
            if (num === 0) return "Nol Rupiah";
            function terbilang(n) {
                if (n < 12) return angka[n];
                if (n < 20) return terbilang(n - 10) + " Belas";
                if (n < 100) return terbilang(Math.floor(n / 10)) + " Puluh " + terbilang(n % 10);
                if (n < 1000) return "Seratus " + terbilang(n - 100);
                if (n < 1000) return terbilang(Math.floor(n / 100)) + " Ratus " + terbilang(n % 100);
                if (n < 2000) return "Seribu " + terbilang(n - 1000);
                if (n < 1000000) return terbilang(Math.floor(n / 1000)) + " Ribu " + terbilang(n % 1000);
                if (n < 1000000000) return terbilang(Math.floor(n / 1000000)) + " Juta " + terbilang(n % 1000000);
                return terbilang(Math.floor(n / 1000000000)) + " Milyar " + terbilang(n % 1000000000);
            }
            return terbilang(num).replace(/\s+/g, ' ').trim() + " Rupiah";
        }

        // Gemini OCR Call
        async function callGeminiOCR(base64DataUrl, userApiKey) {
            let mimeType = "image/png";
            let base64Data = base64DataUrl;
            const match = base64DataUrl.match(/^data:(image\/[a-zA-Z]+);base64,(.+)$/);
            if (match) {
                mimeType = match[1];
                base64Data = match[2];
            }

            const systemPrompt = "Anda adalah sistem OCR multimodal khusus mengekstrak data dari invoice e-Toll Indonesia.";
            const userPrompt = "Ekstrak: etollNumber (16 digit), merchant, amount, invoiceNumber, date (YYYY-MM-DD).";
            const apiKey = userApiKey || "";
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

            const payload = {
                contents: [{ role: "user", parts: [{ text: userPrompt }, { inlineData: { mimeType, data: base64Data } }] }],
                systemInstruction: { parts: [{ text: systemPrompt }] },
                generationConfig: {
                    responseMimeType: "application/json",
                    responseSchema: {
                        type: "OBJECT",
                        properties: {
                            etollNumber: { type: "STRING" },
                            merchant: { type: "STRING" },
                            amount: { type: "NUMBER" },
                            invoiceNumber: { type: "STRING" },
                            date: { type: "STRING" }
                        },
                        required: ["etollNumber", "merchant", "amount", "invoiceNumber", "date"]
                    }
                }
            };

            const response = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            if (!response.ok) throw new Error("Gagal OCR.");
            const result = await response.json();
            return JSON.parse(result.candidates[0].content.parts[0].text);
        }

        const INITIAL_CARDS = [
            { id: 'card-1', label: 'Mandiri e-Money Utama', number: '6032 9812 3456 7890', bank: 'Mandiri', color: 'from-blue-600 to-indigo-700' },
            { id: 'card-2', label: 'BCA Flazz Operasional', number: '6013 1234 5678 9012', bank: 'BCA', color: 'from-sky-500 to-blue-600' }
        ];

        const currentYearMonth = new Date().toISOString().substring(0, 7);

        function App() {
            const [cards, setCards] = React.useState(() => JSON.parse(localStorage.getItem('etoll_cards')) || INITIAL_CARDS);
            const [transactions, setTransactions] = React.useState(() => JSON.parse(localStorage.getItem('etoll_transactions')) || []);
            const [firebaseProjectId, setFirebaseProjectId] = React.useState(() => localStorage.getItem('etoll_fb_pid') || '');
            const [geminiApiKey, setGeminiApiKey] = React.useState(() => localStorage.getItem('etoll_gemini_key') || '');

            const [spjProfile, setSpjProfile] = React.useState(() => JSON.parse(localStorage.getItem('etoll_spj_profile')) || {
                applicantName: 'Ahmad Subagja',
                division: 'Operasional Logistik',
                vehicleNopol: 'B 1928 SFA',
                companyName: 'PT Nusantara Trans',
                supervisorName: 'Hendra Wijaya'
            });

            const [activeTab, setActiveTab] = React.useState('dashboard');
            const [selectedMonth, setSelectedMonth] = React.useState(currentYearMonth);
            const [selectedCardFilter, setSelectedCardFilter] = React.useState('ALL');
            const [searchQuery, setSearchQuery] = React.useState('');

            const [showScanModal, setShowScanModal] = React.useState(false);
            const [showNfcModal, setShowNfcModal] = React.useState(false);
            const [showSpjPrintModal, setShowSpjPrintModal] = React.useState(false);
            const [previewReceiptImg, setPreviewReceiptImg] = React.useState(null);
            const [editingTransaction, setEditingTransaction] = React.useState(null);
            const [deletingTx, setDeletingTx] = React.useState(null);
            const [toast, setToast] = React.useState(null);

            // Fetch Firebase Firestore real-time updates
            const fetchCloudData = React.useCallback(async () => {
                if (!firebaseProjectId) return;
                try {
                    const url = `https://firestore.googleapis.com/v1/projects/${firebaseProjectId}/databases/(default)/documents/etoll_transactions`;
                    const res = await fetch(url);
                    if (!res.ok) return;
                    const data = await res.json();
                    if (data.documents) {
                        const cloudTxs = data.documents.map(d => {
                            const f = d.fields;
                            return {
                                id: d.name.split('/').pop(),
                                etollNumber: f.etollNumber?.stringValue || '',
                                merchant: f.merchant?.stringValue || '',
                                amount: Number(f.amount?.integerValue || f.amount?.doubleValue || 0),
                                invoiceNumber: f.invoiceNumber?.stringValue || '',
                                date: f.date?.stringValue || '',
                                receiptImg: f.receiptImg?.stringValue || null,
                                createdAt: f.createdAt?.stringValue || new Date().toISOString(),
                                source: f.source?.stringValue || 'Cloud'
                            };
                        });
                        setTransactions(cloudTxs);
                    }
                } catch (e) {
                    console.warn("Cloud Syncing Error:", e);
                }
            }, [firebaseProjectId]);

            // Auto poll cloud data every 10 seconds if Firebase is configured
            React.useEffect(() => {
                fetchCloudData();
                const interval = setInterval(fetchCloudData, 10000);
                return () => clearInterval(interval);
            }, [fetchCloudData]);

            // Sync LocalStorage
            React.useEffect(() => { localStorage.setItem('etoll_cards', JSON.stringify(cards)); }, [cards]);
            React.useEffect(() => { localStorage.setItem('etoll_transactions', JSON.stringify(transactions)); }, [transactions]);
            React.useEffect(() => { localStorage.setItem('etoll_fb_pid', firebaseProjectId); }, [firebaseProjectId]);
            React.useEffect(() => { localStorage.setItem('etoll_gemini_key', geminiApiKey); }, [geminiApiKey]);

            const showToastNotification = (msg, type = 'success') => {
                setToast({ msg, type });
                setTimeout(() => setToast(null), 4000);
            };

            const checkDuplicateInvoice = (invoiceNum, excludeId = null) => {
                if (!invoiceNum || !invoiceNum.trim()) return false;
                const clean = invoiceNum.trim().toUpperCase();
                return transactions.some(t => t.id !== excludeId && t.invoiceNumber && t.invoiceNumber.trim().toUpperCase() === clean);
            };

            const handleAddCard = (newCardData) => {
                const formattedNum = formatCardNumber(newCardData.number);
                const existing = cards.find(c => c.number.replace(/\s+/g, '') === formattedNum.replace(/\s+/g, ''));
                if (existing) return existing;

                const newCard = {
                    id: 'card-' + Date.now(),
                    label: newCardData.label || 'e-Toll Card ' + (cards.length + 1),
                    number: formattedNum,
                    bank: newCardData.bank || 'Mandiri',
                    color: 'from-indigo-600 to-purple-700'
                };
                setCards(prev => [...prev, newCard]);
                showToastNotification(`Kartu e-Toll baru (${formattedNum}) berhasil ditambahkan.`);
                return newCard;
            };

            const handleSaveTransaction = async (txData) => {
                let cardNum = formatCardNumber(txData.etollNumber);
                if (cardNum && !cards.some(c => c.number.replace(/\s+/g, '') === cardNum.replace(/\s+/g, ''))) {
                    handleAddCard({ label: 'Auto ' + (txData.merchant || 'Card'), number: cardNum, bank: 'e-Toll' });
                }

                if (txData.id) {
                    setTransactions(prev => prev.map(t => t.id === txData.id ? { ...txData, etollNumber: cardNum } : t));
                } else {
                    const newTx = { ...txData, id: 'tx-' + Date.now(), etollNumber: cardNum, createdAt: new Date().toISOString() };
                    setTransactions(prev => [newTx, ...prev]);
                    
                    if (newTx.date) setSelectedMonth(newTx.date.substring(0, 7));
                    setSelectedCardFilter('ALL');

                    // If Cloud is enabled, push directly
                    if (firebaseProjectId) {
                        try {
                            const url = `https://firestore.googleapis.com/v1/projects/${firebaseProjectId}/databases/(default)/documents/etoll_transactions`;
                            await fetch(url, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    fields: {
                                        etollNumber: { stringValue: newTx.etollNumber },
                                        merchant: { stringValue: newTx.merchant },
                                        amount: { integerValue: newTx.amount },
                                        invoiceNumber: { stringValue: newTx.invoiceNumber },
                                        date: { stringValue: newTx.date },
                                        receiptImg: { stringValue: newTx.receiptImg || '' },
                                        createdAt: { stringValue: newTx.createdAt }
                                    }
                                })
                            });
                        } catch (e) { console.error("Cloud Save Error:", e); }
                    }
                }
                setShowScanModal(false);
                setEditingTransaction(null);
                showToastNotification('Transaksi berhasil dicatat!');
            };

            const handleDeleteTransaction = (id) => {
                setTransactions(prev => prev.filter(t => t.id !== id));
                setDeletingTx(null);
                showToastNotification('Transaksi dihapus. Nomor invoice kini dapat di-scan/digunakan kembali.', 'info');
            };

            return (
                <div className="min-h-screen flex flex-col">
                    <header className="sticky top-0 z-40 bg-white/90 dark:bg-slate-800/90 backdrop-blur-md border-b border-slate-200 dark:border-slate-700 shadow-sm">
                        <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-indigo-600 flex items-center justify-center text-white shadow-md">
                                    <i className="fa-solid fa-[#1e3a8a] fa-road text-lg"></i>
                                </div>
                                <div>
                                    <h1 className="font-black text-xl bg-gradient-to-r from-brand-600 to-indigo-600 bg-clip-text text-transparent">
                                        RekapToll <span className="text-xs font-semibold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700">24/7 Cloud Sync</span>
                                    </h1>
                                </div>
                            </div>

                            <div className="flex items-center gap-2">
                                <button onClick={() => setShowNfcModal(true)} className="bg-purple-600 hover:bg-purple-700 text-white font-medium px-3.5 py-2 rounded-xl text-xs sm:text-sm flex items-center gap-2">
                                    <i className="fa-solid fa-nfc-symbol text-sm animate-pulse"></i>
                                    <span>NFC Reader</span>
                                </button>
                                <button onClick={() => { setEditingTransaction(null); setShowScanModal(true); }} className="bg-brand-600 hover:bg-brand-700 text-white font-medium px-3.5 py-2 rounded-xl text-xs sm:text-sm flex items-center gap-2">
                                    <i className="fa-solid fa-camera text-xs"></i>
                                    <span>Scan Struk</span>
                                </button>
                            </div>
                        </div>

                        <div className="max-w-7xl mx-auto px-4 flex space-x-2 border-t border-slate-100 dark:border-slate-700/50 overflow-x-auto">
                            <button onClick={() => setActiveTab('dashboard')} className={`py-2.5 px-4 text-xs font-semibold border-b-2 flex items-center gap-2 ${activeTab === 'dashboard' ? 'border-brand-600 text-brand-600' : 'text-slate-500'}`}>
                                <i className="fa-solid fa-chart-pie"></i> Dasbor
                            </button>
                            <button onClick={() => setActiveTab('transactions')} className={`py-2.5 px-4 text-xs font-semibold border-b-2 flex items-center gap-2 ${activeTab === 'transactions' ? 'border-brand-600 text-brand-600' : 'text-slate-500'}`}>
                                <i className="fa-solid fa-receipt"></i> Transaksi ({transactions.length})
                            </button>
                            <button onClick={() => setActiveTab('cloud_config')} className={`py-2.5 px-4 text-xs font-semibold border-b-2 flex items-center gap-2 ${activeTab === 'cloud_config' ? 'border-brand-600 text-brand-600' : 'text-slate-500'}`}>
                                <i className="fa-solid fa-cloud text-sky-500"></i> Integrasi Bot 24 Jam
                            </button>
                        </div>
                    </header>

                    {toast && (
                        <div className="fixed bottom-5 right-5 z-50">
                            <div className="px-4 py-3 rounded-2xl bg-slate-900 text-white flex items-center gap-3 text-xs font-medium shadow-2xl">
                                <i className="fa-solid fa-circle-check text-emerald-400"></i>
                                <span>{toast.msg}</span>
                            </div>
                        </div>
                    )}

                    <main className="flex-1 max-w-7xl w-full mx-auto px-4 py-6 space-y-6">
                        {activeTab === 'dashboard' && (
                            <div className="space-y-6">
                                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                    <div className="bg-white dark:bg-slate-800 p-5 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm">
                                        <p className="text-xs font-bold text-slate-400 uppercase">Total e-Toll Bulan Ini</p>
                                        <h3 className="text-2xl font-black text-slate-900 dark:text-white mt-1">
                                            {formatRupiah(transactions.filter(t => t.date && t.date.startsWith(selectedMonth)).reduce((s,t) => s + Number(t.amount||0), 0))}
                                        </h3>
                                    </div>
                                    <div className="bg-white dark:bg-slate-800 p-5 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm">
                                        <p className="text-xs font-bold text-slate-400 uppercase">Jumlah Transaksi</p>
                                        <h3 className="text-2xl font-black text-slate-900 dark:text-white mt-1">
                                            {transactions.filter(t => t.date && t.date.startsWith(selectedMonth)).length} Transaksi
                                        </h3>
                                    </div>
                                    <div className="bg-white dark:bg-slate-800 p-5 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm">
                                        <p className="text-xs font-bold text-slate-400 uppercase">Status Sync Cloud 24/7</p>
                                        <h3 className="text-sm font-bold text-emerald-500 mt-2 flex items-center gap-1">
                                            <i className="fa-solid fa-signal animate-pulse"></i> {firebaseProjectId ? 'Terhubung (Firebase Live)' : 'Lokal Mode'}
                                        </h3>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'transactions' && (
                            <div className="bg-white dark:bg-slate-800 rounded-2xl border p-4 space-y-4">
                                <h3 className="font-extrabold text-sm">Daftar Transaksi e-Toll Real-Time</h3>
                                <div className="overflow-x-auto">
                                    <table className="w-full text-left text-xs">
                                        <thead>
                                            <tr className="bg-slate-50 dark:bg-slate-900 text-slate-400 uppercase font-bold text-[10px]">
                                                <th className="p-3">Tanggal</th>
                                                <th className="p-3">Merchant</th>
                                                <th className="p-3">Nomor e-Toll</th>
                                                <th className="p-3">No. Invoice</th>
                                                <th className="p-3 text-right">Nominal</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y">
                                            {transactions.map(t => (
                                                <tr key={t.id}>
                                                    <td className="p-3">{formatDateIndo(t.date)}</td>
                                                    <td className="p-3 font-bold">{t.merchant}</td>
                                                    <td className="p-3 font-mono text-purple-600 font-bold">{t.etollNumber}</td>
                                                    <td className="p-3 font-mono">{t.invoiceNumber}</td>
                                                    <td className="p-3 text-right font-black">{formatRupiah(t.amount)}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {activeTab === 'cloud_config' && (
                            <div className="bg-white dark:bg-slate-800 p-6 rounded-3xl border space-y-4 max-w-2xl mx-auto">
                                <h3 className="font-extrabold text-lg flex items-center gap-2 text-brand-600">
                                    <i className="fa-solid fa-cloud"></i> Pengaturan Cloud Sync Bot 24 Jam
                                </h3>
                                <div className="space-y-3 text-xs">
                                    <div>
                                        <label className="block font-bold mb-1">Firebase Project ID (Cloud Database):</label>
                                        <input
                                            type="text"
                                            placeholder="rekaptoll-db-12345"
                                            value={firebaseProjectId}
                                            onChange={(e) => setFirebaseProjectId(e.target.value)}
                                            className="w-full p-2.5 bg-slate-50 border rounded-xl font-mono"
                                        />
                                    </div>
                                    <div>
                                        <label className="block font-bold mb-1">Gemini AI API Key (OCR):</label>
                                        <input
                                            type="password"
                                            placeholder="AIzaSy..."
                                            value={geminiApiKey}
                                            onChange={(e) => setGeminiApiKey(e.target.value)}
                                            className="w-full p-2.5 bg-slate-50 border rounded-xl font-mono"
                                        />
                                    </div>
                                    <p className="text-[11px] text-slate-500">
                                        Setelah memasukkan Firebase Project ID, data transaksi yang dikirim ke Telegram Bot 24 Jam akan otomatis tersinkronisasi ke tampilan web ini secara real-time!
                                    </p>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
